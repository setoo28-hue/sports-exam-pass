<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px;z-index:5;display:flex;align-items:center;gap:10px}

.wrap{padding:16px;max-width:640px;margin:0 auto}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer}
.subj b{display:block;font-size:14px;margin-bottom:4px}
.subj span{font-size:12px;color:var(--sub)}
.row{display:flex;gap:10px;margin:16px 0}
.btn{flex:1;padding:14px;border-radius:14px;border:0;background:var(--brand);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:10px}
.pbar{height:6px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:16px}
.pbar>i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}
.stem{font-size:16px;line-height:1.65;margin:0 0 16px;white-space:pre-wrap}
.choices{display:flex;flex-direction:column;gap:10px}

.choice.ok{border-color:var(--ok);background:#ecfdf5}
.choice.ok i{color:var(--ok)}
.choice.bad{border-color:var(--bad);background:#fef2f2}
.choice.bad i{color:var(--bad)}
.feedback{font-size:13px;line-height:1.6;margin-top:12px;padding:12px;border-radius:12px;display:none}
.feedback.show{display:block}
.feedback.ok{background:#ecfdf5;color:#065f46}
.feedback.bad{background:#fef2f2;color:#991b1b}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:40px 0}
.big{font-size:40px;font-weight:800;margin:8px 0}
.muted{color:var(--sub);font-size:13px}
.lic{font-size:11px;color:var(--sub);line-height:1.6;margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
.lock{background:#111827;color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}

.lock button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:14px}
.okmsg{font-size:12px;color:#a7f3d0;margin-top:8px}

","qno":7,"stem":"<보기> 중 스포츠가 미디어에 미친 영향에 해당하는 것으로만 묶은 것은? <보기>. ㄱ. 탁구공의 색이 흰색에서 주황색으로 변경되었다. ㄴ. 월드컵, 올림픽은 미디어 보급 및 확산에 기여하였다. ㄷ. 정지 화면, 느린 화면, 클로즈업 등의 방송 기법이 발달하였다. ㄹ. 스포츠 관람 인구가 증가하고, 스포츠 활동이 생활의 일부로 확산되었다.","choices":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄹ"],"answer":[3]},{"id":"2025-2급-스포츠사회학-08","year":2025,"level":"2급","subject":"스포츠사회학","qno":8,"stem":"<보기>에서 설명하는 스포츠사회학 이론으로 적절한 것은? <보기>. ∙미시적 관점의 이론이다. ∙스포츠 참여 과정에 대한 이해와 하위문화 특성에 관심을 가진다. ∙인간은 사회구조 및 제도에 대해 능동적으로 사고하며 행동하게 된다.","choices":["갈등이론","비판이론","구조기능주의이론","상징적 상호작용론"],"answer":[4]},{"id":"2025-2급-스포츠사회학-09","year":2025,"level":"2급","subject":"스포츠사회학","qno":9,"stem":"국제스포츠 사례에 관한 설명으로 옳지 않은 것은?","choices":["1969년 온두라스와 엘살바도르의 월드컵 예선전은 양국의 정치적･ 사회적 갈등이 격화되는 계기가 되었으며, 이후 무력 충돌로 이어 졌다.","2008년 베이징올림픽경기대회 개최를 앞두고 중국의 티베트 인권 탄압에 대한 국제사회의 비판이 제기되었다.","1988년 서울올림픽경기대회에는 모스크바올림픽경기대회와 LA올림픽 경기대회의 보이콧 사례와 달리 미국과 소련 등 동서 진영 국가들이 참여하였다.","1995년 남아프리카공화국 럭비월드컵경기대회에서는 아파르트헤이트 (apartheid)에 대한 국제사회의 반발로 다수 국가의 보이콧이 발생했다."],"answer":[4]},{"id":"2025-2급-스포츠사회학-10","year":2025,"level":"2급","subject":"스포츠사회학","qno":10,"stem":"<보기>의 ㄱ에 해당하는 로버트슨(R. Robertson)이 제시한 스포츠 세계화의 결과와 ㄴ에 해당하는 매기(J. Magee)와 서덴(J. Sugden)이 제시한 스포츠 노동 이주 유형으로 가장 적절한 것은? <보기>. ㄱ. A 스포츠 업체는 글로벌 브랜드 정체성을 유지하면서 뉴질랜드 럭비 대표팀인 올 블랙스(All Blacks)의 경기 전 의식으로 잘 알려진 마오리족의 하카(haka)댄스를 광고에 포함함으로써 지역 문화를 브랜드 메시지에 자연스럽게 녹여냈다. ㄴ. 축구 선수 B는 현재 베트남의 C팀에서 활동 중이다. 그의 관심은 오로지 더 높은 연봉을 제시하는 팀으로 이적하는 것이다. 베트남의 문화를 즐긴다거나 사람과의 관계를 맺는 것에는 관심이 없다. 그는 언제든 떠날 준비를 하고 있다. 이전에 활동했던 중국의 D팀, 사우디의 E팀이 위치한 지역에 오래 머무른 적도 없다.","choices":["세방화(glocalization) 용병형(mercenaries)","세방화(glocalization) 개척자형(pioneers)","국제적 고립(global isolation) 용병형(mercenaries)","국제적 고립(global isolation) 개척자형(pioneers)"],"answer":[1]},{"id":"2025-2급-스포츠사회학-11","year":2025,"level":"2급","subject":"스포츠사회학","qno":11,"stem":"<보기>의 사례에 해당하는 머튼(R. Merton)의 일탈행동 유형은? <보기>. ㄱ. 승리지상주의에 염증을 느껴 선수 생활을 포기하는 경우 ㄴ. 프로스포츠 선수가 경기력 향상을 목적으로 불법 약물을 복용한 경우 ㄷ. 스포츠 경기 참가에 의의를 두지만, 경기 성적을 중시하지 않는 경우","choices":["도피주의 혁신주의 의례주의","도피주의 동조주의 의례주의","반역주의 도피주의 혁신주의","반역주의 동조주의 혁신주의"],"answer":[1]},{"id":"2025-2급-스포츠사회학-12","year":2025,"level":"2급","subject":"스포츠사회학","qno":12,"stem":"<보기>의 스포츠 계층 이동 유형과 사례에 관한 설명으로 옳은 것을 모두 고른 것은? <보기>. ㄱ. 프로야구 선수가 대회에서 부진한 모습을 보여 2군으로 강등된 것은 수직이동의 사례이다. ㄴ. 1980년대 프로스포츠 출범 후 운동선수의 지위가 전반적으로 높게 평가받게 된 것은 집단이동의 사례이다. ㄷ. 프로배구 선수가 되면서 일용직 노동자였던 부모님에 비해 많은 수입과 높은 명성을 얻게 된 것은 세대 내 이동의 사례이다. ㄹ. 고등학교 배구 선수가 전학 간 후에도 같은 포지션으로 활동한 것은 수평이동의 사례이다.","choices":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":[3]},{"id":"2025-2급-스포츠사회학-13","year":2025,"level":"2급","subject":"스포츠사회학","qno":13,"stem":"스포츠사회화 이론에 관한 설명으로 적절하지 않은 것은?","choices":["사회학습이론에서는 다른 구성원의 행동을 관찰학습하여 사회화가 이루어진다고 설명한다.","사회학습이론에서는 모방, 강화 등을 통해 새로운 행동을 학습하여 사회화가 이루어진다고 설명한다.","준거집단이론에서는 구성원이 속한 집단의 규칙을 따르지 않아도 사회화가 이루어진다고 설명한다.","역할이론에서는 개인을 무대 위의 특정 역할을 부여받은 배우로 간주하여 그 역할을 수행하며 사회화가 이루어진다고 설명한다."],"answer":[3]},{"id":"2025-2급-스포츠사회학-14","year":2025,"level":"2급","subject":"스포츠사회학","qno":14,"stem":"<보기>는 스포츠사회학 수업에서 교수와 학생의 대화이다. ㉠, ㉡에 들어갈 내용으로 적절한 것은? <보기>. 학생 1: 최근 테니스와 마라톤이 인기를 끌고 있는데, 사람들이 왜 이런 스포츠에 열광하는지 다양한 사례를 심층적으로 알아 보려면 어떤 연구 방법이 좋은가요? 교수: 참여관찰, 심층면담 등으로 자료를 수집하고 해석적인 절차에 따라 원인을 파악하는 ( ㉠ ) 방법이 적합해요. 학생 2: 그러면 스포츠 육성 모델에는 어떤 것이 있나요? 교수: 국가별로 다양한 스포츠육성정책을 시행하고 있는데, 그릭스*에 따르면, 스포츠 선진국은 엘리트 스포츠의 성과가 일반시민의 스포츠 참가를 촉진하고, 그렇게 형성된 자원 속에서 다시 우수한 엘리트 선수가 탄생하여 국가이미지 향상에 기여하는 ( ㉡ )을 구축하고 있다고 해요. * J. Grix(2016) ㉠ ㉡","choices":["질적 연구 선순환 모델","양적 연구 선순환 모델","질적 연구 피라미드 모델","양적 연구 피라미드 모델"],"answer":[1]},{"id":"2025-2급-스포츠사회학-15","year":2025,"level":"2급","subject":"스포츠사회학","qno":15,"stem":"<보기>의 내용에 해당하는 거트만(A. Guttmann)이 제시한 근대스포츠의 특징은? <보기>. ㄱ. 인종･성별과 관계없이 누구나 스포츠에 참여할 기회를 동등하게 부여받는다. ㄴ. 현대 축구가 발전하면서 점차 수비수, 미드필더, 공격수 등의 포지션이 다양화되었다. ㄷ. 현대스포츠 참여자는 신에 대한 숭배가 아니라 기분 전환과 오락, 이익과 보상을 추구한다. ㄹ. 국제스포츠연맹은 규칙 제정, 기록 공인, 국제대회 운영 및 관리, 종목 진흥 등의 역할을 담당한다.","choices":["합리화 평등성 세속화 관료화","합리화 수량화 전문화 세속화","평등성 관료화 세속화 전문화","평등성 전문화 세속화 관료화"],"answer":[4]},{"id":"2025-2급-스포츠사회학-16","year":2025,"level":"2급","subject":"스포츠사회학","qno":16,"stem":"<보기>의 사례에 해당하는 베커(H. Becker)의 스포츠 일탈 이론은? <보기>. 생활체육 배드민턴 동호회에서 신입 회원이 실력이 부족하다는 이유로 민폐 회원이라는 별명을 듣게 되었다. 어떤 회원은 게임에서 그를 배제하거나 눈치를 주었고, 몇몇은 노골적으로 비난했다. 시간이 지날수록 신입 회원은 자신이 정말 방해가 된다고 느끼며 위축되었고, 결국 동호회를 그만두고 운동도 포기하였다.","choices":["중화 이론(neutralization theory)","낙인 이론(labeling theory)","욕구위계 이론(hierarchy of needs theory)","인지발달 이론(cognitive development theory)"],"answer":[2]},{"id":"2025-2급-스포츠사회학-17","year":2025,"level":"2급","subject":"스포츠사회학","qno":17,"stem":"코클리(J. Coakley)가 제시한 상업주의 스포츠 출현의 사회적ž경제적 조건에 해당하지 않는 것은?","choices":["자본주의 시장경제 체제","스태그플레이션(stagflation)","소비가 장려되는 문화 형성","인구 밀도가 높은 대도시 형성"],"answer":[2]},{"id":"2025-2급-스포츠사회학-18","year":2025,"level":"2급","subject":"스포츠사회학","qno":18,"stem":"<보기>의 사례에 해당하는 정치가 스포츠를 이용하는 방법으로 가장 적절한 것은? <보기>. 스포츠는 정치인에게 권력을 강화하는 수단이 되기도 한다. 12.12 군사쿠테타와 5.18 민주화운동을 거치며, 당시 사회는 극도의 불안감과 정권에 대한 불신이 극에 달했다. 정권은 언론을 통제하고 정치적 발언을 통제하려 했지만, 뜻대로 되지 않았다. 그래서 국민의 관심을 돌리고 정권을 유지하기 위해 프로스포츠를 장려했다. (출처: M사, 시사교양, 2005. 6.)","choices":["상징","조작","동일화","전문화"],"answer":[2]},{"id":"2025-2급-스포츠사회학-19","year":2025,"level":"2급","subject":"스포츠사회학","qno":19,"stem":"<보기>의 사례에 해당하는 스포츠사회화 과정이 바르게 연결된 것은? <보기>. ㄱ. 소영이는 ‘골때리는 그녀’라는 TV 프로그램을 보고 축구에 매력을 느껴 축구클럽에 가입하게 되었다. ㄴ. 소영이는 축구에 흥미를 잃어 축구클럽을 탈퇴하였고, 6개월이 지났을 무렵, 친구의 권유로 테니스클럽에 가입하게 되었다. ㄷ. 소영이는 테니스 활동을 하며 테니스 규칙, 기술, 매너 등을 잘 숙지한 테니스 동호인이 되었다. ㄹ. 소영이는 무릎과 팔꿈치 부상이 잦아지면서 결국 좋아하는 테니스를 그만두게 되었다.","choices":["스포츠로의 재사회화 스포츠로의 사회화 스포츠를 통한 사회화 스포츠 탈사회화","스포츠로의 재사회화 스포츠를 통한 사회화 스포츠로의 사회화 스포츠 탈사회화","스포츠로의 사회화 스포츠를 통한 사회화 스포츠로의 재사회화 스포츠 탈사회화","스포츠로의 사회화 스포츠로의 재사회화 스포츠를 통한 사회화 스포츠 탈사회화"],"answer":[4]},{"id":"2025-2급-스포츠사회학-20","year":2025,"level":"2급","subject":"스포츠사회학","qno":20,"stem":"<보기>의 사례에 해당하는 사회화 주관자는? <보기>. ㄱ. 지영이는 배드민턴 동호회 활동을 하는 부모님의 권유로 배드민턴을 시작하게 되었다. ㄴ. 민수는 동네 주민센터에서 청소년 농구 프로그램 회원 모집 공고를 보고, 직접 센터를 방문하여 등록하였다.","choices":["가족 학교","학교 동료","동료 지역사회","가족 지역사회"],"answer":[4]},{"id":"2025-2급-스포츠교육학-01","year":2025,"level":"2급","subject":"스포츠교육학","qno":1,"stem":"생활스포츠 교육 프로그램의 내용 선정 원리에 관한 설명으로 적절하지 않은 것은?","choices":["좋은 교육 내용이라면 실천 가능성과 관계없이 선정한다.","스포츠의 가치를 경험할 수 있도록 다양한 활동을 구성한다.","생활스포츠의 교육목표를 성취하는 데 적합한 내용을 선정한다.","참여자의 성별, 연령별 흥미와 요구를 반영하기 위한 조사를 실시한다."],"answer":[1]},{"id":"2025-2급-스포츠교육학-02","year":2025,"level":"2급","subject":"스포츠교육학","qno":2,"stem":"학교스포츠클럽 지도 시 효과적인 과제 제시 방법으로 적절하지 않은 것은?","choices":["실제 상황처럼 정확하게 시범을 보인다.","동작 설명과 시각적 정보를 함께 활용한다.","은유나 비유보다는 개념 자체를 그대로 전달한다.","학생이 이해할 수 있는 적절한 속도로 분명하게 전달한다."],"answer":[3]},{"id":"2025-2급-스포츠교육학-03","year":2025,"level":"2급","subject":"스포츠교육학","qno":3,"stem":"다음 설문지를 활용하는 데 가장 적절한 평가 단계는? 영역 질문 내용 응답 (‘✔’ 표기) 준비 준비된 개인 장비는? 라켓 운동화 운동복 테니스 강습 시 희망하는 강습 형태는? 개인강습 그룹강습 상관없음 최근 3년 이내 테니스 강습을 받은 경험은? 있다 없다 수준 포핸드 그립을 잡을 수 있는가? 그렇다 보통이다 아니다 백핸드 그립을 잡을 수 있는가? 그렇다 보통이다 아니다 스플릿 스텝을 할 수 있는가? 그렇다 보통이다 아니다","choices":["진단평가","종합평가","형성평가","총괄평가"],"answer":[1]},{"id":"2025-2급-스포츠교육학-04","year":2025,"level":"2급","subject":"스포츠교육학","qno":4,"stem":"<보기>에서 설명하는 생활스포츠 교육 프로그램의 지도 원리로 가장 적절한 것은? <보기>. ∙프로그램의 다양화를 지향한다. ∙직접 참여 활동과 간접 학습 활동을 균형 있게 제공한다. ∙스포츠 활동을 총체적으로 체험시켜 스포츠 학습의 질을 높인다.","choices":["개별성","자발성","적합성","통합성"],"answer":[4]},{"id":"2025-2급-스포츠교육학-05","year":2025,"level":"2급","subject":"스포츠교육학","qno":5,"stem":"<보기>에서 설명하는 링크(J. Rink)의 내용 발달 과제는? <보기>. ∙과제 내 발달과 과제 간 발달이 있다. ∙단순한 과제에서 복잡한 과제로 전개한다. ∙쉬운 과제에서 어려운 과제 순으로 참여한다.","choices":["시작형 과제","확대형 과제","세련형 과제","응용형 과제"],"answer":[2]},{"id":"2025-2급-스포츠교육학-06","year":2025,"level":"2급","subject":"스포츠교육학","qno":6,"stem":"<보기>에서 설명하는 협동 학습 모형의 전략은? <보기>. ∙1차 평가에서 모든 팀원의 점수를 합산하여 팀 점수로 발표한다. ∙지도자는 학생들과 토론하고 팀의 상호작용을 높일 수 있도록 조언한다. ∙모든 팀은 1차 평가와 동일한 과제를 반복해서 연습하고, 팀원 모두의 점수를 높이는 데 중점을 둔다. ∙2차 평가를 하여 1차 평가보다 향상된 정도에 따라 팀 점수를 부여한다.","choices":["직소(jigsaw)","팀–보조수업(team-assisted instruction)","팀 게임 토너먼트(team games tournament)","학생 팀–성취 배분(student teams-achievement division)"],"answer":[4]},{"id":"2025-2급-스포츠교육학-07","year":2025,"level":"2급","subject":"스포츠교육학","qno":7,"stem":"「생활체육진흥법」(2024.2.9. 시행)의 내용에 해당하지 않는 것은?","choices":["모든 국민은 건강한 신체활동과 건전한 여가 선용을 위해 생활체육을 즐길 권리를 가진다.","국가 및 지방자치단체는 생활체육강좌의 설치･운영에 드는 경비를 지원할 수 있다.","문화체육관광부장관은 생활체육의 진흥을 위한 기본계획을 10년마다 수립･시행해야 한다.","지방자치단체는 그 지역주민의 생활체육 활동을 위하여 체육동호인 조직의 육성에 필요한 시책을 마련할 수 있다."],"answer":[3]},{"id":"2025-2급-스포츠교육학-08","year":2025,"level":"2급","subject":"스포츠교육학","qno":8,"stem":"<보기>에서 설명하는 링크(J. Rink)의 교수 전략은? <보기>. ∙상황에 따라 지시형 또는 연습형 스타일로 활용될 수 있다. ∙지도자는 과제의 단서를 선정하고 명확하게 전달해야 한다. ∙주로 집단 전체를 대상으로 하는 움직임 과제를 내용으로 선정한다.","choices":["동료 교수(peer teaching)","상호작용 교수(interactive teaching)","스테이션 교수(station teaching)","자기교수 전략(self-instruction strategies)"],"answer":[2]},{"id":"2025-2급-스포츠교육학-09","year":2025,"level":"2급","subject":"스포츠교육학","qno":9,"stem":"<보기>에서 모스턴(M. Mosston)의 교수 스타일에 관한 설명으로 옳은 것을 모두 고른 것은? <보기>. ㄱ. 교수 스타일은 비대비 접근 방식에 근거를 둔다. ㄴ. 교수 스타일마다 의사결정의 주도권은 교사에게 있다. ㄷ. 교수 스타일의 A~E까지는 창조(production)가 중심이 된다. ㄹ. 교수 스타일은 과제 활동 전, 중, 후의 의사결정으로 구분된다.","choices":["ㄱ, ㄴ","ㄱ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":[2]},{"id":"2025-2급-스포츠교육학-10","year":2025,"level":"2급","subject":"스포츠교육학","qno":10,"stem":"그리핀(L. Griffin), 미첼(S. Mitchell), 오슬린(J. Oslin)의 게임 수행 평가 도구(GPAI)를 활용하여 학생의 게임 수행 능력을 측정한 표이다. 게임 수행 점수가 높은 학생 순으로 바르게 나열한 것은? 측정 항목 이름 의사결정 기술실행 보조하기 적절 부적절 효율적 비효율적 적절 부적절 다은 3회 1회 3회 1회 3회 1회 세연 2회 2회 5회 0회 2회 2회 유나 2회 2회 2회 0회 2회 0회","choices":["유나→세연→다은","다은→세연→유나","유나→다은→세연","다은→유나→세연"],"answer":[3]},{"id":"2025-2급-스포츠교육학-11","year":2025,"level":"2급","subject":"스포츠교육학","qno":11,"stem":"<보기>의 내용에 해당하는 모스턴(M. Mosston)의 교수 스타일은? <보기>. ∙지도자는 난이도가 다른 과제를 선정하고 조직한다. ∙학생은 자신에게 맞는 난이도의 과제를 선택하고 참여한다. ∙높이뛰기의 경우, 학생들은 바(bar)의 높이가 다른 연습 과제를 선택할 수 있다.","choices":["연습형","포괄형","자기점검형","상호학습형"],"answer":[2]},{"id":"2025-2급-스포츠교육학-12","year":2025,"level":"2급","subject":"스포츠교육학","qno":12,"stem":"<보기>의 소프(R. Thorpe), 벙커(D. Bunker), 알몬드(L. Almond)의 이해 중심 게임 수업 모형의 단계 중 ㉠, ㉡에 들어갈 용어는? <보기>. ㉠ ㉡","choices":["전술 이해 기술 연습","과제 제시 기술 연습","기술 연습 전술 이해","전술 이해 게임 설계"],"answer":[1],"img":"data:image/webp;base64,UklGRh4nAABXRUJQVlA4IBInAABQ8ACdASqEA34BPm00lUkkIqchIfJLCOANiWlu4W+xOPEIfqUauaVV6O/vHbr/ZPx7/sP 츠심리학","qno":2,"stem":"심상에 관한 설명으로 옳지 않은 것은?","choices":["동기를 유발하고 강화한다.","감정을 조절하는 데 도움이 된다.","스포츠 전략을 습득하고 연습할 수 있다.","통증과 부상을 대처하는 데 도움이 되지 않는다."],"answer":[4]},{"id":"2025-2급-스포츠심리학-03","year":2025,"level":"2급","subject":"스포츠심리학","qno":3,"stem":"<보기> 중 내적동기를 향상하는 전략으로 옳은 것만을 모두 고른 것은? <보기>. ㄱ. 성공 경험을 갖게 한다. ㄴ. 언어적, 비언어적 칭찬을 자주 한다. ㄷ. 팀의 의사결정에 선수를 참여시킨다. ㄹ. 물질적 보상과 처벌을 주로 활용한다. ㅁ. 최대한 높은 결과목표를 설정하여 도전하게 한다.","choices":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄷ, ㄹ, ㅁ"],"answer":[1]},{"id":"2025-2급-스포츠심리학-04","year":2025,"level":"2급","subject":"스포츠심리학","qno":4,"stem":"목표설정 원리로 적절하지 않은 것은?","choices":["수행목표보다 결과목표를 강조한다.","구체적이고 객관적인 목표를 설정한다.","부정적인 목표보다 긍정적인 목표를 강조한다.","단기목표, 중기목표, 장기목표를 함께 설정한다."],"answer":[1]},{"id":"2025-2급-스포츠심리학-05","year":2025,"level":"2급","subject":"스포츠심리학","qno":5,"stem":"<보기>가 설명하는 가설은? <보기>. 운동은 세로토닌, 노르에피네프린, 도파민과 같은 신경전달물질 분비를 증가시켜 우울증을 개선한다.","choices":["열발생 가설","모노아민 가설","사회심리적 가설","생리적 강인함 가설"],"answer":[2]},{"id":"2025-2급-스포츠심리학-06","year":2025,"level":"2급","subject":"스포츠심리학","qno":6,"stem":"<보기>에 해당하는 학자는? <보기>. ∙주요 활동은 1921~1938년 ∙최초로 스포츠심리학 실험실 설립 ∙북미 스포츠심리학의 아버지라고 불림 ∙시카고 컵스 야구팀 스포츠 심리 상담사 ∙코칭심리학(Psychology of Coaching, 1926) 책 출판","choices":["프랭클린 헨리(Franklin Henry)","콜먼 그리피스(Coleman Griffith)","레이너 마틴즈(Rainer Martens)","노먼 트리플렛(Norman Triplett)"],"answer":[2]},{"id":"2025-2급-스포츠심리학-07","year":2025,"level":"2급","subject":"스포츠심리학","qno":7,"stem":"그림에서 ㉠의 고원현상에 관한 설명으로 옳지 않은 것은?","choices":["수행은 정체되지만, 학습은 진행된다.","연습 기간에 쌓인 피로나 동기 저하로 인해서 발생할 수 있다.","협응 구조가 완성되어 더 이상의 질적인 변화가 없는 시기이다.","하나의 동작 유형에서 다른 동작 유형으로 전환이 발생하는 시기이다."],"answer":[3],"img":"data:image/webp;base64,UklGRrwpAABXRUJQVlA4ILApAAAQ2gCdASpdAvUBPm02l0kkIqKhIlQJWIANiWlu4XShG/ONmm8Rvtf5Qeef4v8x/cf7H+zP94/9/+x+L7+n823TX+2/vXqf/IPs9+F/vf7e/4n3X/0/9w8o/hL/h+oL+P/yv/Cf2/9uP75xUO4f7b0BfXr6p/qf8H/l/+t/pvSO/xfyy9x/rv/zv7n8AH8z/pn+n/wfnn+Fr597AX9L/w3/l/yn5ZfSn/V/+r/Sfmb7jP0b/Of+r/Z/Aj/OP7l/x/8B+VnJVCqkgJ0YE6MCdGBOjAnRgTowJ0YEvlGwLK/wTmUBzKOixu9Y3esbvWN3rG71jdUgKghPgr9mLtVa47pSVo7c4Pp8j 에 활용하였다. ㄴ. 응방도감(鷹坊都監)에서 관장하였다. ㄷ. 무예 훈련의 성격을 띠기도 하였다. ㄹ. 삼국시대에도 전담하는 관청이 있었다.","choices":["ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":[1]},{"id":"2025-2급-한국체육사-08","year":2025,"level":"2급","subject":"한국체육사","qno":8,"stem":"조선시대의 훈련원(訓鍊院)에 관한 설명으로 옳지 않은 것은?","choices":["국왕의 친위 부대였다.","군사의 시재(試才)를 담당하였다.","무예 교육과 훈련을 담당하였다.","『무경칠서(武經七書)』 등의 병서 습득을 장려하였다."],"answer":[1]},{"id":"2025-2급-한국체육사-09","year":2025,"level":"2급","subject":"한국체육사","qno":9,"stem":"<보기>에서 『활인심방(活人心房)』에 관한 옳은 설명을 모두 고른 것은? <보기>. ㄱ. 『활인심(活人心)』을 근거로 하였다. ㄴ. 도인법(導引法)은 신체 단련 방법이다. ㄷ. 조선시대에 간행된 보건 실용서이다. ㄹ. 양생지법(養生之法)과 도인법 등을 다루고 있다.","choices":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":[4]},{"id":"2025-2급-한국체육사-10","year":2025,"level":"2급","subject":"한국체육사","qno":10,"stem":"조선시대의 식년무과(式年武科)에 관한 설명으로 옳은 것은?","choices":["소과(小科)와 대과(大科)로 구분하여 실시하였다.","초시(初試), 복시(覆試), 전시(殿試)의 단계로 실시하였다.","초시(初試), 복시(覆試), 전시(殿試)에는 강서 시험을 포함하였다.","전시(殿試)는 목전, 철전, 기사, 기창, 격구 등 무예 종목을 실시하였다."],"answer":[2]},{"id":"2025-2급-한국체육사-11","year":2025,"level":"2급","subject":"한국체육사","qno":11,"stem":"<보기>의 설명에 해당하는 체조는? <보기>. 개화기 학교에서는 정규과목으로 체조가 편성되었으며 연령과 성별에 따라서 다양하게 실시되었다. 당시의 체조는 군사적 목적을 고려하여 규율에 반응하는 신체를 만드는 데 유효한 방법이었다.","choices":["유희체조","병식체조","리듬체조","기공체조"],"answer":[2]},{"id":"2025-2급-한국체육사-12","year":2025,"level":"2급","subject":"한국체육사","qno":12,"stem":"<보기>에 해당하는 시기는? <보기>. 황국신민체조와 함께 검도, 유도, 궁도 등을 여학생에게 실시하게 한 것은 일본의 군국주의를 드러낸 것이었다. 학교체육의 성격은 점차 교련에 가까워졌다.","choices":["무단통치기","민족말살기","문화통치기","체조교습기"],"answer":[2]},{"id":"2025-2급-한국체육사-13","year":2025,"level":"2급","subject":"한국체육사","qno":13,"stem":"<보기>에서 문곡(文谷) 서상천(徐相天)의 활동을 모두 고른 것은? <보기>. ㄱ. 우리나라에 역도를 도입하였다. ㄴ. 조선체력증진법연구회를 설립하였다. ㄷ. 『현대체력증진법』, 『현대철봉운동법』 등을 발간하였다. ㄹ. 조선체육회의 임원으로 병식체조를 개선한 교육체조를 가르쳤다.","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":[3]},{"id":"2025-2급-한국체육사-14","year":2025,"level":"2급","subject":"한국체육사","qno":14,"stem":"<보기>의 설명에 해당하는 교육기관은? <보기>. 이 교육기관은 개항 이후에 일본인의 세력에 대응하고자 설립 되었다. 무예반에는 병서와 사격 과목이 편성되었고, 무예반의 비중이 컸다는 점에서 무비자강(武備自强)을 지향했다고 할 수 있다.","choices":["무예학교","원산학사","배재학당","경신학당"],"answer":[2]},{"id":"2025-2급-한국체육사-15","year":2025,"level":"2급","subject":"한국체육사","qno":15,"stem":"1991년에 있었던 남북한 단일팀의 국제대회 참가에 관한 설명으로 옳지 않은 것은?","choices":["단일팀은 ‘코리아’, ‘KOREA’라는 명칭을 사용하였다.","제6회 포르투갈 세계청소년축구대회에서 8강에 진출하였다.","제41회 지바 세계탁구선수권대회의 여자단체전에서 우승하였다.","제24회 서울 올림픽경기대회 중에 열린 남북회담을 계기로 이루어 졌다."],"answer":[4]},{"id":"2025-2급-한국체육사-16","year":2025,"level":"2급","subject":"한국체육사","qno":16,"stem":"제5공화국의 스포츠 정책으로 옳지 않은 것은?","choices":["태릉선수촌이 건립되었다.","국군체육부대를 창설하였다.","제10회 서울 아시아경기대회를 개최하였다.","야구, 축구, 씨름의 프로리그가 시작되었다."],"answer":[1]},{"id":"2025-2급-한국체육사-17","year":2025,"level":"2급","subject":"한국체육사","qno":17,"stem":"광복 이후 우리나라 선수단이 최초로 참가한 올림픽경기대회는?","choices":["제14회 런던 하계올림픽경기대회","제6회 오슬로 동계올림픽경기대회","제15회 헬싱키 하계올림픽경기대회","제5회 생모리츠 동계올림픽경기대회"],"answer":[4]},{"id":"2025-2급-한국체육사-18","year":2025,"level":"2급","subject":"한국체육사","qno":18,"stem":"광복 이후 제5공화국까지의 체육에서 나타난 사상적 특징으로 옳지 않은 것은?","choices":["우수선수의 육성을 우선하는 엘리트주의가 나타났다.","「국민체육진흥법」의 국위선양은 국가주의를 나타낸다.","국가 주도의 강한 신체 훈련을 앞세우는 실존주의가 나타났다.","건전하고 강인한 국민성의 함양을 강조하는 건민주의가 나타났다."],"answer":[3]},{"id":"2025-2급-한국체육사-19","year":2025,"level":"2급","subject":"한국체육사","qno":19,"stem":"‘국민생활체육진흥종합계획(호돌이 계획)’의 내용으로 옳은 것은?","choices":["제24회 서울 올림픽경기대회를 대비하고자 추진되었다.","「국민체육진흥법」을 제정하여 스포츠 클럽을 체계적으로 관리하였다.","국민생활체육협의회의 창설과 직장체육 프로그램의 보급이 이루어졌다.","전문체육 육성을 위한 국가대표 연금과 우수선수 병역 혜택의 제도가 도입되었다."],"answer":[3]},{"id":"2025-2급-한국체육사-20","year":2025,"level":"2급","subject":"한국체육사","qno":20,"stem":"<보기>에서 광복 이후 1940년대 말까지 체육의 내용을 모두 고른 것은? <보기>. ㄱ. 미국 ‘신체육’의 영향을 받았다. ㄴ. 일제강점기에 해산되었던 조선체육회가 재건되었다. ㄷ. 조선체육동지회의 결성은 민족 체육 재건의 계기가 되었다. ㄹ. 학도호국단이 결성되었고, 많은 체육 교사들이 교관으로 활동하였다.","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":[4]},{"id":"2025-2급-운동생리학-01","year":2025,"level":"2급","subject":"운동생리학","qno":1,"stem":"400 m 트랙을 약 60초로 전력 질주 시 가장 많이 기여하는 에너지 공급 시스템에서 1분자의 글루코스(glucose) 분해로 얻을 수 있는 ATP 수는?","choices":["2","4","16","18"],"answer":[1]},{"id":"2025-2급-운동생리학-02","year":2025,"level":"2급","subject":"운동생리학","qno":2,"stem":"중-고강도 운동 시 필요한 ATP 합성에 사용되지 않는 기질(substrate)은?","choices":["혈중 알부민","혈중 포도당","근육 글리코겐","근육 중성지방"],"answer":[1]},{"id":"2025-2급-운동생리학-03","year":2025,"level":"2급","subject":"운동생리학","qno":3,"stem":"<보기>에서 장기간의 무산소 트레이닝에 따른 생리학적 적응으로 옳은 것만을 모두 고른 것은? <보기>. ㄱ. 산화 능력 증가 ㄴ. 근육의 수축 속도 증가 ㄷ. 미토콘드리아 밀도 증가 ㄹ. PCr 또는 PFK 효소의 양 및 활성도 증가","choices":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"answer":[2]},{"id":"2025-2급-운동생리학-04","year":2025,"level":"2급","subject":"운동생리학","qno":4,"stem":"<보기>에서 설명하는 에너지 대사 과정은? <보기>. ∙무산소성 에너지 시스템이다. ∙에너지 투자와 에너지 생산 단계로 구성된다. ∙대사 과정의 최종 산물로 피루브산염 또는 젖산염을 생성한다.","choices":["지방분해(lipolysis)","해당과정(glycolysis)","동화작용(anabolism)","산화적 인산화(oxidative phosphorylation) 과정"],"answer":[2]},{"id":"2025-2급-운동생리학-05","year":2025,"level":"2급","subject":"운동생리학","qno":5,"stem":"<보기>에서 설명하는 감각수용기는? <보기>. ∙주동근의 수축을 억제한다. ∙근육 손상을 예방하는 기능을 한다. ∙근육-건 복합체의 장력 변화를 감지한다.","choices":["근방추","파치니소체","골지건기관","마이스너소체"],"answer":[3]},{"id":"2025-2급-운동생리학-06","year":2025,"level":"2급","subject":"운동생리학","qno":6,"stem":"<보기>에서 장기간 유산소 트레이닝에 의한 생리적 적응 현상으로 옳은 것만을 모두 고른 것은? <보기>. ㄱ. 좌심실 용적 증가 ㄴ. 마이오글로빈 함유량 증가 ㄷ. 1회 박출량(stroke volume) 증가 ㄹ. 골격근 내 모세혈관 밀도 증가","choices":["ㄱ, ㄴ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":[4]},{"id":"2025-2급-운동생리학-07","year":2025,"level":"2급","subject":"운동생리학","qno":7,"stem":"<보기>의 골격근 수축 과정에 관한 설명 중 ㉠~㉢에 들어갈 용어로 옳은 것은? <보기>. ∙활동전위(action potential)는 가로세관(T-tubles)으로 이동하여 ( ㉠ ) 에서 ( ㉡ ) 방출을 자극한다. ∙( ㉠ )에서 방출된 ( ㉡ )이 트로포닌(troponin)과 결합하게 되면 ( ㉢ )의 위치를 이동시켜 마이오신 머리(myosin head)와 액틴 필라멘트(actin filament)가 강하게 결합하게 한다. ㉠ ㉡ ㉢","choices":["원형질막 아세틸콜린 근절","원형질막 칼슘이온 트로포마이오신","근형질세망 아세틸콜린 근절","근형질세망 칼슘이온 트로포마이오신"],"answer":[4]},{"id":"2025-2급-운동생리학-08","year":2025,"level":"2급","subject":"운동생리학","qno":8,"stem":"그림의 산소-헤모글로빈 해리 곡선을 참고하여 <보기>에서 옳은 것만을 모두 고른 것은? <보기>. ㄱ. 운동에 의한 체온상승(예:심부온도 상승)은 헤모글로빈의 산소 친화력 (affinity)을 높인다. ㄴ. 고강도 운동 시 동-정맥 산소 차이(arteriovenous oxygen difference)는 안정 시와 비교하여 감소한다. ㄷ. 고강도 운동에 의한 혈중 젖산 농도 증가는 다. ㄴ. 최대 운동 시 심박출량은 증가하지만 안정 시와 비교하여 기관별 (예: 신장, 내장, 골격근 등) 혈류 분배 비율은 동일하다. ㄷ. 고강도 운동에 참여하는 골격근의 세동맥(arterioles) 혈관 저항은 안정 시와 비교하여 감소한다.","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"answer":[2]},{"id":"2025-2급-운동역학-01","year":2025,"level":"2급","subject":"운동역학","qno":1,"stem":"운동역학의 내용과 목적이 아닌 것은?","choices":["운동 기술의 향상","운동수행 시 힘의 측정","운동수행 안전성의 향상","인체 내 에너지 대사의 측정"],"answer":[4]},{"id":"2025-2급-운동역학-02","year":2025,"level":"2급","subject":"운동역학","qno":2,"stem":"<보기>에서 설명하는 동작분석 방법으로 옳지 않은 것은? <보기>. 동작을 측정하거나 계산하지 않는 비수치적 방법으로 지도자의 시각적 관찰로 움직임의 오류를 찾아 운동 기술 향상을 도모한다.","choices":["정량적 자료로 분석한다.","현장에서 즉각적인 분석이 가능하다.","지도자 성향에 따라 결과가 달라진다.","분석의 결과는 객관성을 담보할 수 없다."],"answer":[1]},{"id":"2025-2급-운동역학-03","year":2025,"level":"2급","subject":"운동역학","qno":3,"stem":"운동의 종류에 관한 설명으로 옳지 않은 것은?","choices":["직선운동은 병진운동의 한 종류이다.","곡선운동은 회전운동에 포함되는 운동이다.","병진운동은 직선운동과 곡선운동 모두를 말한다.","복합운동은 병진운동과 회전운동이 혼합된 운동이다."],"answer":[2]},{"id":"2025-2급-운동역학-04","year":2025,"level":"2급","subject":"운동역학","qno":4,"stem":"운동역학 사슬(kinetic chain)에 관한 설명으로 옳지 않은 것은?","choices":["힘의 적용 대상이 연결된 일련의 사슬고리이다.","사슬에 있는 연결 동작은 힘 전달에 영향을 미친다.","닫힌형 운동역학 사슬(CKC)은 기능적이며, 스포츠에 특화될 수 있다.","열린형 운동역학 사슬(OKC)에는 스쿼트, 팔굽혀펴기와 같은 동작이 있다."],"answer":[4]},{"id":"2025-2급-운동역학-05","year":2025,"level":"2급","subject":"운동역학","qno":5,"stem":"신체에 작용하는 역학적 부하(load)에 관한 정의로 옳지 않은 것은?","choices":["전단응력(shear): 조직의 장축을 따라 대칭으로 가해지는 힘","인장응력(tension): 두 힘이 서로 떨어지게끔 반대 방향으로 가해지는 힘","압축응력(compression): 반대쪽의 두 힘이 서로 향하는 방향으로 가해지는 힘","휨(bending): 축에서 벗어나는 두 힘이 가해져 한쪽에서 인장응력, 다른 한쪽에서 압축응력이 발생하는 힘"],"answer":[1]},{"id":"2025-2급-운동역학-06","year":2025,"level":"2급","subject":"운동역학","qno":6,"stem":"<보기>에서 내력(internal force)에 관한 설명으로 옳은 것만 모두 고른 것은? <보기>. ㄱ. 다이빙 동작에서 작용하는 중력 ㄴ. 높이뛰기의 도약 동작에서 선수가 발휘한 힘 ㄷ. 환경과의 상호작용으로 시스템에 작용하는 힘 ㄹ. 내력만으로 인체 전체의 위치는 이동할 수 없음","choices":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":[2]},{"id":"2025-2급-운동역학-07","year":2025,"level":"2급","subject":"운동역학","qno":7,"stem":"<보기>에서 제시한 A 학생의 항속 구간 평균 보행속도는? (단, 반올림하여 소수점 둘째 자리까지 표기) <보기>. A 학생이 총 30 m의 직선 구간을 걸었을 때, 가속과 감속 구간 각 5 m씩 총 10 m를 제외한 항속 구간에서의 스텝 수는 25회였고, 16초가 소요되었다.","choices":["0.80 m/s","1.25 m/s","1.56 m/s","1.88 m/s"],"answer":[2]},{"id":"2025-2급-운동역학-08","year":2025,"level":"2급","subject":"운동역학","qno":8,"stem":"각가속도에 관한 설명으로 옳지 않은 것은?","choices":["회전하는 물체의 각가속도가 0이 되면 물체는 멈추게 된다.","각가속도는 각속도의 변화량을 시간의 변화량으로 나눈 값이다.","처음 각속도가 30°/s에서 6초 후 90°/s로 변화했을 때 평균 각가속도는 10°/s2 이다.","각속도가 양(＋)의 방향으로 선형적인 증가를 할 때 각가속도는 일정한 양(＋)의 값을 가진다."],"answer":[1]},{"id":"2025-2급-운동역학-09","year":2025,"level":"2급","subject":"운동역학","qno":9,"stem":"그림에 관한 설명으로 옳지 않은 것은? (단, 착지전략을 제외한 모든 조건은 동일함) 그림은 기계체조 선수가 경기 중 각 1회의 ㉠뻣뻣한 착지와 ㉡부드러운 착지를 수행하였을 때 착지구간에서 시간에 따른 수직 힘의 변화를 나타낸다.","choices":["㉠과 ㉡의 운동량의 변화량은 동일하다.","㉠의 경우 신체에 작용하는 수직 충격력이 더 크다.","㉠의 경우 신체에 작용하는 수직 충격량이 더 크다.","착지 직전의 무게중심의 속도는 ㉠과㉡ 모두 동일하다."],"answer":[3],"img":"data:image/webp;base64,UklGRgofAABXRUJQVlA4IP4eAADQwwCdASoIA9EBPm02mEkkIqKiIdI46IANiWlu/ELZxIBHZ119WX+K/Izz7/F/oP73+TH+A/ZX5D9EdqP8o+234/+0ftp/cvd//ZflB6T/KPUC/GP5F/c/7l+239+4uPdPMI9m/qv+t/vv5PeqFqieD/+N7gP9I/pP+18qTxF/SPYD/mv+F9WD+//9/+u/LH3T/oX+n/9n+f/ID7EP5x/cv+T9zAbKl8gqc2u4D1L5BU5tdwHqXyCpza7gPUvkFTm13AepfIKnNruA9S+QVObXcB6l8gqcy7joKnNruA9S+QVObXcB6l8gqc2u4D1GqjowFl9SagXzhy7gPUvkFTm13AepfIKnNruA9EmeUw9MpD5kymKbFB49y11BU5tdwHqXyCpza7gPUvkFTmzVeDY2rgRZ94fzFoen7AwCc9iQdruRgg9AI4Cw9Le1vBEuyjUcyQAHqO71LeEb75BSoKnNruA9S+QVObXcB0GC8XZZW7R6LS5YJEwNjy/a3hER8VofQZG6hcoKHtR0DN2+t63oCNKMR9SFHaYAW5U5fLEaowi13AepfIKnNruA9S+QVItzBiYhysQSCHmiogDB4PjPNw+o7kvOF7eb8m2DTMPgeEBt8naZ+Zk2q4aZ8MvkFTm13AepfIKH7sITmeo6EIxB2rFmJfJefThTbyLqH+XqDNP8IL3K/yAMO4ZfIKnNruA9S+QVObXa1CiVs4sPhleFQfq5RJxvl3bFG5Y0PFFUH5uQ0VReW3kp00W6GUWQC1XDTPhl8gqc2u4D1L5BUoWPCDVahtaYGHhxI2SZmxlK8dU6IXhgRMzAtxV72Y2u4D1L5BU5tdwHqXyCpza7GnKA7VvsSITC/gGeBXY/4JB/6RphgwlRK9TJc4UA9S+QVObXcB6l8gqc2u4DpFFiktvugz8yharxP4s7+qVdVw0z4ZfIKnNruA9S+QVOZrL3+f/q/zC9SofNBo4iDASduEwm4ZfIKnNruA9S+QVObXcAsSbi+cFP7LVGThl7bM2Jc221FcNM+GXyCpza7gPUvkFTmay99DN3hHWfDLgIt+QIbyEWyajSkeBmHl5IxEkOKgVm6 돌기) 하강 국면에서 발의 무게중심점은 일정한 각속도를 유지한다.","골프 클럽헤드의 각속도는 0에서 시작하여 최댓값으로 증가했다가 다시 0으로 돌아온다.","야구에서 배트의 각속도가 일정하다면 회전반경이 클수록 임팩트된 공의 선속도는 증가한다,"],"answer":[2]},{"id":"2025-2급-운동역학-12","year":2025,"level":"2급","subject":"운동역학","qno":12,"stem":"인체의 움직임에서 토크(torque)에 관한 개념이 적용된 사례로 옳지 않은 것은?","choices":["사지의 근육은 각 관절을 돌림시키는 토크를 생성한다.","덤벨 컬 시 덤벨의 무게는 팔꿈치를 폄하는 토크를 가진다.","외적 토크보다 내적 토크가 크면 근육은 신장성 수축을 한다.","동일한 힘을 낼 때 팔꿈치 각도 90°보다 굽히거나 폄에 따라 모멘트팔이 짧아져 내적 토크도 감소한다."],"answer":[3]},{"id":"2025-2급-운동역학-13","year":2025,"level":"2급","subject":"운동역학","qno":13,"stem":"<보기>에서 설명한 내용 중 인체의 관성모멘트(moment of inertia)를 감소시킨 사례로 옳은 것만 모두 고른 것은? <보기>. ㄱ. 피겨스케이팅에서 양팔을 벌리고 회전한다. ㄴ. 달리기 시 체공기(swing phase)에 있는 다리를 굽힌다. ㄷ. 다이빙에서 공중 앞돌기 시 터크(움크린) 자세를 만든다. ㄹ.골프 아이언 헤드의 질량 분포를 양 끝으로 넓게 하여 클럽 헤드의 관성을 조작한다.","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"answer":[2]},{"id":"2025-2급-운동역학-14","year":2025,"level":"2급","subject":"운동역학","qno":14,"stem":"그림에 관한 설명으로 옳지 않은 것은? (단, 공의 높이는 무게중심을 기준으로 함)","choices":["비탄성충돌이다.","충돌 전, 후 농구공의 속도는 다르다.","운동에너지가 보존되지 않았다는 것을 의미한다.","반발계수(복원계수, coefficient of restitution)는 0.75이다."],"answer":[4],"img":"data:image/webp;base64,UklGRho8AABXRUJQVlA4IA48AADQNgGdASo9A8MBPm00l0ikIrcqJDBZSuANiWlu/DqZq+tQuvyD8+vj59y/ML+o+m/o58+e4f9d82TyyfFfex6Hfyn7f/q/7F/iP+f8kP8v/O/378ZPUf1l/bH8hH4j/I/8H/Vf8N/0vBr8ji3voC+3P2//Wf3f/N/s18iv4//Q9afm59wL+eftt7V/83xuP6fqI/1L+6//D2VP9P/6f6L8xPfT+a/6P/4f5/4Gv5l/cP+aLw/uHZn0MPAHm/uHZn0MPAHm/uHZn0MPAHm/uHZnwdfrloPV1wEMjslDgH7QUcBx5oenXFGGFwcVoYeAPN/cNe8DbUOH+P/o7RaZAQ8ogZuGQJgi7970W+a/0MPAHm/uHZnBISdDBhHp4bz/GqPGBr+1LfP3wzgNuonZlgTv2ScNhTaMuBvKHtSjQ8Ust4A839w7M99TF6JsQLIt67ydiDVYUQSrDopJXjOWFR4JgVnlLUOhLE7nDCMABRGpygTbdP7yPGHgDzf3Dsz5+pTcgwOFyxsLU2Rxye6aXoTIl/yzcpUOy1DQFc1lOi47WHitDDwB5v7AB8gBwhKikLR059/5aZhzZg7qU6VcgBGHUygbPtJPOGGaSGHgDzf3Ds0B6x6Dkjf1pJJQdlCVGCLcwAPN/cOzPoYeAPN/cOzPoYeAPKeyEqh0/6VJ17UWvDpwTg98qpDWMpfJQkIHoZTEAeb+4dmfQw8Aeb+4dmfQw8Aebqge9RqV4FRWt8X/azgYD6JcE7n/DB/pvymwo/agbOp0kMPAHm/uHZn0MPAHm/uHZn0MPAB5mBzA3KTh7gWJMmDD7bqgV3hW4MZft 상황에 부합하는 개념과 해석은? <보기>. 태권도 겨루기에서 소극적인 자세로 경기에 임하는 선수는 제재를 받는다. 적극적이고 공격적인 태도의 요구는 투쟁심을 독려하는 것이지만, 그 폭력적인 성향이 지나치면 또 다른 제재의 대상이 되기도 한다. 이처럼 스포츠는 폭력적인 성향의 분출을 자극함과 동시에 그것을 감시하고 제어한다.","choices":["게발트(Gewalt)－스포츠 폭력의 부당성","게발트(Gewalt)－스포츠 폭력의 이중성","희생양(Scapegoat)－스포츠 폭력의 부당성","희생양(Scapegoat)－스포츠 폭력의 이중성"],"answer":[2]},{"id":"2025-2급-스포츠윤리-04","year":2025,"level":"2급","subject":"스포츠윤리","qno":4,"stem":"‘타이틀 나인(Title Ⅸ)’에 따른 스포츠계의 변화로 가장 적절한 것은?","choices":["미국 프로야구리그의 도핑 실태에 관한 보고서 발간","남아프리카공화국에서 흑인에 대한 차별 정책의 시행","학교 스포츠 프로그램에서 의도적인 성차별 발생 시 재정 지원의 제한","공공 및 민간 스포츠 시설의 출입구 등에 휠체어 이동 통로의 설치 및 확충"],"answer":[3]},{"id":"2025-2급-스포츠윤리-05","year":2025,"level":"2급","subject":"스포츠윤리","qno":5,"stem":"세계도핑방지기구(World Anti-Doping Agency)가 정한 ‘금지 방법’의 분류 목록에 해당하지 않는 것은?","choices":["기술 도핑","화학적, 물리적 조작","유전자 및 세포 도핑","혈액 및 혈액 성분의 조작"],"answer":[1]},{"id":"2025-2급-스포츠윤리-06","year":2025,"level":"2급","subject":"스포츠윤리","qno":6,"stem":"레건(T. Regan)의 동물권리론에 가장 부합하는 태도는?","choices":["모든 동물에게 자유를 보장하고 스포츠에 동물을 이용하지 않도록 한다.","세계시민주의적 사고에 따라 재활승마에서는 기수와 말의 친화를 강조한다.","천연 거위털 셔틀콕의 성능이 인조 거위털 셔틀콕보다 더 좋으므로 생산을 장려한다.","경마나 소싸움은 합법적으로 동물을 활용할 수 있는 종목이며 경제적으로도 유용하다."],"answer":[1]},{"id":"2025-2급-스포츠윤리-07","year":2025,"level":"2급","subject":"스포츠윤리","qno":7,"stem":"<보기>의 대화 내용에 해당하는 정의(justice)의 유형에 가장 가까운 것은? <보기>. A: 오늘 테니스 경기 봤어? 한쪽 코트는 해가 정면에서 비치고 다른 쪽은 완전 그늘이더라. B: 응. 그런 조건이면 한쪽 선수가 불리할 것 같아. C: 그래서 테니스는 계속 코트를 바꾸면서 경기를 진행해. A: 그러면 시합을 시작할 때 코트나 서브권은 어떻게 정해? C: 동전 던지기로 정하는 경우가 많아.","choices":["평균적 정의","절차적 정의","분배적 정의","보상적 정의"],"answer":[2]},{"id":"2025-2급-스포츠윤리-08","year":2025,"level":"2급","subject":"스포츠윤리","qno":8,"stem":"롤랜드(S. Loland)가 분류한 규칙 위반의 유형에 연결한 사례로 옳지 않은 것은?","choices":["의도적 구성 규칙 위반－축구 경기에서 수비수가 실점을 당하지 않기 위해 손으로 공을 막았다.","의도적 규제 규칙 위반－육상 100 m 경기에서 경쟁 선수를 방해 하기 위해 레인을 침범했다.","비의도적 구성 규칙 위반－골프 경기 중 페어웨이에서 흙이 묻은 볼을 무의식적으로 닦고 진행했다.","비의도적 규제 규칙 위반－농구 경기 중 상대 수비를 피하는 과정에서 의도치 않게 3걸음을 걷고 슛을 쏘았다."],"answer":[1,2,3,4]},{"id":"2025-2급-스포츠윤리-09","year":2025,"level":"2급","subject":"스포츠윤리","qno":9,"stem":"칸트(I. Kant)의 의무론에서 <보기> 속 A와 B의 태도에 부합하는 행위 유형은? <보기>. 선생님: 도핑을 하면 경기 결과가 달라질 수 있는데, 여러분은 왜 하지 않나요? A:저는 도핑이 공정하지 못한 행위이기 때문에 하지 않아요. 제 실력으로 인정받고 싶어요. B: 저는 사실 도핑 검사에 걸리면 처벌을 받으니까 하고 싶어도 못 하고 있어요. A B","choices":["의무에서 나온(aus Pflicht) 행위 의무에 합치하는(pflichtmἅϐig) 행위","의무에 합치하는(pflichtmἅϐig) 행위 의무에 위배되는(pragmatische) 행위","의무에 합치하는(pflichtmἅϐig) 행위 의무에서 나온(aus Pflicht) 행위","의무에 위배되는(pragmatische) 행위 의무에서 나온(aus Pflicht) 행위"],"answer":[1]},{"id":"2025-2급-스포츠윤리-10","year":2025,"level":"2급","subject":"스포츠윤리","qno":10,"stem":"부올레(P. Vuolle)가 분류한 스포츠 환경이 아닌 것은?","choices":["시설(built) 환경－농구, 탁구","개발(developed) 환경－골프, 스키","가상(virtual) 환경－e스포츠, 버츄얼 태권도","순수(genuine) 환경－스쿠버다이빙, 트레일러닝"],"answer":[3]},{"id":"2025-2급-스포츠윤리-11","year":2025,"level":"2급","subject":"스포츠윤리","qno":11,"stem":"뒤르켐(E. Durkheim)의 도덕교육론에 근거한 스포츠윤리 교육의 내용과 방법으로 옳지 않은 것은?","choices":["감독의 지도에 의존하는 도덕적 판단력을 길러준다.","스포츠를 통한 도덕적 습관과 행동의 변화에 초점을 맞춘다.","스포츠윤리 교육을 스포츠 인성 교육의 유용한 틀로 활용한다.","스포츠맨십을 경험하는 실천적 교육으로 도덕적 인격 형성을 유도한다."],"answer":[1]},{"id":"2025-2급-스포츠윤리-12","year":2025,"level":"2급","subject":"스포츠윤리","qno":12,"stem":"스포츠조직의 윤리경영에 관한 설명으로 옳지 않은 것은?","choices":["스포츠조직을 투명하고 합리적으로 운영한다.","과대 선전 등으로 스포츠 소비자를 속이지 않는다.","스포츠 시설 운영에서 공해, 소음 등으로 인한 사회적 비용을 고려 한다.","스포츠센터의 운영 수익을 더 늘이기 위해 지도자의 노동 강도를 높인다."],"answer":[4]},{"id":"2025-2급-스포츠윤리-13","year":2025,"level":"2급","subject":"스포츠윤리","qno":13,"stem":"<보기>의 사례에서 ㉠에 해당하는 심판의 자질과 ㉡에 해당하는 맹자의 사단(四端)은? <보기>. 배구 경기의 주심인 ㉠A 심판은 최근 개정된 규정을 정확하게 숙지하지 못하여 오심을 범했다. 부심으로 경기를 관장하던 B심판은 오심임을 알았으나 A 심판에 대한 징계가 걱정되어 침묵했다. 시합이 끝난 후 ㉡B 심판은 양심의 가책을 지우지 못하고 활동을 중단했다. ㉠ ㉡","choices":["심판의 청렴성 사양지심(辭讓之心)","심판의 전문성 수오지심(羞惡之心)","심판의 자율성 시비지심(是非之心)","심판의 공정성 측은지심(惻隱之心)"],"answer":[2]},{"id":"2025-2급-스포츠윤리-14","year":2025,"level":"2급","subject":"스포츠윤리","qno":14,"stem":"공리주의 윤리 규범을 스포츠에 바르게 적용한 것이 아닌 것은?","choices":["스포츠에서 결과에 따른 만족을 중시한다.","스포츠 규칙 제정은 공정과 평등의 원칙에 근거한다.","스포츠 상황에서 행위의 유용성보다 인성의 바름을 강조한다.","스포츠에서 소수보다 다수의 이익을 우선하는 것이 정당화될 수 있다."],"answer":[3]},{"id":"2025-2급-스포츠윤리-15","year":2025,"level":"2급","subject":"스포츠윤리","qno":15,"stem":"<보기>에서 장애 차별의 개선을 위한 스포츠 실천의 조건만을 고른 것은? <보기>. ㄱ. 참여 종목과 대회는 지도자의 결정에 맡겨야 한다. ㄴ. 비장애인과 분리하여 수업하는 것을 원칙으로 한다. ㄷ. 활동 장비와 기구에 대한 재정적인 지원을 확보해야 한다. ㄹ. 다양한 사람과의 관계를 통해 사회성 함양의 기회를 제공해야 한다.","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"answer":[4]},{"id":"2025-2급-스포츠윤리-16","year":2025,"level":"2급","subject":"스포츠윤리","qno":16,"stem":"<보기>의 내용에 부합하는 철학자와 개념의 연결이 옳은 것은? <보기>. ∙지도자와 선배의 체벌과 폭력이 일상화되어 있다. ∙악은 포악한 괴물이나 악마처럼 괴이하지 않고 합숙소 생활과 같은 일상에 함께 있다. ∙폭력을 멈추게 할 방법은 행위의 내용과 책임을 묻고 반성하는 ‘사유’ 또는 ‘이성’에 있다.","choices":["홉스(T. Hobbes)－리바이어던","홉스(T. Hobbes)－악의 평범성","아렌트(H. Arendt)－리바이어던","아렌트(H. Arendt)－악의 평범성"],"answer":[4]},{"id":"2025-2급-스포츠윤리-17","year":2025,"level":"2급","subject":"스포츠윤리","qno":17,"stem":"의무주의 윤리 규범에 근거할 경우, <보기>의 괄호 안에 들어갈 내용으로 옳은 것은? <보기>. 나는 반칙을 하지 않으려고 노력한다. 왜냐하면 ( ) 때문이다.","choices":["퇴장을 당하면 손해를 보기","반칙을 하는 것은 옳지 않기","나의 플레이를 보는 사람들을 만족시켜야 하기","사람들이 나를 훌륭한 선수라고 칭송할 것이기"],"answer":[2]},{"id":"2025-2급-스포츠윤리-18","year":2025,"level":"2급","subject":"스포츠윤리","qno":18,"stem":"<보기>는 트랜스젠더 여성의 여성 스포츠 참여에 관한 설명이다. 이를 지지하는 견해의 근거가 아닌 것은? <보기>. 국제올림픽위원회(IOC)는 2016년 1월에 올림픽 대회를 비롯한 국제 경기대회에서 외과적인 수술을 받지 않은 성 전환자들도 선수로 출전할 수 있도록 허용해야 한다는 새로운 지침을 발표했다. 이에 따라 트랜스젠더 선수들은 꼭 성 전환 수술을 받지 않더라도 일정 요건만 충족하면 올림픽 등 국제 대회에 참가할 수 있게 되었다.","choices":["전통적인 젠더 이분법을 극복하고 양성 평등을 지향","트랜스젠더 여성의 스포츠 접근권은 공정성보다 우선","트랜스젠더에 대한 차별과 배제가 아닌 관용과 포용의 정책","트랜스젠더 여성 선수가 불공평한 이득을 가져 스포츠 본연의 의미 변화"],"answer":[4]},{"id":"2025-2급-스포츠윤리-19","year":2025,"level":"2급","subject":"스포츠윤리","qno":19,"stem":"함무라비 법전의 탈리오 법칙(Lex Talionis)이 정확하게 적용된 상황은?","choices":["농구 경기에서 한 경기에 5개의 파울을 한 선수를 퇴장시킨다.","축구 경기에서 부상 선수가 발생하면 선수의 안전을 위해 공을 밖으로 걷어낸다.","야구 경기에서 빈볼을 맞게 되면, 상대팀에게도 동일하게 빈볼을 던져 보복을 한다.","수영과 육상 경기의 결승전에서 준결승의 기록이 좋은 선수를 가운데 레인에 우선으로 배정한다."],"answer":[3]},{"id":"2025-2급-스포츠윤리-20","year":2025,"level":"2급","subject":"스포츠윤리","qno":20,"stem":"인종 차별과 관련된 사례로 맞지 않은 것은?","choices":["1936년 베를린 올림픽경기대회에서 히틀러는 육상종목 4관왕 제시 오웬스에게 시상 거부","1948년 런던 올림픽경기대회에서 독일과 일본 선수의 참가를 불허","1968년 멕시코 올림픽경기대회 시상식에서 미국의 토미 스미스와 존 카롤로스의 저항 표현","2008년 미국여자프로골프협회(LPGA) 출전 선수의 영어 사용 의무화"],"answer":[2]},{"id":"2025-2급-특수체육론-01","year":2025,"level":"2급","subject":"특수체육론","qno":1,"stem":"특수체육에 관한 설명으로 옳지 않은 것은?","choices":["특별한 요구를 가진 사람들을 위해 프로그램을 변형한다.","장애인이 참여하는 체육으로 비장애인과 함께하는 활동을 포함한다.","신체활동 참여에서 장애인의 임파워먼트(empowerment)를 강조한다.","학교체육 중심으로 생활체육이나 경쟁 스포츠 참여는 제한한다."],"answer":[4]},{"id":"2025-2급-특수체육론-02","year":2025,"level":"2급","subject":"특수체육론","qno":2,"stem":"<보기>에 해당하는 장애 유형의 체육활동 지도 방법으로 옳지 않은 것은? <보기>. ∙지적 기능과 적응행동이 제한된다. ∙쉽게 좌절하거나 동기 유발이 부족하다. ∙주의 집중 시간이 짧고 단기 기억에 어려움이 있다.","choices":["복잡한 계획이 필요하고 과제가 자주 바뀌는 활동을 강조한다.","활동 초기에 학생의 개별적 특성을 파악하여 친밀감을 형성한다.","학생이 흥미를 보이는 활동에서 시작하여 다양한 형태로 발전시킨다.","과제 활동을 제한하는 행동을 파악하고 개별적인 행동관리 계획을 수립한다."],"answer":[1]},{"id":"2025-2급-특수체육론-03","year":2025,"level":"2급","subject":"특수체육론","qno":3,"stem":"특수체육 수업 방식에 관한 설명으로 옳지 않은 것은?","choices":["또래 교수(peer tutoring): 친구나 선배가 교사로 참여한다.","협동학습(cooperative learning): 학생들이 팀이나 소집단으로 학습한다.","스테이션 교수(station teaching): 여러 곳에 과제를 배치하고 돌아가며 학습한다.","역주류화 수업(reverse mainstreaming): 교사와 학생이 역할을 바꿔가며 과제를 수행한다."],"answer":[4]},{"id":"2025-2급-특수체육론-04","year":2025,"level":"2급","subject":"특수체육론","qno":4,"stem":"정서･행동장애 학생의 특성을 고려한 체육활동 지도 전략으로 적절하지 않은 것은?","choices":["주의를 분산시키는 자극을 최소화한다.","활동 규칙을 정하고 안전교육을 실시한다.","환경을 구조화하고 예측이 가능한 과제를 제시한다.","정서적 예민함을 고려하여 뉴스포츠와 경쟁 활동을 배제한다."],"answer":[4]},{"id":"2025-2급-특수체육론-05","year":2025,"level":"2급","subject":"특수체육론","qno":5,"stem":"<보기>에서 설명하는 시각장애인 스포츠 종목은? <보기>. ∙시각 정보 없이 청각과 촉각을 활용하여 공의 위치와 방향을 파악한다. ∙탁구대와 유사한 테이블 위에서 소리 나는 공을 배트로 쳐서 상대편 포켓에 넣는다.","choices":["골볼","보체","쇼다운","텐핀 볼링"],"answer":[3]},{"id":"2025-2급-특수체육론-06","year":2025,"level":"2급","subject":"특수체육론","qno":6,"stem":"지체장애인에게 운동을 지도할 때 주의할 사항으로 옳지 않은 것은?","choices":["절단장애인의 절주 부위를 마사지하여 예민함을 감소시킨다.","절단장애인의 절주 부위 땀과 체액 분비물을 주기적으로 닦아 준다.","척수손상 장애인에게 기립성 저혈압이 발생하면 고강도 근력운동으로 전환한다.","척수손상 장애인의 과도한 체온 상승 예방을 위해 휴식을 취하고 수분을 섭취하게 한다."],"answer":[3]},{"id":"2025-2급-특수체육론-07","year":2025,"level":"2급","subject":"특수체육론","qno":7,"stem":"휠체어 스포츠의 경기 방법에 관한 설명으로 옳은 것은?","choices":["휠체어 농구: 공을 잡고 4회까지 휠체어를 밀고 이동할 수 있다.","휠체어 럭비: 한 팀은 남녀 구분 없이 4명이 경기에 출전할 수 있다.","휠체어 컬링:팀원 중 한 사람이라도 투구하는 사람의 휠체어에 닿으면 안 된다.","휠체어 테니스: 투 바운드가 허용되나 두 번째 바운드가 코트를 벗 어나면 실점한다."],"answer":[2]},{"id":"2025-2급-특수체육론-08","year":2025,"level":"2급","subject":"특수체육론","qno":8,"stem":"<보기>에서 설명하는 체력운동의 원리는? <보기>. 달리기를 지루해하는 지적장애 학생을 위해 줄넘기와 달리기를 혼합하여 실시하고, 중간에 휴식을 적절히 제공하였다.","choices":["다양성의 원리","특수성의 원리","전면성의 원리","가역성의 원리"],"answer":[1]},{"id":"2025-2급-특수체육론-09","year":2025,"level":"2급","subject":"특수체육론","qno":9,"stem":"특수체육 평가 도구에 관한 설명으로 옳은 것은?","choices":["PDMS-2(Peabody Developmental Motor Scale-2): 2∼7세까지 운동 기술을 종합적으로 검사한다.","BOT-2(Bruininks-Oseretsky Test of Motor Proficiency-2): 2∼10세까지 감각 운동과 기본 운동 기술을 검사한다.","PAPS-D(Physical Activity Promotion System for Students with Disabilities): 심폐 기능, 근 기능, 유연성, 민첩성, 장애 수용 정도를 검사한다.","BPFT(Brockport Physical Fitness Test): 장애 유형에 따라 항목별 검사 방법이 구분되며 최소 건강 기준과 권장 기준을 제시한다."],"answer":[4]},{"id":"2025-2급-특수체육론-10","year":2025,"level":"2급","subject":"특수체육론","qno":10,"stem":"그림의 순서대로 공 던지기를 지도하는 과정에 적용한 행동 관리 기법은? 던지기 자세를 설명하며 몸통과 팔꿈치를 잡고 교정함 던지기 자세를 설명하고 시범으로 보여주며 연습하게 함 언어 지시로만 던지기를 수행하게 함","choices":["용암법(fading)","과다 교정(overcorrection)","행동 계약(behavior contract)","프리맥 원리(Premack principle)"],"answer":[1],"img":"data:image/webp;base64,UklGRoA8AABXRUJQVlA4IHQ8AACQHQGdASqEA08BPm0ylUikIqIhI1ML4IANiWlu7mFRiBXowG71o3x//Zfyj8zH7D/Z/7t+yX9k9O/xn55+3f179nP7l+zfxy/zPi367/7/oZ/IfsB98/v/7l/3v95fkv/Vf4D9u/5f6Q/Gf+j/NH/J/IL+R/yz++/3n+//87+5fGp75/rvzQ8MXQ/9P/u/8d7BHqJ84/zH90/dP/C+kd++/l3+//yZ9jP+H7gP8o/p/+5/xH7qfv/72/g7fg/+N/vvuA+wP+d/27/o/5L/Q/tn9LP8r/2/85/uP2y9tf5f/mv+r/nf9R+3X2Gfyr+t/8L/B/6L9lvB1+6P//92P9wP/+R9DPYyfWrbBcG5T+X1vIveT/2e0VBCKxfa57FDlEVi+1z2KHKIrF9rnsUOURWL7XpMUOURWL7XPYocoisX2uexQ5RFYvtc9ihyiKxfa57EwdxqyIvEjlDtC/FAGvh6IkReJHKHaF+KANfD0RIi8SOUO0L8UAa7uvzzi6oYf/yU4q2D5xnpURfN7p6MRceQ1FBl899L7bDtx5kcA/fLnXV Km4bro8Sa8EQ/vc45Euv0L5P3Q653aihtHZ8r8AAADeaPYcDEKiBfUtp/tL9biYBhRTJWwzHAAAAAAA=="},{"id":"2025-2급-특수체육론-11","year":2025,"level":"2급","subject":"특수체육론","qno":11,"stem":"표의 지침과 준거를 사용하는 검사 도구에 관한 설명으로 옳은 것은? 기술 지침 수행 준거 1차 2차점수 두 손으로 정지된 공 치기 ∙배팅 티 위에 아동의 허리 높이로 공을 올려놓는다. ∙아동에게 공을 세게 치라고 지시한다. 잘 쓰는 손을 위쪽에, 잘 안 쓰는 손은 아래쪽에 가도록 하여 배트를 잡는다. 아동이 잘 쓰지 않는 어깨와 엉덩이가 앞쪽으로 가도록 바라본다. 스윙하는 동안 어깨와 엉덩이를 회전시킨다. 잘 쓰지 않는 발을 공 쪽으로 내딛는다. 공을 쳐서 앞쪽으로 보낸다.","choices":["준거지향적 방식과 규준지향적 방식 모두 활용이 가능하다.","5가지 이동 운동 기술과 6가지 공(ball) 조작 운동 기술을 측정한다.","수행 준거를 어느 정도 성취했느냐에 따라 1점 또는 2점을 부여한다.","발달장애 아동을 위한 검사 도구로 관찰과 면담을 통해 운동능력을 평가한다."],"answer":[1]},{"id":"2025-2급-특수체육론-12","year":2025,"level":"2급","subject":"특수체육론","qno":12,"stem":"<보기>의 장애 유형에 관한 설명으로 옳은 것은? <보기>. 중추신경계 손상에 의한 근육마비, 협응성 장애, 근육 약화, 기타 운동기능 장애를 보이는 비진행성 신경장애이다.","choices":["발작이 발생하면 움직임을 제한하고 곧바로 물을 마시게 한다.","단마비(monoplegia)는 양팔이나 양다리에 마비가 있는 경우이다.","비정상적 반사 발달과 신체 협응의 어려움, 가위 보행을 보이는 경우가 많다.","운동실조증(ataxia)은 대뇌 기저핵의 손상으로 불수의적 움직임과 머리 조절에 어려움을 보인다."],"answer":[3]},{"id":"2025-2급-특수체육론-13","year":2025,"level":"2급","subject":"특수체육론","qno":13,"stem":"그림은 특수체육 프로그램 서비스 전달 체계이다. ㉠∼㉢에 들어갈 용어를 바르게 나열한 것은? ㉠ ㉡ ㉢","choices":["개별화교육계획 평가 지도･상담","개별화교육계획 지도･상담 평가","지도･상담 평가 개별화교육계획","지도･상담 개별화교육계획 평가"],"answer":[2],"img":"data:image/webp;base64,UklGRvYXAABXRUJQVlA4IOoXAACQrwCdASoaA2UBPm00lkkkIqKhIbH6GIANiWlu+CKIuQZfn9+pMDSU79hf7n25/3/8ifPXzd+xPZvmmxLPmv3y/F/3/9xf7585f7H/H+J/zQ/vPUF/Kf5t/dfzL/s/nS9viAD8x/nH/E/uv7ue+99b/jfSj+S9QH9VP+DyFnqHsDf0T/E/8r7oPld/7/8p6YP0D/W/+f3Ev5l/a/+V/eeFGGd8J+SBkIFvhNYashAyEC3wmsNWQgZCBb4TWGrIQMhAt1fCvQhrHku8vHDSWP1DRqKF3CBb4TWGrIQMhAt8JrDVkHnOE8lZDb3rkYmEwBnRss7jaH/SGKNh7kHLAPCaw1ZCBkIFvhNYashAx+AvT5ET8Y1pHrKzFXZ4psMKaFL8lF57wAGxh1aYXA+z1BGQI5csFvVpASRKKwdE3sYMiKd7r2KCn3ZLSiG75dVbjbLWzGtHussRpmnTjNvFhjE/JAyEC3wmsNWQgZCBb3g4NOdoAV+rzjVBh/BOSxzaQBSsEUXX9YW1v2Z7Jo5m555wAtz4purJOjArWDRd+Sdr8jYlgsj4zwDYRgoXNpLST1byVCInDSY3Fu7BqyEDIQLfCaw1ZCBhXldSr7ZMZBZ6uVhf59k45XXwREDjLYrOPJo48ksDNlJ5nmeThwvfONwBQDMe37oeblTYvk4EW+8sh "2급","subject":"유아체육론","qno":2,"stem":"다음 ‘움직임 분류’ 일차원 모델에서 ㉠~㉣에 들어갈 용어가 바르게 나열된 것은? 움직임의 ( ㉠) 움직임의 ( ㉡) 움직임의 ( ㉢) 움직임의 ( ㉣) 대근 운동 기술불연속 운동 기술 개방형 운동 기술 안정 과제 소근 운동 기술 연속 운동 기술 폐쇄형 운동 기술 이동 과제 지속 운동 기술 조작 과제 ㉠ ㉡ ㉢ ㉣","choices":["근육 환경 맥락 기능","근육 시간적 연속성 환경 기능","의도 시간적 연속성 맥락 환경","기능 의도 시간적 연속성 근육"],"answer":[2]},{"id":"2025-2급-유아체육론-03","year":2025,"level":"2급","subject":"유아체육론","qno":3,"stem":"<보기>에서 건강 및 수행 관련 체력 요소에 관한 설명으로 옳은 것만을 모두 고른 것은? <보기>. ㄱ. 평형성－신체의 자세를 유지하는 능력 ㄴ. 유연성－신체 내외의 자극에 대응하는 운동 능력 ㄷ. 민첩성－자극에 반응하여 속도･방향을 신속하게 전환하는 능력 ㄹ. 협응성－각각의 운동 체계와 다양한 감각 양식을 효율적인 운동 패턴으로 통합하는 능력","choices":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":[3]},{"id":"2025-2급-유아체육론-04","year":2025,"level":"2급","subject":"유아체육론","qno":4,"stem":"<보기>에서 설명하는 원시반사 유형에 관한 내용으로 옳지 않은 것은? <보기>. ∙출생 후 몸을 보호하는 데 필요한 반사 유형이다. ∙신경적인 변이나 손상 예측에 사용되는 대표적인 반사이다. ∙이 반사 유형이 비대칭적으로 나타날 경우 신경적인 변이나 손상을 추측할 수 있다.","choices":["시기: 출생부터 4~7개월까지 나타난다.","반응: 특정한 자극에 팔과 다리가 신전되며 팔을 벌리고 손가락을 편다.","유발자극: 놀라거나 아래로 떨어지는 자극에는 발생하지 않는다.","기타: 소멸 시기 이후에도 지속되면 감각운동 장애의 발생을 추측할 수 있다."],"answer":[3]},{"id":"2025-2급-유아체육론-05","year":2025,"level":"2급","subject":"유아체육론","qno":5,"stem":"<보기>가 설명하는 운동발달 프로그램의 구성 원리는? <보기>. ∙유소년의 연령, 성별, 신체 특성의 변화와 순서를 고려해야 함. ∙유소년의 발달 단계를 고려하여 운동 프로그램을 계획하는 것이 중요함. ∙간단한 동작에서 복잡한 동작으로, 쉬운 활동에서 어려운 활동으로 지도해야 함.","choices":["다양성의 원리","안전성의 원리","특이성의 원리","연계성의 원리"],"answer":[4]},{"id":"2025-2급-유아체육론-06","year":2025,"level":"2급","subject":"유아체육론","qno":6,"stem":"<보기>에서 설명하는 에릭슨(E. Erikson)의 심리사회발달 단계는? <보기>. ∙기초적인 인지 기술과 사회적 기술의 습득이 중요함. ∙소속된 사회, 문화를 습득하여 실수나 실패를 접하는 것이 중요함. ∙타인과 자신을 비교하여 긍정적, 부정적 경험을 할 수 있음.","choices":["2단계(자율성 또는 수치심 발달)","3단계(주도성 또는 죄의식 발달)","4단계(근면성 또는 열등감 발달)","5단계(정체감 또는 역할혼미 발달)"],"answer":[3]},{"id":"2025-2급-유아체육론-07","year":2025,"level":"2급","subject":"유아체육론","qno":7,"stem":"하비거스트(R. Havighurst)의 발달 과제 이론에서 ㉠~㉢에 들어갈 내용을 바르게 나열한 것은? 발달 단계 1단계(0~6세) 2단계(7~12세) 3단계(13~18세) 성취 과업 ∙걷기 학습 ∙개인적 독립심 획득 ∙자신의 체격 수용 ∙옳고 그름을 구별하는 학습의 발달 ∙일상 놀이에 필요한 신체적 기술의 학습 ∙성숙한 관계 형성 및  for understanding): ‘무엇을 할 것인가 (what to do)’를 고민하며 인지적 학습이 선행된다.","이해중심 게임수업(teaching games for understanding): 구성주의 인식론에 근거하며, 게임에 대한 ‘이해’를 중심으로 문제해결 능력을 기른다."],"answer":[1]},{"id":"2025-2급-유아체육론-18","year":2025,"level":"2급","subject":"유아체육론","qno":18,"stem":"유아기 걷기 동작의 기술 단계 분류에서 시작 단계의 특징은?","choices":["보폭이 커지고 안정된다.","발바닥 전체로 바닥과 접촉한다.","팔 흔들기가 반사적으로 이루어진다.","발끝이 바깥쪽으로 향하는 현상이 줄어든다."],"answer":[2]},{"id":"2025-2급-유아체육론-19","year":2025,"level":"2급","subject":"유아체육론","qno":19,"stem":"피아제(J. Piaget)가 제시한 인지발달 단계와 특징의 연결이 옳지 않은 것은? 단계 특징","choices":["감각운동기 학습자는 감각경험과 움직임의 상호작용을 통하여 학습하게 된다.","전 조작기 활동적인 놀이를 통한 지적 실험으로 가역성을 갖게 된다.","구체적 조작기 보존개념이 형성되고 분류, 서열화 등의 수학적 조작능력이 나타난다.","형식적 조작기 인지적 과정을 통하여 추상적, 논리적, 체계적 사고를 할 수 있다."],"answer":[2]},{"id":"2025-2급-유아체육론-20","year":2025,"level":"2급","subject":"유아체육론","qno":20,"stem":"<보기>에서 설명하는 발달 이론은? <보기>. ∙직접 행동이 아니어도 사회적 상황에서 타인의 행동을 관찰하며 학습이 가능하다. ∙유아 주변의 인물, 특히 부모의 언어 형태, 성역할, 사회적 행동을 모방한다.","choices":["비고츠키(L. Vygotsky)의 상호작용 이론","반두라(A. Bandura)의 사회학습 이론","매슬로(A. Maslow)의 욕구위계 이론","프로이드(S. Freud)의 정신분석 이론"],"answer":[2]},{"id":"2025-2급-노인체육론-01","year":2025,"level":"2급","subject":"노인체육론","qno":1,"stem":"활동이론을 옳게 설명한 것은?","choices":["활성산소의 증가가 노화를 촉진한다.","노화와 관련한 대표적 생물학적 이론이다.","사회에서 점진적 역할 배제가 노화의 핵심이다.","노인의 사회활동 참여 정도가 높을수록 생활 만족도가 높아진다."],"answer":[4]},{"id":"2025-2급-노인체육론-02","year":2025,"level":"2급","subject":"노인체육론","qno":2,"stem":"근감소증(sarcopenia)에 관한 설명 중 옳지 않은 것은?","choices":["호흡근의 마비를 유발할 수 있다.","노화와 관련한 대표적인 증상 또는 질환이다.","근위축(muscle atrophy)으로도 알려져 있다.","유산소 능력, 골밀도, 인슐린 민감성 및 신진대사율 감소를 유발할 수 있다."],"answer":[1]},{"id":"2025-2급-노인체육론-03","year":2025,"level":"2급","subject":"노인체육론","qno":3,"stem":"<보기>에서 생물학적 노화의 특성으로 옳은 것만 모두 고른 것은? <보기>. ㄱ. 노화는 치료가 가능하다. ㄴ. 모든 사람에게 보편적으로 일어난다. ㄷ. 시간의 흐름에 따라 점진적으로 일어난다. ㄹ. 환경적 요인을 배제한 내재적 요인에 의해 발생한다.","choices":["ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"answer":[4]},{"id":"2025-2급-노인체육론-04","year":2025,"level":"2급","subject":"노인체육론","qno":4,"stem":"<보기>에서 체중부하운동으로 옳은 것만 모두 고른 것은? <보기>. ㄱ. 등산 ㄴ. 스케이팅 ㄷ. 테니스 ㄹ. 고정식 자전거 타기 ㅁ. 암 에르고미터(arm ergometer) ㅂ. 수영","choices":["ㄱ, ㄴ, ㅁ","ㄱ, ㄴ, ㄷ","ㄷ, ㅁ, ㅂ","ㄷ, ㄹ, ㅂ"],"answer":[2]},{"id":"2025-2급-노인체육론-05","year":2025,"level":"2급","subject":"노인체육론","qno":5,"stem":"노인의 운동 빈도에 관한 설명으로 옳지 않은 것은?","choices":["운동 빈도는 규칙적이어야 한다.","신체적으로 무리가 없는 경우 주 5일 이상도 권장된다.","운동 의욕이 높은 노인의 경우 매일 강도 높은 운동이 권장된다.","운동 효과와 피로도를 고려했을 때 주 3회 정도가 가장 적절하다."],"answer":[3]},{"id":"2025-2급-노인체육론-06","year":2025,"level":"2급","subject":"노인체육론","qno":6,"stem":"만성질환 노인의 운동 효과로 옳지 않은 것은?","choices":["비만 노인의 체지방량이 감소하고 근육량은 유지되거나 증가된다.","골다공증 노인의 골밀도 감소가 개선되고 낙상과 골절이 예방된다.","당뇨 노인의 혈당량이 감소하고 근육의 인슐린 민감성이 감소된다.","퇴행성관절염 노인의 유연성이 향상되고 관절의 가동 범위가 증가된다."],"answer":[3]},{"id":"2025-2급-노인체육론-07","year":2025,"level":"2급","subject":"노인체육론","qno":7,"stem":"뇌졸중 노인을 위한 운동 지도 시 고려해야 할 사항은?","choices":["우측마비 노인의 경우 언어지시보다 행동적 시범을 보인다.","마비가 없는 쪽에 집중적으로 스트레칭 운동을 실시하도록 한다.","낙상 위험이 있으므로 균형감각과 기동성 향상을 위한 운동을 실시하지 않는다.","장애 정도가 심한 노인의 경우 똑바로 선 상태에서 스텝핑 운동을 빠르게 하도록 한다."],"answer":[1]},{"id":"2025-2급-노인체육론-08","year":2025,"level":"2급","subject":"노인체육론","qno":8,"stem":"<보기>에서 관절염 노인을 위한 운동 관련 설명으로 옳은 것만 모두 고른 것은? <보기>. ㄱ. 체중부하운동을 실시한다. ㄴ. 운동 시 느끼는 통증은 고려하지 않는다. ㄷ. 운동 전후에 냉찜질 또는 온찜질을 한다. ㄹ. 수중운동 시 물의 온도는 29~32℃를 유지한다. ㅁ. 특정 관절의 과사용을 피하기 위해 크로스트레이닝을 실시한다.","choices":["ㄱ, ㄴ, ㄷ","ㄴ, ㄹ, ㅁ","ㄷ, ㄹ, ㅁ","ㄱ, ㄷ, ㄹ"],"answer":[3]},{"id":"2025-2급-노인체육론-09","year":2025,"level":"2급","subject":"노인체육론","qno":9,"stem":"<보기>에서 설명하는 노화 이론은? <보기>. 통계에 따르면 전문체육인이 일반인에 비해 퇴행성관절염 발병률이 더 높다고 보고되고 있다. 그뿐만 아니라 전문체육 종목 중에서도 상대적으로 몸을 더 많이 사용하는 축구나 미식축구 선수 들의 은퇴 시기가 골프, 야구 선수에 비해 빠른 것으로 나타났다.","choices":["면역반응이론","교차결합이론","세포노화이론","사용마모이론"],"answer":[4]},{"id":"2025-2급-노인체육론-10","year":2025,"level":"2급","subject":"노인체육론","qno":10,"stem":"<보기>의 ㉠, ㉡에 들어갈 용어로 옳은 것은? <보기>. ∙( ㉠ ) 길이가 감소하면서 노화가 일어난다. ∙노화로 인한 대표적 관절 질환은 ( ㉡ )이다. ㉠ ㉡","choices":["텔로미어 퇴행성 관절염","글루코스 퇴행성 관절염","텔로미어 류마티스 관절염","글루코스 류마티스 관절염"],"answer":[1]},{"id":"2025-2급-노인체육론-11","year":2025,"level":"2급","subject":"노인체육론","qno":11,"stem":"노인 운동 시 준비운동과 정리운동의 이점에 관한 다음 표에서 ㉠, ㉡에 들어갈 용어로 옳은 것은? 준비운동 정리운동 ∙손상 위험 감소 ∙움직이는 동작 범위 향상 ∙사용되는 근육으로의 혈액 순환 ( ㉠ ) ∙체내 온도 감소 ∙젖산 농도 감소 ∙혈액의 카테콜아민 수치 ( ㉡ ) ㉠ ㉡ ㉠ ㉡","choices":["증가 증가","증가 감소","감소 증가","감소 감소"],"answer":[2]},{"id":"2025-2급-노인체육론-12","year":2025,"level":"2급","subject":"노인체육론","qno":12,"stem":"<보기>의 노인 운동 지도 시 손상 방지 및 응급상황에 관한 안전관리 예방 지침 중 옳은 것만 모두 고른 것은? <보기>. ㄱ. 운동 중에 적정한 실내 온도가 유지되는지 확인한다. ㄴ. 운동 시작 전에 모든 참여자에게 사전 검사를 하여 현재 상태를 파악한다. ㄷ. 실외 운동 시작 전에 모든 참여자에게 선글라스와 모자 등을 착용하도록 안내한다. ㄹ. 심장질환자의 경우 운동 전후 혈당을 확인하고, 저혈당에 대비 해서 당 섭취가 가능한 간식을 준비한다. ㅁ. 운동 중 가슴 통증, 불규칙한 심박수, 호흡곤란, 현기증 등이 나타나면 곧바로 운동을 중단하고 병원으로 이동한다.","choices":["ㄱ, ㄷ, ㄹ","ㄴ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"],"answer":[3]},{"id":"2025-2급-노인체육론-13","year":2025,"level":"2급","subject":"노인체육론","qno":13,"stem":"<보기>에서 설명하는 노화를 보는 관점은? <보기>. 발테스(P.Baltes et al.)와 그 동료들은 노화를 손실(loss)과 이득(gain)이 함께 일어나는 과정이라고 하였다. 노화로 인해 신체적 기능 손실이 있는 반면에 경험으로 얻은 환경에 대한 적응력, 지혜와 같은 이득도 있다. 그들은 인간 발달을 두 단계로 나누었는데 첫 단계는 초기 발달 단계로 급속한 신체적 발달이 나타나고 이후의 단계에서는 신체적 발달은 더디나 환경에 적응하는 능력은 지속적으로 발달한다.","choices":["1차적 노화(primary aging)","2차적 노화(secondary aging)","생태학적 발달(ecological development)","전 생애적 발달(life-span development)"],"answer":[4]},{"id":"2025-2급-노인체육론-14","year":2025,"level":"2급","subject":"노인체육론","qno":14,"stem":"<보기>에서 청각적 문제가 있는 박 할아버지가 안전한 환경에서 효과적인 운동을 지도받기 위한 안전관리 지침 중 옳은 것만 모두 고른 것은? <보기>. ㄱ. 운동 장소는 소음이 적은 조용한 곳을 선정한다. ㄴ. 운동 장소는 눈이 부실 정도로 조명을 밝게 한다. ㄷ. 운동 지도 시 잘 들리는 귀 쪽으로 가서 설명한다. ㄹ. 운동 지도 시 입술 모양이나 표정을 활용해 지도한다. ㅁ. 복잡한 운동 방법이나 기술을 설명할 때는 시범이나 사진과 같은 보조물을 활용한다.","choices":["ㄱ, ㄴ, ㄷ","ㄴ, ㄹ, ㅁ","ㄴ, ㄷ, ㄹ, ㅁ","ㄱ, ㄷ, ㄹ, ㅁ"],"answer":[4]},{"id":"2025-2급-노인체육론-15","year":2025,"level":"2급","subject":"노인체육론","qno":15,"stem":"노인의 평형성 향상 운동으로 옳지 않은 것은? (보기 그림의 ①~④ 중)","choices":["자기 체중을 이용한 한 발 들기","앉아서 허리 앞으로 구부리기","일렬로 걷기","짐볼 앉기"],"answer":[2],"img":"data:image/webp;base64,UklGRkhxAABXRUJQVlA4IDxxAACwJgKdASqEA50DPm00lkkkIqUhIlO6aKANiWlu/BjaTAhfVs5lUvlz+4f3r9nve94V/jP7v/if+F/hvT/8W+d/uf91/a7+6+0v/F+LL1H+f/2H+ n)－엎침(pronation)","가쪽번짐(eversion), 발바닥쪽굽힘(plantarflexion)－엎침(pronation)","안쪽번짐(inversion), 발등쪽굽힘(dorsiflexion)－뒤침(supination)","안쪽번짐(inversion), 발바닥쪽굽힘(plantarflexion)－뒤침(supination)"],"answer":[4]},{"id":"2025-1급-운동상해-10","year":2025,"level":"1급","subject":"운동상해","qno":10,"stem":"몰턴(Morton) 지간 신경종이 가장 흔히 발생하는 부위는?","choices":["첫 번째와 두 번째 발허리뼈(metatarsal) 사이","두 번째와 세 번째 발허리뼈(metatarsal) 사이","세 번째와 네 번째 발허리뼈(metatarsal) 사이","네 번째와 다섯 번째 발허리뼈(metatarsal) 사이"],"answer":[3]},{"id":"2025-1급-운동상해-11","year":2025,"level":"1급","subject":"운동상해","qno":11,"stem":"손목굴(carpal tunnel) 관련 손상 평가가 아닌 것은?","choices":["앨런 검사(Allen’s test)","팔렌 검사(Phalen’s test)","패트릭 검사(Patrick’s test)","티넬 사인 검사(Tinel’s sign test)"],"answer":[3]},{"id":"2025-1급-운동상해-12","year":2025,"level":"1급","subject":"운동상해","qno":12,"stem":"무릎넙다리 통증 증후군(patellofemoral pain syndrome)의 관절과 근육 기능에 관한 설명으로 옳지 않은 것은?","choices":["증가된 Q각은 무릎관절이 굽힘되었을 때 가쪽 관절면의 압박력을 증가시킨다.","정강뼈의 가쪽돌림은 융기(condyle)안 무릎뼈의 가쪽 압박력을 증가시켜 무릎뼈의 회전을 유발한다.","무릎뼈 고위(alta)는 무릎뼈가 정상보다 위쪽에 위치하면서 낙타등 징후(camel sign)가 나타난다.","무릎뼈 저위(baja)는 압박성 통증보다 불안정성을 유발하며 무릎 넙다리 통증을 감소시킨다."],"answer":[4]},{"id":"2025-1급-운동상해-13","year":2025,"level":"1급","subject":"운동상해","qno":13,"stem":"<보기>는 재활 운동 시 준비운동의 효과이다. ㉠, ㉡에 들어갈 내용으로 옳은 것은? <보기>. ∙알파섬유의 활동 ( ㉠ ) ∙신경자극 속도 증가 ∙근육의 혈류량 ( ㉡ ) ∙관절운동범위 증가 ㉠ ㉡ ㉠ ㉡","choices":["감소 증가","감소 감소","증가 증가","증가 감소"],"answer":[1]},{"id":"2025-1급-운동상해-14","year":2025,"level":"1급","subject":"운동상해","qno":14,"stem":"<보기>에서 고지 환경에서 발생되는 증상과 처치에 대한 설명으로 옳은 것은? <보기>. ㄱ. 높은 기압 및 산소와 관련된 증상이 발생한다. ㄴ. 급성 고산병 증상이 나타나면 고지대 이동을 금지한다. ㄷ. 고산병의 증상을 완화하기 위해서는 고탄수화물 식사를 권장한다. ㄹ. 급성 고산병의 증상으로는 구토, 귀의 통증, 고막의 출혈과 파열 등이 있다.","choices":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ"],"answer":[3]},{"id":"2025-1급-운동상해-15","year":2025,"level":"1급","subject":"운동상해","qno":15,"stem":"일반적인 촉진(palpation) 방법으로 옳지 않은 것은?","choices":["객관적으로 비교하기 위해 건측의 같은 부위를 먼저 촉진한다.","근육과 힘줄을 먼저 실시하고 뼈와 인대 순서로 촉진한다.","손상을 악화할 수 있으므로 움직임을 최소화하여 촉진한다.","손상이 의심되는 먼 부위부터 촉진한 후 손상된 부위를 촉진한다."],"answer":[2] 로 인한 생리적 반응으로 옳은 것은?","choices":["혈액량 증가","피부 혈류 증가","항이뇨호르몬 증가","체온 조절 능력 증가"],"answer":[3]},{"id":"2025-1급-건강교육론-01","year":2025,"level":"1급","subject":"건강교육론","qno":1,"stem":"건강관련체력에 해당하는 체력 요소는?","choices":["협응성","민첩성","평형성","심폐지구력"],"answer":[4]},{"id":"2025-1급-건강교육론-02","year":2025,"level":"1급","subject":"건강교육론","qno":2,"stem":"건강교육에 관한 설명으로 옳지 않은 것은?","choices":["건강과 질병에 대한 지식을 갖게 하는 계획된 교육과정이다.","개인보다는 지역사회 집단의 건강 유지, 증진 및 재활을 목표로 한다.","건강교육 프로그램은 개인, 집단, 지역에 따라 다르게 적용되어야 한다.","지역사회 활동에 참여하게 하여 의존적인 삶이 아닌 적극적인 삶을 유도한다."],"answer":[2]},{"id":"2025-1급-건강교육론-03","year":2025,"level":"1급","subject":"건강교육론","qno":3,"stem":"<보기>에서 아동의 운동에 관한 설명으로 옳은 것을 모두 고른 것은? <보기>. ㄱ. 골부하를 주는 운동을 피함 ㄴ. 근력향상보다 조정력 운동을 강조함 ㄷ. 과도한 운동은 골손상 유발로 인하여 성장판 조기 종결을 가져옴","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"answer":[3]},{"id":"2025-1급-건강교육론-04","year":2025,"level":"1급","subject":"건강교육론","qno":4,"stem":"아동기의 성장과 발달에 관한 설명으로 옳은 것은?","choices":["뼈의 성장은 남아가 여아보다 빠르다.","체중과 신장의 성장은 동일한 경향을 보인다.","성장은 신체의 질적 구조와 기능의 변화를 의미한다.","발달은 일정한 순서가 없고 말초에서 중심 방향으로 나타난다."],"answer":[2]},{"id":"2025-1급-건강교육론-05","year":2025,"level":"1급","subject":"건강교육론","qno":5,"stem":"파킨슨병의 일반적인 운동장애가 아닌 것은?","choices":["근육 경직","운동 속도 및 보폭 증가","움직임의 시작이 어려움","이동 시 움직임의 멈춤이 어려움"],"answer":[2]},{"id":"2025-1급-건강교육론-06","year":2025,"level":"1급","subject":"건강교육론","qno":6,"stem":"관상동맥질환의 위험인자가 아닌 것은?","choices":["시력","나이","흡연","혈압"],"answer":[1]},{"id":"2025-1급-건강교육론-07","year":2025,"level":"1급","subject":"건강교육론","qno":7,"stem":"고혈압 전단계에 있는 사람의 생활습관 개선 방식으로 옳지 않은 것은?","choices":["금연","체중 관리","염증성 사이토카인(cytokines)을 증가시키는 운동","DASH(Dietary Approaches to Stop Hypertension) 다이어트 요법"],"answer":[3]},{"id":"2025-1급-건강교육론-08","year":2025,"level":"1급","subject":"건강교육론","qno":8,"stem":"심혈관질환자의 운동 시 주의 사항으로 옳지 않은 것은?","choices":["발살바 매뉴버를 적용하여 근력강화 운동을 한다.","목표심박수를 확인하고 운동강도를 적절히 조절한다.","고온･다습･저온 환경에서는 되도록 운동을 피한다.","가슴에 통증이 느껴질 때는 운동을 중단한다."],"answer":[1]},{"id":"2025-1급-건강교육론-09","year":2025,"level":"1급","subject":"건강교육론","qno":9,"stem":"과체중과 비만 환자를 위한 미국스포츠의학회(ACSM, 2022)의 FITT 권고 사항으로 옳지 않은 것은?","choices":["유산소 운동은 주당 5일 이상 실시한다.","유연성 운동 시 PNF 스트레칭을 포함한다.","유산소 운동은 최소 30분에서 60분 이상으로 점차 증가시킨다.","유산소 운동은 여유심박수(HRR)의 60~80% 강도로 시작한다."],"answer":[4]},{"id":"2025-1급-건강교육론-10","year":2025,"level":"1급","subject":"건강교육론","qno":10,"stem":"당뇨병 환자의 혈당 관리 시 고려 사항으로 옳은 것은?","choices":["식이, 운동, 약물 중 하나만을 조절한다.","운동 전의 이상적인 혈당수치는 150~300 mg/dL이다.","지속적인 혈당 상승은 동반 질환의 발병률을 감소시킨다.","유산소 운동은 연속하여 2일 이상 중단하지 않도록 한다."],"answer":[4]},{"id":"2025-1급-건강교육론-11","year":2025,"level":"1급","subject":"건강교육론","qno":11,"stem":"<보기>의 정보를 이용하여 카보넨(Karvonen) 공식으로 산출한 목표 심박수(THR)는? <보기>. ∙나이: 43세 ∙운동 경력: 없음 ∙질환: 이상지질혈증 ∙체중: 58 kg ∙안정 시 심박수: 71회/분 ∙운동 강도: 40% HRR","choices":["약 106회/분","약 113회/분","약 124회/분","약 130회/분"],"answer":[2]},{"id":"2025-1급-건강교육론-12","year":2025,"level":"1급","subject":"건강교육론","qno":12,"stem":"미국스포츠의학회(ACSM, 2022)의 골다공증 환자를 위한 저항운동 권고 사항으로 옳지 않은 것은?","choices":["12개 종류 이상의 저항운동으로 다양하게 구성","해당 저항으로 2회 추가 반복이 가능할 때 저항을 증가","주당 1~2일 비연속적으로 시작해 주 2~3일 진행","8~12회 반복하는 1세트로 시작해 약 2주 후 2세트로 증가"],"answer":[1]},{"id":"2025-1급-건강교육론-13","year":2025,"level":"1급","subject":"건강교육론","qno":13,"stem":"스트레스의 원인 중 화학적 요인은?","choices":["세균, 바이러스","직장, 가정, 대인관계","흡연, 알코올, 기호식품","온도, 빛, 소리, 과로, 수면부족"],"answer":[3]},{"id":"2025-1급-건강교육론-14","year":2025,"level":"1급","subject":"건강교육론","qno":14,"stem":"<보기>의 ㉠~㉢에 들어갈 용어는? <보기>. 술을 마시면 체내에 들어간 알코올은 신진대사 과정에서 ( ㉠ )에 의해 분해되어 독성물질인 ( ㉡ )이/가 되며 최종적으로 물과 ( ㉢ )(으)로 분해된다. ㉠ ㉡ ㉢","choices":["알코올탈수소효소 아세트알데히드 이산화탄소","알코올탈수소효소 아세톤 케톤","알코올탈탄소효소 아세트알데히드 이산화탄소","알코올탈탄소효소 아세톤 케톤"],"answer":[1]},{"id":"2025-1급-건강교육론-15","year":2025,"level":"1급","subject":"건강교육론","qno":15,"stem":"카페인이 운동 수행에 미치는 영향으로 옳은 것은?","choices":["유리지방산 농도 증가","피로도 증가","에피네프린 분비 감소","집중력 향상 및 각성도 저하"],"answer":[1]},{"id":"2025-1급-건강교육론-16","year":2025,"level":"1급","subject":"건강교육론","qno":16,"stem":"<보기>에 제시된 검사 결과로 진단되는 질환은? <보기>. ∙허리둘레: 120 cm ∙공복혈당: 80 mg/dL ∙중성지방: 250 mg/dL ∙혈압: 150/100 mmHg ∙고밀도 지단백 콜레스테롤: 60 mg/dL","choices":["탈수","심부전","골다공증","대사증후군"],"answer":[4]},{"id":"2025-1급-건강교육론-17","year":2025,"level":"1급","subject":"건강교육론","qno":17,"stem":"요통 환자를 위한 맥킨지(McKenzie) 운동에 관한 설명으로 옳지 않은 것은?","choices":["신전(폄) 운동으로 구성","추간판탈출증 환자에게 권장","허리를 뒤로 젖히는 동작을 금지함","척추뒤굽음증(kyphosis)으로 요통 유발 시 사용"],"answer":[3]},{"id":"2025-1급-건강교육론-18","year":2025,"level":"1급","subject":"건강교육론","qno":18,"stem":"관절염 환자의 운동 효과가 아닌 것은?","choices":["염증 감소","만성통증 완화","‘아침 경직’ 증상 완화","내인성 마취 효과 감소"],"answer":[4]},{"id":"2025-1급-건강교육론-19","year":2025,"level":"1급","subject":"건강교육론","qno":19,"stem":"<보기>에서 설명하는 질환은? <보기>. ∙치매의 가장 흔한 원인 질병이며, 60~80%를 차지함 ∙아밀로이드-β 플라그와 신경섬유다발의 병리학적 특징이 관찰됨 ∙우울증상, 신경이상 행동 문제, 심각한 수면장애 등을 동반하여 기억장애를 유발하거나 악화시킴","choices":["파킨슨병","뇌성마비","알츠하이머병","다발성경화증"],"answer":[3]},{"id":"2025-1급-건강교육론-20","year":2025,"level":"1급","subject":"건강교육론","qno":20,"stem":"노화로 인한 신체 변화에 관한 설명으로 옳은 것은?","choices":["골밀도 증가","근육량 증가","최대산소섭취량 감소","피부 자극의 민감도 증가"],"answer":[3]},{"id":"2025-1급-장애인스포츠론-01","year":2025,"level":"1급","subject":"장애인스포츠론","qno":1,"stem":"장애인 선수의 운동 관련 증상에 따른 고려 사항으로 옳지 않은 것은? 증상 고려 사항","choices":["발작 발작이 일어날 때 신체 움직임을 억제하지 않는다.","탈수증 훈련･경기 중 충분히 수분을 섭취한다.","요로감염 올바른 도뇨법으로 세균감염을 예방한다.","환축추불안정 승마, 높이뛰기, 축구와 같은 활동에 참여시킨다."],"answer":[4]},{"id":"2025-1급-장애인스포츠론-02","year":2025,"level":"1급","subject":"장애인스포츠론","qno":2,"stem":"<보기>의 국제장애인스포츠기구 중 국제패럴림픽위원회(IPC)의 회원 단체로 바르게 묶인 것은? <보기>. ㄱ. 국제스페셜올림픽위원회(SOI) ㄴ. 국제농아인스포츠위원회(ICSD) ㄷ. 국제시각장애인스포츠연맹(IBSA) ㄹ. 국제지적장애인스포츠연맹(Virtus)","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"answer":[4]},{"id":"2025-1급-장애인스포츠론-03","year":2025,"level":"1급","subject":"장애인스포츠론","qno":3,"stem":"BPFT(Brockport Physical Fitness Test)의 체력 요소와 검사 항목이 바르게 연결되지 않은 것은? 체력 요소 검사 항목","choices":["심폐지구력 16m, 20m 페이서(PACER)","신체구성 피부두겹 측정","유연성 앉아 윗몸 앞으로 굽히기","근력 및 근지구력 3분 암 에르고미터"],"answer":[4]},{"id":"2025-1급-장애인스포츠론-04","year":2025,"level":"1급","subject":"장애인스포츠론","qno":4,"stem":"2024년 제44회 전국장애인체육대회 개최지는?","choices":["전남(목포)","경북(구미)","경남(김해)","충남(아산)"],"answer":[3]},{"i   get fav(){ const v = lsGet(LS.fav, {}); return (v && typeof v === 'object') ? v : {}; },
  get passes(){ const v = lsGet(LS.pass, []); return Array.isArray(v) ? v : []; },
  get log(){ const v = lsGet(LS.log, []); return Array.isArray(v) ? v : []; },
  get level(){ return lsGet(LS.level, null) === '1급' ? '1급' : '2급'; },
  set level(v){ lsSet(LS.level, v === '1급' ? '1급' : '2급'); },
  get freeLast(){ const v = lsGet(LS.free, null); return (v && typeof v === 'object' && v.total) ? v : null; }
};

/* ---------- 유입(UTM) ---------- */
const UTM = (function(){
  const keys = ['source','medium','campaign','content','term'];
  let cur = {}, p = null;
  try{ p = new URLSearchParams(location.search); }catch(e){}
  if(p) keys.forEach(k => { const v = p.get('utm_' + k); if(v) cur[k] = String(v).slice(0,40); });
  const prev = lsGet(LS.utm, null) || {};
  if(Object.keys(cur).length){
    const rec = Object.assign({}, prev, cur, { first_at: prev.first_at || Date.now(), last_at: Date.now(), hits: (prev.hits || 0) + 1, landing: String(location.href).split('#')[0].slice(0,300) });
    lsSet(LS.utm, rec);
    return rec;
  }
  return prev;
})();

/* ---------- 전환 이벤트 ---------- */
function track(name, extra){
  try{
    const ev = lsGet(LS.ev, []);
    const list = Array.isArray(ev) ? ev : [];
    const rec = Object.assign({ name: name, at: Date.now(), src: UTM.source || '', level: S.level, view: (state && state.mode) || '' }, extra || {});
    list.push(rec);
    lsSet(LS.ev, list.slice(-500));
  }catch(e){}
}

const app = () => document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isPaid = () => S.passes.length > 0;
const pctOf = (c, t) => t ? Math.round(c / t * 100) : 0;
const cut = (s, n) => { s = String(s).replace(/\s+/g,' ').trim(); return s.length > n ? s.slice(0, n) + '…' : s; };
function byLevel(lv){ return QB.filter(q => q.level === lv); }
function bySubject(lv, subj){ return byLevel(lv).filter(q => q.subject === subj).sort((a,b)=>a.qno-b.qno); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const levelSubjects = (lv) => SUBJ_ORDER.filter(s => bySubject(lv, s).length);
const TOTAL_Q = byLevel('2급').length + byLevel('1급').length;

/* ---------- 무료 범위: 전 과목 1~5번 ---------- */
function freeHead(lv, subj){ return bySubject(lv, subj).slice(0, FREE_N); }
function isFreeQ(q){ return q.qno >= 1 && q.qno <= FREE_N; }
function freeCount(lv){ return levelSubjects(lv).reduce((n, s) => n + freeHead(lv, s).length, 0); }

function fmtClock(ms){

}

/* ---------- 풀이 ---------- */
function start(items, label, mode, opts){
  if(!items.length){ toast('문항을 준비하지 못했습니다.'); return; }
  opts = opts || {};
  if(!isPaid() && opts.gate) return gate(opts.reason || 'locked_start', opts.subject || '');
  stopTimer();
  state.items = items; state.idx = 0; state.correct = 0; state.miss = [];
  state.view = 'quiz'; state.answered = false;
  state.label = label; state.mode = mode || 'practice';
  state.subject = opts.subject || (items.every(q => q.subject === items[0].subject) ? items[0].subject : '');
  state.lv = items[0].level;
  state.mockStart = state.mode === 'mock' ? Date.now() : 0;
  document.getElementById('back').hidden = false;
  renderQ();
}

function renderQ(){
  const q = state.items[state.idx];
  state.answered = false;
  document.body.classList.add('quiz-mode');
  document.getElementById('title').textContent = state.label;
  const pct = Math.round(state.idx / state.items.length * 100);
  const timer = state.mode === 'mock' ? ' · <b id="mtimer" style="font-variant-numeric:tabular-nums">00:00</b>' : '';
  app().innerHTML = `
    <div class="qmeta"><span>${esc(q.subject)} · ${q.year}년 ${esc(q.level)}</span><span>${state.idx+1} / ${state.items.length}${timer}</span></div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="card">
      <p class="stem">${esc(q.stem)}</p>
      ${q.img ? `<figure class="qfig"><img src="${q.img}" alt="문제 자료(그래프·표)"></figure>` : ''}
      <div class="choices" id="ch">
        ${q.choices.map((c,i)=>`<button class="choice" data-i="${i+1}"><i>${CIRC[i]}</i><span>${esc(c)}</span></button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <div class="row" id="nextRow" style="display:none"><button class="btn" id="next">다음 문제</button></div>
      ${state.mode === 'free5' && state.idx + 1 >= state.items.length ? '<p class="mini" style="text-align:center;margin:0">이 과목은 6번부터 20문항이 남아 있습니다.</p>' : ''}
    </div>`;
  document.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(parseInt(b.dataset.i,10), q));
  if(state.mode === 'mock') startTimer(); else stopTimer();
}

function answer(pick, q){
  if(state.answered) return;
  state.answered = true;
  const ans = q.answer || [];
  const right = ans.includes(pick);
  if(right) state.correct++;
  document.querySelectorAll('.choice').forEach(b => {
    const i = parseInt(b.dataset.i,10);
    if(ans.includes(i)) b.classList.add('ok');
    else if(i === pick) b.classList.add('bad');
    b.onclick = null;
  });
  const fb = document.getElementById('fb');
  fb.className = 'feedback show ' + (right ? 'ok' : 'bad');
  fb.innerHTML = right
    ? `정답입니다. 정답 ${ans.map(a=>CIRC[a-1]).join('·')}`
    : `오답입니다. 정답은 ${ans.map(a=>CIRC[a-1]).join('·')}${ans.length===4?' (전 항목 정답 처리 문항)':''}`;
  if(!right){ const w = S.wrong; w[q.id] = { id:q.id, at:Date.now() }; S.wrong = w; state.miss.push(q); }
  document.getElementById('nextRow').style.display = 'flex';
  document.getElementById('next').onclick = next;
  document.getElementById('next').textContent = state.idx + 1 >= state.items.length ? '결과 보기' : '다음 문제';
  setTimeout(function(){ const nr = document.getElementById('nextRow'); if(nr && nr.scrollIntoView) nr.scrollIntoView({ block: 'center' }); }, 40);
}

function next(){
  state.idx++;
  if(state.idx >= state.items.length) return finish();
  renderQ();
}

function finish(){
  stopTimer();
  document.body.classList.remove('quiz-mode');
  const total = state.items.length, c = state.correct;
  const subjects = Array.from(new Set(state.items.map(q => q.subject)));
  const log = S.log.slice();
  log.push({ level: state.lv || S.level, subject: subjects.length === 1 ? subjects[0] : (state.mode === 'mock' ? '모의고사' : '혼합'), total: total, correct: c, at: Date.now(), mode: state.mode });
  lsSet(LS.log, log.slice(-200));

  if(state.mode === 'free5'){
    const res = buildFreeResult(state.lv || S.level, state.items, c, state.miss.map(q => q.id));
    res.subject = subjects.length === 1 ? subjects[0] : '전 과목';
    lsSet(LS.free, res);
    track('free_complete', { level: res.lv, subject: res.subject, correct: c, total: total, pct: pctOf(c,total), n: total });
    renderFreeResult(res, true);
    return;
  }

  const pct = pctOf(c, total);
  const spent = state.mockStart ? Math.round((Date.now() - state.mockStart) / 1000) : 0;
  const timeLine = state.mode === 'mock' && spent ? ` · 경과 ${Math.floor(spent/60)}분 ${spent%60}초` : '';
  app().innerHTML = `
    <div class="card" style="text-align:center">
      <p class="muted">${esc(state.label)} 결과</p>
      <div class="big">${c} / ${total}</div>
      <p class="muted">정답률 ${pct}%${timeLine} · 오답 ${total-c}문항이 오답노트에 저장됐습니다</p>
      <div class="row">
        <button class="btn" id="again">다시 풀기</button>
        <button class="btn ghost" id="home2">홈으로</button>
      </div>
    </div>
    <div class="card">
      <b style="font-size:14px">틀린 문항 ${state.miss.length}개</b>
      ${state.miss.length ? state.miss.map(q=>`<p class="muted" style="margin:8px 0 0">${esc(q.subject)} ${q.qno}번 · 정답 ${(q.answer||[]).map(a=>CIRC[a-1]).join('·')}</p>`).join('') : '<p class="muted" style="margin:8px 0 0">틀린 문항이 없습니다.</p>'}
    </div>`;
  document.getElementById('again').onclick = () => start(state.items, state.label, state.mode, { subject: state.subject });
  document.getElementById('home2').onclick = () => { state.view='home'; home(); };
}

/* ---------- 무료 5문항 결과 ---------- */
function buildFreeResult(lv, items, correct, missIds){
  const map = {};
  items.forEach(q => { map[q.subject] = map[q.subject] || { subject: q.subject, total: 0, correct: 0, miss: [] }; map[q.subject].total++; });
  items.forEach(q => {
    if(!missIds.includes(q.id)) map[q.subject].correct++;
    else map[q.subject].miss.push(q.id);
  });
  const subs = Object.keys(map).map(k => {
    const s = map[k];
    return { subject: s.subject, total: s.total, correct: s.correct, miss: s.miss, pct: pctOf(s.correct, s.total) };
  }).sort((a,b) => a.pct - b.pct || b.miss.length - a.miss.length || a.subject.localeCompare(b.subject));
  return { at: Date.now(), lv: lv, total: items.length, correct: correct, missIds: missIds.slice(), subs: subs };
}
function weakOf(res){ return res.subs.filter(s => s.pct < 100); }
function missQuestions(res){ return (res.missIds || []).map(id => QB.find(q => q.id === id)).filter(Boolean); }

function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(t).then(() => true).catch(() => legacyCopy(t)); } }catch(e){}
  return Promise.resolve(legacyCopy(t));
}
function legacyCopy(t){
  try{
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy'); document.body.removeChild(ta); return !!ok;
  }catch(e){ return false; }
}
function bindShare(res){
  const text = shareText(res), url = shareUrl();
  document.querySelectorAll('[data-share]').forEach(b => b.onclick = async () => {
    const kind = b.dataset.share;
    if(kind === 'threads'){
      track('share_click', { type: 'threads', pct: pctOf(res.correct, res.total) });
      const ok = await copyText(text + '\n\n' + url);
      window.open('https://www.threads.net/intent/post?text=' + encodeURIComponent(text + '\n\n' + url), '_blank');
      toast(ok ? '공유 문구를 복사했습니다. 스레드에 붙여넣으세요.' : '스레드 공유 창을 열었습니다.');
      return;
    }
    if(kind === 'copy'){
      const ok = await copyText(text + '\n\n' + url);
      track('share_copy', { ok: ok, pct: pctOf(res.correct, res.total) });
      toast(ok ? '문구와 링크를 복사했습니다.' : '복사에 실패했습니다. 길게 눌러 직접 복사해 주세요.');
      return;
    }
    track('share_click', { type: 'native' });
    if(navigator.share){
      try{
        await navigator.share({ title: '스포츠지도사 기출 무료 5문항', text: text, url: url });
        track('share_done', { type: 'native' });
      }catch(e){
        const ok = await copyText(text + '\n\n' + url);
        track('share_copy', { ok: ok, fallback: 'native_cancel' });
        toast(ok ? '공유가 취소되어 문구와 링크를 복사했습니다.' : '공유가 취소되었습니다.');
      }
    }else{
      const ok = await copyText(text + '\n\n' + url);
      track('share_copy', { ok: ok, fallback: 'no_native' });
      toast(ok ? '이 브라우저는 앱 공유를 지원하지 않아 문구를 복사했습니다.' : '복사에 실패했습니다.');
    }
  });
}

function rateOf(lv, subj){
  const log = S.log.filter(x => x.level === lv && x.subject === subj);

  return pctOf(c, t) + '%';
}

/* ---------- 탭 ---------- */
document.querySelectorAll('footer button').forEach(b => b.onclick = () => {
  document.querySelectorAll('footer button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  const t = b.dataset.tab;
  if(t==='home'){ state.view='home'; state.mode='practice'; home(); }
  if(t==='wrong'){ showWrong(); }
  if(t==='stats'){ stats(); }
  if(t==='pass'){ pass(); }
});
document.getElementById('back').onclick = () => { state.view='home'; state.mode='practice'; home(); };

/* ---------- 시작 ---------- */
track('app_visit', { ref: document.referrer ? String(document.referrer).slice(0,160) : '', path: location.pathname });
home();
</script>
</body>
</html>
