function lsGet(k, d){ try{ var v = localStorage.getItem(k); if(v == null) return d; var p = JSON.parse(v); return p == null ? d : p; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

var S = {
  get wrong(){ var v = lsGet(LS.wrong, {}); return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; },
  set wrong(v){ lsSet(LS.wrong, v); },
  get passes(){ var v = lsGet(LS.pass, []); return Array.isArray(v) ? v : []; },
  get log(){ var v = lsGet(LS.log, []); return Array.isArray(v) ? v : []; },
  get level(){ return lsGet(LS.level, null) === '1급' ? '1급' : '2급'; },
  set level(v){ lsSet(LS.level, v === '1급' ? '1급' : '2급'); },
  get year(){ var v = lsGet(LS.year, null); return (v === 'all' || v == null) ? null : (YEARS.indexOf(Number(v)) >= 0 ? Number(v) : null); },
  set year(v){ lsSet(LS.year, v == null ? 'all' : Number(v)); }

/* ---------- 그림 확대(라이트박스) ---------- */
function openLb(src, alt){
  var lb = document.getElementById('lb');
  if(!lb){
    lb = document.createElement('div');
    lb.id = 'lb'; lb.className = 'lb';
    lb.innerHTML = '<div class="lbbar"><b></b><button type="button" data-z="in">확대</button><button type="button" data-cl>닫기 ✕</button></div>'
                 + '<img alt=""><div class="lbtip">두 손가락으로 확대 · 끌어서 이동 · 두 번 탭하면 전체 보기</div>';
    document.body.appendChild(lb);
    bindLb(lb);
  }
  lb.querySelector('img').src = src;
  lb.querySelector('img').alt = alt || '문제 자료';
  lb.querySelector('.lbbar b').textContent = '문제 자료';
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
  lbReset(lb);
  track('img_zoom', {});
}
var LB = { s:1, x:0, y:0, base:1, init:1 };
function lbApply(lb){
  var im = lb.querySelector('img');
  im.style.transform = 'translate(-50%,-50%) translate(' + LB.x + 'px,' + LB.y + 'px) scale(' + LB.s + ')';
}
function lbReset(lb){
  var im = lb.querySelector('img');
  if(!im.naturalWidth){ LB.s = 1; lbApply(lb); return; }
  var vw = window.innerWidth, vh = window.innerHeight;
  var fitW = vw / im.naturalWidth, fitH = (vh - 80) / im.naturalHeight;
  LB.base = Math.min(fitW, 1);
  LB.init = Math.min(Math.max(fitW * 2, fitH), Math.min(fitW * 3, 1));
  LB.s = LB.init; LB.x = 0; LB.y = 20;
  lbApply(lb);
}
function closeLb(){
  var lb = document.getElementById('lb');
  if(!lb) return;
  lb.classList.remove('on');
  document.body.style.overflow = '';
}
function bindLb(lb){
  var im = lb.querySelector('img');
  lb.addEventListener('click', function(e){
    if(e.target === lb || e.target.hasAttribute('data-cl')) closeLb();
    if(e.target.dataset && e.target.dataset.z === 'in'){ LB.s = Math.min(LB.s * 1.5, LB.base * 5); lbApply(lb); }
  });
  im.addEventListener('load', function(){ if(lb.classList.contains('on')) lbReset(lb); });
  var pinch = null, drag = null, lastTap = 0;
  im.addEventListener('pointerdown', function(e){
    if(im.setPointerCapture) im.setPointerCapture(e.pointerId);
    drag = { x:e.clientX, y:e.clientY, lx:LB.x, ly:LB.y };
  });
  im.addEventListener('pointermove', function(e){
    if(!drag || pinch) return;
    LB.x = drag.lx + (e.clientX - drag.x);
    LB.y = drag.ly + (e.clientY - drag.y);
    lbApply(lb);
  });
  im.addEventListener('pointerup', function(e){
    if(drag && Math.abs(e.clientX-drag.x) < 6 && Math.abs(e.clientY-drag.y) < 6){
      var now = Date.now();
      if(now - lastTap < 300){ LB.s = (Math.abs(LB.s - LB.init) < 0.01) ? LB.base : LB.init; LB.x = 0; LB.y = 20; lbApply(lb); }
      lastTap = now;
    }
    drag = null;
  });
  lb.addEventListener('touchstart', function(e){
    if(e.touches.length === 2){
      pinch = { d: Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY), s: LB.s };
    }
  }, { passive:true });
  lb.addEventListener('touchmove', function(e){
    if(e.touches.length === 2 && pinch){
      e.preventDefault();
      var d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      LB.s = Math.max(LB.base * 0.9, Math.min(pinch.s * (d / pinch.d), LB.base * 5));
      lbApply(lb);
    }
  }, { passive:false });
  lb.addEventListener('touchend', function(e){ if(e.touches.length < 2) pinch = null; });
  lb.addEventListener('wheel', function(e){
    if(!lb.classList.contains('on')) return;
    e.preventDefault();
    LB.s = Math.max(LB.base * 0.9, Math.min(LB.s * (e.deltaY < 0 ? 1.12 : 0.89), LB.base * 5));
    lbApply(lb);
  }, { passive:false });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeLb(); });
}

/* ---------- 유입(UTM) ---------- */
var UTM = (function(){
  var keys = ['source','medium','campaign','content','term'];
  var cur = {}, p = null;
  try{ p = new URLSearchParams(location.search); }catch(e){}
  if(p) keys.forEach(function(k){ var v = p.get('utm_' + k); if(v) cur[k] = String(v).slice(0,40); });
  var prev = lsGet(LS.utm, null) || {};
  if(Object.keys(cur).length){
    var rec = {};
    Object.keys(prev).forEach(function(k){ rec[k] = prev[k]; });
    Object.keys(cur).forEach(function(k){ rec[k] = cur[k]; });
    rec.first_at = prev.first_at || Date.now(); rec.last_at = Date.now(); rec.hits = (prev.hits || 0) + 1;
    rec.landing = String(location.href).split('#')[0].slice(0,300);
    lsSet(LS.utm, rec);
    return rec;
  }
  return prev;
})();
function track(name, extra){
  try{
    var ev = lsGet(LS.ev, []);
    var list = Array.isArray(ev) ? ev : [];
    var rec = { name:name, at:Date.now(), src:UTM.source || '', level:S.level, view:(state && state.mode) || '' };
    if(extra) Object.keys(extra).forEach(function(k){ rec[k] = extra[k]; });
    list.push(rec);
    lsSet(LS.ev, list.slice(-500));
  }catch(e){}
}

function cut(s, n){ s = String(s).replace(/\s+/g,' ').trim(); return s.length > n ? s.slice(0, n) + '…' : s; }
function nfmt(n){ return Number(n).toLocaleString('en-US'); }
function byLevel(lv, y){ return QB.filter(function(q){ return q.level === lv && (!y || q.year === y); }); }
function bySubject(lv, subj, y){
  var yy = (y === undefined) ? S.year : y;
  return byLevel(lv, yy).filter(function(q){ return q.subject === subj; }).sort(function(a,b){ return (b.year - a.year) || (a.qno - b.qno); });
}

function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function levelSubjects(lv){ return SUBJ_ORDER.filter(function(s){ return bySubject(lv, s).length; }); }

/* ---------- 문항 분석 메타(개념 영역·개념어·문항 유형) ---------- */
function areaOf(q){
  var s = KB.subj[q.subject];
  if(!s || !s.areas) return null;
  var stem = q.stem || '', ch = (q.choices || []).join(' ');
  var best = null, bestScore = 0;
  for(var i=0;i<s.areas.length;i++){
    var a = s.areas[i], sc = 0;
    for(var j=0;j<a.kw.length;j++){
      var k = a.kw[j];
      if(stem.indexOf(k) >= 0) sc += 3;
      else if(ch.indexOf(k) >= 0) sc += 1;
    }
    if(sc > bestScore){ bestScore = sc; best = a.n; }
  }
  return bestScore > 0 ? best : null;
}
function termsOf(q){
  var s = KB.subj[q.subject];
  if(!s || !s.terms) return [];
  var stem = q.stem || '';
  var ans = '';
  (q.answer || []).forEach(function(i){ ans += (q.choices[i-1] || '') + ' '; });
  var allc = (q.choices || []).join(' ');
  var out = [];
  for(var i=0;i<s.terms.length;i++){
    var t = s.terms[i], where = '';
    if(stem.indexOf(t.t) >= 0) where = '문항';
    else if(ans.indexOf(t.t) >= 0) where = '정답 보기';
    else if(allc.indexOf(t.t) >= 0) where = '보기';
    if(where) out.push({ t:t.t, n:t.n, a:t.a, where:where });
    if(out.length >= 3) break;
  }
  return out;
}
function trapsOf(q){
  var text = (q.stem || '') + ' ' + (q.choices || []).join(' ');
  var out = [];
  if(q.imgonly) out.push('fig');
  for(var i=0;i<KB.traps.length;i++){
    var t = KB.traps[i];
    try{ if(new RegExp(t.re).test(text)) out.push(t.id); }catch(e){}
  }
  return out;
}
function buildMeta(){
  QID = {}; QMETA = {};
  for(var i=0;i<QB.length;i++){
    var q = QB[i];
    QID[q.id] = q;
    QMETA[q.id] = { area:q.imgonly ? null : areaOf(q), terms:q.imgonly ? [] : termsOf(q), traps:trapsOf(q) };
  }
}
function trapDef(id){
  for(var i=0;i<KB.traps.length;i++) if(KB.traps[i].id === id) return KB.traps[i];
  return null;
}
function areaTerms(subj, area){
  var s = KB.subj[subj];
  if(!s || !s.terms) return [];
  var out = [];
  for(var i=0;i<s.terms.length;i++) if(s.terms[i].a === area) out.push(s.terms[i]);
  return out.slice(0, 3);
}

/* ---------- 풀이 기록 ---------- */
function answersRaw(){
  var a = lsGet(LS.ans, null);
  if(!a || typeof a !== 'object' || Array.isArray(a)) a = {};
  var w = S.wrong, changed = false;
  for(var id in w){
    if(!a[id]){ a[id] = { n:1, w:1, at:w[id].at || Date.now(), legacy:1 }; changed = true; }
  }
  if(changed) lsSet(LS.ans, a);
  return a;
}
function recordAns(q, right, pick){
  var a = answersRaw();
  var r = a[q.id] || { n:0, w:0 };
  r.n = (r.n || 0) + 1;
  if(!right){ r.w = (r.w || 0) + 1; r.wpick = pick; r.lastWrong = Date.now(); }
  r.pick = pick; r.at = Date.now();
  a[q.id] = r;
  lsSet(LS.ans, a);
  if(!right){
    var w = S.wrong;
    w[q.id] = { id:q.id, at:Date.now(), n:((w[q.id] && w[q.id].n) || 0) + 1 };
    S.wrong = w;
  }
}
function wrongItems(){
  var w = S.wrong;
  return QB.filter(function(q){ return w[q.id]; }).sort(function(a,b){ return (w[b.id].at||0) - (w[a.id].at||0); });
}

/* ---------- 분석 ---------- */
function answeredRecords(){
  var a = answersRaw(), out = [];
  for(var id in a){
    var q = QID[id];
    if(!q) continue;
    var r = a[id];
    out.push({ q:q, n:Math.max(1, r.n|0), w:Math.max(0, r.w|0), pick:r.pick|0, wpick:r.wpick|0, at:r.at||0, lastWrong:r.lastWrong||0 });
  }
  return out;
}
function analyzeAll(){
  var recs = answeredRecords();
  var A = { recs:recs, nAnswered:0, nCorrect:0, nWrongRecs:0, subjects:[], areas:[], traps:[], misses:[], recurring:0, acc:0, trapTop:null, unknownArea:0, areaKnown:0 };
  var subMap = {}, areaMap = {}, trapMap = {};
  recs.forEach(function(r){
    A.nAnswered += r.n; A.nCorrect += (r.n - r.w); A.nWrongRecs += r.w;
    var m = QMETA[r.q.id] || { area:null, terms:[], traps:[] };
    var s = subMap[r.q.subject]; if(!s){ s = subMap[r.q.subject] = { subject:r.q.subject, n:0, w:0 }; }
    s.n += r.n; s.w += r.w;
    if(m.area){
      var k = r.q.subject + '||' + m.area;
      var a = areaMap[k]; if(!a){ a = areaMap[k] = { subject:r.q.subject, area:m.area, n:0, w:0 }; }
      a.n += r.n; a.w += r.w; A.areaKnown++;
    } else if(r.w > 0) A.unknownArea++;
    (m.traps || []).forEach(function(tid){
      var t = trapMap[tid]; if(!t){ t = trapMap[tid] = { id:tid, n:0, w:0 }; }
      t.n += r.n; t.w += r.w;
    });
    if(r.w > 0){ A.misses.push(r); if(r.w >= 2) A.recurring++; }
  });
  A.acc = A.nAnswered ? Math.round(A.nCorrect / A.nAnswered * 100) : 0;
  A.subjects = Object.keys(subMap).map(function(k){
    var s = subMap[k]; s.acc = s.n ? Math.round((s.n - s.w) / s.n * 100) : 0; return s;
  }).sort(function(a,b){ return (b.w - a.w) || (a.acc - b.acc) || (b.n - a.n); });
  A.areas = Object.keys(areaMap).map(function(k){
    var a = areaMap[k]; a.acc = a.n ? Math.round((a.n - a.w) / a.n * 100) : 0; return a;
  }).sort(function(a,b){ return (b.w - a.w) || (a.acc - b.acc) || (b.n - a.n); });
  A.traps = Object.keys(trapMap).map(function(k){
    var t = trapMap[k], d = trapDef(k) || { name:k, tip:'' };
    return { id:k, name:d.name, tip:d.tip, n:t.n, w:t.w, acc:t.n ? Math.round((t.n - t.w) / t.n * 100) : 0 };
  }).sort(function(a,b){
    var fa = a.id === 'fig' ? 1 : 0, fb = b.id === 'fig' ? 1 : 0;
    return (fa - fb) || (a.acc - b.acc) || (b.w - a.w);
  });
  A.misses.sort(function(a,b){ return (b.w - a.w) || (b.lastWrong - a.lastWrong) || (b.at - a.at); });
  var cand = A.traps.filter(function(t){ return t.n >= 2 && t.w > 0 && t.id !== 'fig'; });
  A.trapTop = cand.length ? cand[0] : null;
  return A;
}
function verdict(A){
  if(!A.nAnswered) return '';
  var parts = ['지금까지 ' + nfmt(A.nAnswered) + '문항을 풀어 정답률 ' + A.acc + '%입니다.'];
  var s0 = A.subjects[0];
  if(s0 && s0.w > 0) parts.push(s0.subject + '에서 ' + s0.w + '문항을 틀려 가장 약합니다(정답률 ' + s0.acc + '%).');
  if(A.recurring > 0) parts.push('두 번 이상 틀린 반복 오답이 ' + A.recurring + '개 있습니다.');
  if(A.trapTop) parts.push(A.trapTop.name + ' 유형 정답률이 ' + A.trapTop.acc + '%로 가장 낮습니다.');
  if(!A.misses.length) parts.push('아직 오답이 없습니다. 이 상태를 유지하려면 새 문항을 계속 풀어 보세요.');
  parts.push(A.acc >= 60
    ? '합격 기준(과목별 40% 이상·5과목 평균 60% 이상)을 넘고 있으니, 약한 과목을 40% 아래로 떨어뜨리지 않는 쪽이 중요합니다.'
    : '합격 기준은 과목별 40% 이상·5과목 평균 60% 이상입니다. 아래 취약 순서대로 채우면 평균이 먼저 올라갑니다.');
  return parts.join(' ');
}
function areaItems(subj, area, limit){
  var a = answersRaw();
  var same = QB.filter(function(q){ return q.subject === subj && QMETA[q.id] && QMETA[q.id].area === area; });
  var wrong = same.filter(function(q){ return a[q.id] && a[q.id].w > 0; }).sort(function(x,y){ return (a[y.id].w||0) - (a[x.id].w||0); });
  var rest = shuffle(same.filter(function(q){ return !(a[q.id] && a[q.id].w > 0); }));
  return wrong.concat(rest).slice(0, limit);
}
function trapItems(tid, limit){
  return shuffle(QB.filter(function(q){ return QMETA[q.id] && QMETA[q.id].traps.indexOf(tid) >= 0; })).slice(0, limit);
}
function routineBlocks(A){
  var blocks = [];
  var ar = A.areas.slice(0, 3);
  if(ar[0]){
    blocks.push({ when:'오늘 · 30분', what:ar[0].subject + ' · ' + ar[0].area, why:'1순위 취약 영역 · 오답 ' + ar[0].w + '문항 · 정답률 ' + ar[0].acc + '%',
      items:areaItems(ar[0].subject, ar[0].area, 12), label:ar[0].area + ' 집중 복습' });
  } else {
    var s0 = A.subjects[0];
    if(s0){
      var ws = A.misses.filter(function(r){ return r.q.subject === s0.subject; }).map(function(r){ return r.q; });
      if(ws.length) blocks.push({ when:'오늘 · 30분', what:s0.subject + ' 오답 정리', why:'오답 ' + s0.w + '문항 · 정답률 ' + s0.acc + '%',
        items:ws.slice(0, 12), label:s0.subject + ' 오답 다시 풀기' });
    }
  }
  if(ar[1]){
    var items = areaItems(ar[1].subject, ar[1].area, 8);
    if(ar[2]) items = items.concat(areaItems(ar[2].subject, ar[2].area, 8));
    blocks.push({ when:'내일 · 25분', what:ar[1].area + (ar[2] ? ' + ' + ar[2].area : ''), why:'2·3순위 취약 영역 교차 복습',
      items:shuffle(items), label:'2·3순위 영역 복습' });
  }
  var rec = A.misses.filter(function(r){ return r.w >= 2; }).slice(0, 20).map(function(r){ return r.q; });
  if(rec.length){
    blocks.push({ when:'이틀 뒤 · 20분', what:'반복 오답 ' + rec.length + '문항', why:'두 번 이상 틀린 문항은 개념이 비어 있을 가능성이 큽니다',
      items:rec, label:'반복 오답 다시 풀기' });
  }
  var all = A.misses.slice(0, 20).map(function(r){ return r.q; });
  if(all.length){
    blocks.push({ when:'전날·당일 · 15분', what:'오답 ' + all.length + '문항 훑기', why:'시험 직전 최종 점검',
      items:all, label:'오답 최종 점검' });
  }
  return blocks;
}

/* ---------- 풀이 ---------- */
function start(items, label, mode, opts){
  if(!items || !items.length){ toast('문항을 준비하지 못했습니다.'); return; }
  opts = opts || {};
  stopTimer();
  state.items = items; state.idx = 0; state.correct = 0; state.miss = [];
  state.view = 'quiz'; state.answered = false;
  state.label = label; state.mode = mode || 'practice';
  state.subject = opts.subject || (items.every(function(q){ return q.subject === items[0].subject; }) ? items[0].subject : '');
  state.lv = items[0].level;
  state.mockStart = state.mode === 'mock' ? Date.now() : 0;
  document.getElementById('back').hidden = false;
  renderQ();
}
function renderQ(){
  var q = state.items[state.idx];
  state.answered = false;
  document.body.classList.add('quiz-mode');
  document.getElementById('title').textContent = state.label;
  var pct = Math.round(state.idx / state.items.length * 100);
  var timer = state.mode === 'mock' ? ' · <b id="mtimer" style="font-variant-numeric:tabular-nums">00:00</b>' : '';
  app().innerHTML =
    '<div class="qmeta"><span>' + esc(q.subject) + ' · ' + q.year + '년 ' + esc(q.level) + '</span><span>' + (state.idx+1) + ' / ' + state.items.length + timer + '</span></div>'
    + '<div class="pbar"><i style="width:' + pct + '%"></i></div>'
    + '<div class="card">'
    +   '<p class="stem">' + esc(q.stem || '') + '</p>'
    +   (q.img ? '<figure class="qfig"><img src="' + q.img + '" alt="문제 자료(그림·표)" loading="lazy" data-zoom="1"' + (q.imgonly ? ' style="cursor:zoom-in"' : '') + '><span class="zoomhint">탭하면 크게 볼 수 있습니다</span></figure>' : '')
    +   (q.imgonly ? '<p class="mini" style="margin:2px 0 8px">그림의 ①~④ 중에서 고르세요.</p>' : '')
    +   '<div class="choices ' + (q.imgonly ? 'imgonly' : '') + '" id="ch">'
    +     q.choices.map(function(c,i){
            return '<button class="choice" data-i="' + (i+1) + '"><i>' + CIRC[i] + '</i>' + (q.imgonly ? '' : '<span>' + esc(c) + '</span>') + '</button>';
          }).join('')
    +   '</div>'
    +   '<div class="feedback" id="fb"></div>'
    +   '<div class="row" id="nextRow" style="display:none"><button class="btn" id="next">다음 문제</button></div>'
    + '</div>';
  Array.prototype.forEach.call(document.querySelectorAll('.choice'), function(b){
    b.onclick = function(){ answer(parseInt(b.dataset.i,10), q); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('img[data-zoom]'), function(im){
    im.onclick = function(){ openLb(im.src, im.alt); };
  });
  if(state.mode === 'mock') startTimer(); else stopTimer();
}
function answer(pick, q){
  if(state.answered) return;
  state.answered = true;
  var ans = q.answer || [];
  var right = ans.indexOf(pick) >= 0;
  if(right) state.correct++;
  Array.prototype.forEach.call(document.querySelectorAll('.choice'), function(b){
    var i = parseInt(b.dataset.i,10);
    if(ans.indexOf(i) >= 0) b.classList.add('ok');
    else if(i === pick) b.classList.add('bad');
    b.onclick = null;
  });
  var fb = document.getElementById('fb');
  fb.className = 'feedback show ' + (right ? 'ok' : 'bad');
  fb.innerHTML = right
    ? '정답입니다. 정답 ' + ans.map(function(a){ return CIRC[a-1]; }).join('·')
    : '오답입니다. 정답은 ' + ans.map(function(a){ return CIRC[a-1]; }).join('·') + (ans.length === 4 ? ' (전 항목 정답 처리 문항)' : '');
  recordAns(q, right, pick);
  if(!right) state.miss.push(q);
  document.getElementById('nextRow').style.display = 'flex';
  var nx = document.getElementById('next');
  nx.onclick = next;
  nx.textContent = state.idx + 1 >= state.items.length ? '결과 보기' : '다음 문제';
  setTimeout(function(){ var nr = document.getElementById('nextRow'); if(nr && nr.scrollIntoView) nr.scrollIntoView({ block:'center' }); }, 40);
}
function next(){
  state.idx++;
  if(state.idx >= state.items.length) return finish();
  renderQ();
}
function finish(){
  stopTimer();
  document.body.classList.remove('quiz-mode');
  var total = state.items.length, c = state.correct;
  var subjects = [];
  state.items.forEach(function(q){ if(subjects.indexOf(q.subject) < 0) subjects.push(q.subject); });
  var log = S.log.slice();
  log.push({ level:state.lv || S.level, subject:subjects.length === 1 ? subjects[0] : (state.mode === 'mock' ? '모의고사' : '혼합'), total:total, correct:c, at:Date.now(), mode:state.mode });
  lsSet(LS.log, log.slice(-200));
  var pct = pctOf(c, total);
  var spent = state.mockStart ? Math.round((Date.now() - state.mockStart) / 1000) : 0;
  var timeLine = state.mode === 'mock' && spent ? ' · 경과 ' + Math.floor(spent/60) + '분 ' + (spent%60) + '초' : '';
  state.view = 'result';
  document.getElementById('title').textContent = '채점 결과';
  document.getElementById('back').hidden = false;
  app().innerHTML =
    '<div class="card" style="text-align:center">'
    + '<p class="muted">' + esc(state.label) + ' 결과</p>'
    + '<div class="big">' + c + ' / ' + total + '</div>'
    + '<p class="muted">정답률 ' + pct + '%' + timeLine + ' · 오답 ' + (total-c) + '문항이 오답노트에 저장됐습니다</p>'
    + '<div class="row"><button class="btn" id="again">다시 풀기</button><button class="btn ghost" id="home2">홈으로</button></div>'
    + '</div>'
    + '<div class="card"><b style="font-size:14px">틀린 문항 ' + state.miss.length + '개</b>'
    + (state.miss.length
        ? state.miss.map(function(q){ return '<p class="muted" style="margin:8px 0 0">' + esc(q.subject) + ' ' + q.qno + '번 · 정답 ' + (q.answer||[]).map(function(a){ return CIRC[a-1]; }).join('·') + '</p>'; }).join('')
        : '<p class="muted" style="margin:8px 0 0">틀린 문항이 없습니다.</p>')
    + '</div>'
    + (state.miss.length || Object.keys(S.wrong).length
        ? '<button class="btn" id="toAi" style="width:100%;margin-bottom:12px">AI 오답노트 핵심분석 보기</button>'
        : '')
    + '<div class="card"><b style="font-size:14px">결과 공유</b><p class="mini" style="margin:4px 0 0">정답률만 공유됩니다. 틀린 문항과 상세 기록은 공유 문구에 포함되지 않습니다.</p>'
    + shareBox() + '</div>';
  document.getElementById('again').onclick = function(){ start(state.items, state.label, state.mode, { subject:state.subject }); };
  document.getElementById('home2').onclick = function(){ state.view='home'; home(); };
  var ta = document.getElementById('toAi');
  if(ta) ta.onclick = function(){ aiScreen(); };
  bindShare(c, total);
  window.scrollTo(0,0);
}

var APP_URL = 'https://setoo28-hue.github.io/sports-exam-pass/';
function shareUrl(){ return APP_URL + '?utm_source=threads&utm_medium=share&utm_campaign=free_all'; }
function shareText(c, total){
  return '스포츠지도사 기출 ' + total + '문항 중 ' + c + '문항 정답 (' + pctOf(c, total) + '%).\n'
       + '2021~2025년 기출 1,600문항을 전부 무료로 풀 수 있습니다.\n\n무료 학습은 ALPHA 2027에서.';
}
function shareBox(){
  return '<div class="sharebox">'
    + '<button class="primary" data-share="threads">스레드로 공유</button>'
    + '<button data-share="copy">문구·링크 복사</button>'
    + '<button class="wide" data-share="native">다른 앱으로 공유 (모바일)</button>'
    + '</div>';
}
function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(t).then(function(){ return true; }).catch(function(){ return legacyCopy(t); }); } }catch(e){}
  return Promise.resolve(legacyCopy(t));
}
function legacyCopy(t){
  try{
    var ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
    var ok = document.execCommand('copy'); document.body.removeChild(ta); return !!ok;
  }catch(e){ return false; }
}
function bindShare(c, total){
  var text = shareText(c, total), url = shareUrl();
  Array.prototype.forEach.call(document.querySelectorAll('[data-share]'), function(b){
    b.onclick = function(){
      var kind = b.dataset.share;
      if(kind === 'threads'){
        track('share_click', { type:'threads', pct:pctOf(c,total) });
        copyText(text + '\n\n' + url);
        window.open('https://www.threads.net/intent/post?text=' + encodeURIComponent(text + '\n\n' + url), '_blank');
        toast('공유 문구를 복사했습니다. 스레드에 붙여넣으세요.');
        return;
      }
      if(kind === 'copy'){
        copyText(text + '\n\n' + url).then(function(ok){
          track('share_copy', { ok:ok, pct:pctOf(c,total) });
          toast(ok ? '문구와 링크를 복사했습니다.' : '복사에 실패했습니다. 길게 눌러 직접 복사해 주세요.');
        });
        return;
      }
      track('share_click', { type:'native' });
      if(navigator.share){
        navigator.share({ title:'스포츠지도사 기출 1,600문항 무료', text:text, url:url }).then(function(){
          track('share_done', { type:'native' });
        }).catch(function(){
          copyText(text + '\n\n' + url).then(function(ok){
            track('share_copy', { ok:ok, fallback:'native_cancel' });
            toast(ok ? '공유가 취소되어 문구와 링크를 복사했습니다.' : '공유가 취소되었습니다.');
          });
        });
      } else {
        copyText(text + '\n\n' + url).then(function(ok){
          track('share_copy', { ok:ok, fallback:'no_native' });
          toast(ok ? '이 브라우저는 앱 공유를 지원하지 않아 문구를 복사했습니다.' : '복사에 실패했습니다.');
        });
      }
    };
  });
}

function aiSubjectRank(A, limit){
  var list = A.subjects.filter(function(s){ return s.n > 0; }).slice(0, limit);
  if(!list.length) return '';
  var html = '<div class="sec"><h3>취약 과목 랭킹</h3><p class="desc">오답이 많은 순서입니다. 정답률은 그 과목에서 내가 푼 문항 기준입니다.</p>';
  list.forEach(function(s, i){
    var cls = s.acc >= 80 ? '' : (s.acc >= 50 ? 'warn' : 'bad');
    html += '<div class="rk"><div class="no">' + (i+1) + '</div>'
      + '<div class="nm">' + esc(s.subject) + '<span>푼 문항 ' + nfmt(s.n) + ' · 오답 ' + nfmt(s.w) + '</span>'
      + '<div class="bars"><i class="' + cls + '" style="width:' + Math.max(3, s.acc) + '%"></i></div></div>'
      + '<div class="val">' + s.acc + '%<em>정답률</em></div></div>';
  });
  html += '</div>';
  return html;
}
function aiAreaRank(A, limit){
  var list = A.areas.filter(function(a){ return a.w > 0; }).slice(0, limit);
  if(!list.length) return '';

function missCard(r, showAll){
  var q = r.q, m = QMETA[q.id] || { area:null, terms:[], traps:[] };
  var ans = (q.answer || []).map(function(a){ return CIRC[a-1]; }).join('·');
  var mine = r.wpick ? CIRC[r.wpick-1] : '미기록';
  var term = (m.terms && m.terms[0]) || null;
  var tags = '';
  if(m.area) tags += '<span class="tagm area">' + esc(m.area) + '</span>';
  (m.traps || []).slice(0,2).forEach(function(tid){
    var d = trapDef(tid); if(d) tags += '<span class="tagm">' + esc(d.name) + '</span>';
  });
  var cpt = '';
  if(term){
    cpt = '<div class="cpt"><b>핵심 개념 · ' + esc(term.t) + '</b><br>' + esc(term.n) + '</div>';
  } else {
    var ts = m.area ? areaTerms(q.subject, m.area) : [];
    var label = '이 영역에서 같이 볼 개념';
    if(!ts.length){
      var sb = KB.subj[q.subject];
      ts = (sb && sb.terms ? sb.terms : []).slice(0, 2);
      label = '이 과목 핵심 개념';
    }
    if(ts.length){
      cpt = '<div class="cpt"><b>' + label + '</b><br>' + ts.slice(0,2).map(function(t){ return esc(t.t) + ' — ' + esc(t.n); }).join('<br>')
          + (q.imgonly ? '<br><span style="color:#6b7280">그림 문항이라 문제 이미지를 다시 보며 개념어를 확인하세요.</span>' : '') + '</div>';
    } else {
      cpt = '<div class="cpt"><b>개념 정리</b><br>' + (q.imgonly ? '그림 문항이라 문제 이미지를 다시 보며 개념어를 확인하는 것이 가장 빠릅니다.' : '문항에 등장한 용어를 교재 목차에서 찾아 한 줄로 정리해 두세요.') + '</div>';
    }
  }
  var stemLine = q.imgonly
    ? '<img class="thumb" src="' + q.img + '" alt="문제 자료" data-zoom="1">'
    : '<p class="q">' + esc(cut(q.stem || '', 80)) + '</p>';
  return '<div class="mcard">'
    + '<div class="top">' + esc(q.subject) + ' ' + q.qno + '번 <span>' + q.year + '년 ' + esc(q.level) + (r.w >= 2 ? ' · ' + r.w + '회 오답' : '') + '</span></div>'
    + '<div class="tags">' + tags + '</div>'
    + stemLine
    + '<p class="ans">내 답 <b>' + mine + '</b> · 정답 <b>' + ans + '</b></p>'
    + cpt
    + '<div class="acts"><button data-retry="' + q.id + '">이 문항 다시 풀기</button>'
    + (m.area ? '<button data-block="s|' + esc(q.subject) + '|' + esc(m.area) + '">같은 영역 문제</button>' : '')
    + '</div>'
    + '</div>';
}
function aiMissCards(A, limit, note){

    return '<div class="sec"><h3>틀린 문항별 핵심 개념</h3><p class="desc">아직 틀린 문항이 없습니다. 문제를 풀면 여기에 문항별 개념과 암기 포인트가 쌓입니다.</p></div>';

function aiRoutine(A){

    html += '<div class="tipbox"><b>당일 체크리스트</b><br>' + top.map(function(t){ return '· ' + esc(t.name) + ': ' + esc(t.tip); }).join('<br>') + '</div>';

  var bySub = {};

  });
  app().innerHTML =
    '<div class="card"><div class="big">' + A.acc + '%</div><p class="muted">푼 문항 ' + nfmt(A.nAnswered) + ' · 오답 ' + A.misses.length + '개 저장</p></div>'
    + (Object.keys(bySub).length
        ? '<div class="card"><b style="font-size:14px">과목별 정답률</b>' + Object.keys(bySub).map(function(s){
            var p = Math.round(bySub[s].c / bySub[s].t * 100);

        : '')
    + (recent.length
        ? recent.map(function(x){

          + '<p class="mini" style="margin:8px 0 0"><a href="#" id="release" style="text-decoration:underline">이 기기에서 이용권 해제</a></p></div>' : '')
    + (paid ? '' : offerCard('AI 오답노트 핵심분석 이용권', '문항은 전부 무료입니다. 이용권은 ' + '내 오답을 개념 영역·문항 유형으로 나눈 전체 분석과 복습 루틴을 여는 데 씁니다.'))
    + '<div class="card"><b style="font-size:14px">무료로 되는 것</b><p class="muted" style="margin:6px 0 0;line-height:1.6">5개년 ' + nfmt(TOTAL_Q) + '문항(2급·1급 전 과목) 풀이·즉시 채점, 과목별 학습, 랜덤 20문항, 5개년 실전 모의고사, 오답 다시 풀기, 학습 통계까지 모두 무료입니다.</p></div>'
    + '<div class="card"><b style="font-size:14px">안내</b><p class="muted" style="margin:6px 0 0;line-height:1.6">문항은 2021~2025년 국민체육진흥공단 공개 문제지 기반이며, 정답은 공단 최종 정답표를 따릅니다. 공단 자료에 해설이 없어, 앱은 과목별 개념 영역·개념어 사전으로 핵심 개념을 정리해 보여 줍니다.</p></div>'
    + '<p style="text-align:center;margin:18px 0 8px"><a href="#" id="mt" class="mini" style="text-decoration:underline">전환 지표 보기 (관리자)</a></p>';
  bindOffer(aiScreen);
  var rl = document.getElementById('release');
  if(rl) rl.onclick = function(e){
    e.preventDefault();
    if(confirm('이 기기에서 이용권을 해제할까요? 다시 쓰려면 코드를 입력해야 합니다.')){
      lsSet(LS.pass, []); track('pass_release', {}); pass();
    }
  };
  document.getElementById('mt').onclick = function(e){ e.preventDefault(); metrics(); };
}

/* ---------- 전환 지표 ---------- */
function metrics(){
  var ev = lsGet(LS.ev, []), list = Array.isArray(ev) ? ev : [];
  var cnt = function(n){ return list.filter(function(e){ return e.name === n; }).length; };
  var rate = function(a,b){ return b ? Math.min(100, Math.round(a/b*100)) + '%' : '-'; };
  var row = function(label, v){ return '<div class="mev"><span>' + label + '</span><b>' + v + '</b></div>'; };
  var utmSrc = {};
  list.forEach(function(e){ if(e.src) utmSrc[e.src] = (utmSrc[e.src] || 0) + 1; });
  var sheet = document.createElement('div');
  sheet.className = 'modal';
  sheet.innerHTML = '<div class="sheet">'
    + '<h3>전환 지표 (이 브라우저 기록)</h3>'
    + '<p>이 기기의 localStorage에 쌓인 이벤트입니다. 방문자 전체 통계는 서버 저장소가 필요합니다.</p>'
    + row('앱 방문', cnt('app_visit'))
    + row('과목 학습 시작', cnt('subject_start'))
    + row('모의고사 시작', cnt('mock_start'))
    + row('오답노트 열기', cnt('ai_note_open'))
    + row('결제 시도(클릭)', cnt('checkout_click'))
    + row('결제 클릭률', rate(cnt('checkout_click'), cnt('ai_note_open')))
    + row('공유 클릭/복사', cnt('share_click') + cnt('share_copy'))
    + row('이용권 코드 등록', cnt('pass_redeem'))
    + '<p class="mini" style="margin-top:12px">비율은 기기 안 이벤트 횟수 기준입니다.</p>'
    + '<p class="mini">유입 경로(utm_source): ' + (Object.keys(utmSrc).length ? Object.keys(utmSrc).map(function(k){ return esc(k) + ' ' + utmSrc[k]; }).join(' · ') : '기록 없음') + '</p>'
    + '<p class="mini">최근 이벤트: ' + (list.slice(-6).reverse().map(function(e){ return esc(e.name); }).join(' ← ') || '없음') + '</p>'
    + '<p class="mini">결제 성공·실패는 래피드(외부 결제)에서 처리되어 앱에서는 확인할 수 없습니다.</p>'
    + '<div class="rowx"><button id="mClose">닫기</button></div></div>';
  document.body.appendChild(sheet);
  sheet.addEventListener('click', function(e){ if(e.target === sheet) sheet.remove(); });
  sheet.querySelector('#mClose').onclick = function(){ sheet.remove(); };
}

/* ---------- 탭 ---------- */
Array.prototype.forEach.call(document.querySelectorAll('footer button'), function(b){
  b.onclick = function(){
    Array.prototype.forEach.call(document.querySelectorAll('footer button'), function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    var t = b.dataset.tab;
    if(t === 'home'){ home(); }
    if(t === 'wrong'){ aiScreen(); }
    if(t === 'stats'){ stats(); }
    if(t === 'pass'){ pass(); }
  };
});
document.getElementById('back').onclick = function(){ state.view = 'home'; state.mode = 'practice'; home(); };

/* ---------- 시작 ---------- */
var QB_VER = '2026-11-22';
function loadQB(){
  return fetch('qb.json?v=' + QB_VER, { cache:'no-cache' }).then(function(res){
    if(!res.ok) throw new Error('qb.json ' + res.status);
    return res.json();
  }).then(function(data){
    QB = data;
    YEARS = [];
    QB.forEach(function(q){ if(YEARS.indexOf(q.year) < 0) YEARS.push(q.year); });
    YEARS.sort(function(a,b){ return b - a; });
    TOTAL_Q = QB.length;
    buildMeta();
  });
}
function selftest(){
  var out = [], fail = 0;
  function ok(name, cond, extra){
    out.push((cond ? 'PASS' : 'FAIL') + ' · ' + name + (extra !== undefined ? ' — ' + extra : ''));
    if(!cond) fail++;
  }
  ok('문항 로드', QB.length === 1600, QB.length);
  ok('연도 5개', YEARS.length === 5, YEARS.join(','));
  var meta = 0, areaN = 0, termN = 0, textN = 0, trapN = 0;
  QB.forEach(function(q){
    var m = QMETA[q.id];
    if(m) meta++;
    if(m && m.traps.length) trapN++;
    if(q.stem){ textN++; if(m && m.area) areaN++; if(m && m.terms.length) termN++; }
  });
  ok('분석 메타 전체', meta === QB.length, meta);
  ok('개념 영역 커버리지 85%↑', areaN / textN >= 0.85, Math.round(areaN/textN*100) + '%');
  ok('개념어 커버리지 25%↑', termN / textN >= 0.25, Math.round(termN/textN*100) + '%');
  ok('문항 유형 태깅 85%↑', trapN / QB.length >= 0.85, Math.round(trapN/QB.length*100) + '%');
  ok('이미지 문항 영역 없음 처리', QB.filter(function(q){ return q.imgonly; }).every(function(q){ return QMETA[q.id].area === null; }));
  var backup = {};
  [LS.ans, LS.wrong, LS.pass, LS.log].forEach(function(k){ backup[k] = localStorage.getItem(k); });
  try{
    var sim = {}, picks = QB.filter(function(q){ return q.stem; }).slice(0, 40), expW = 0;
    picks.forEach(function(q, i){
      var ans = (q.answer || [])[0] || 1, right = (i % 3 !== 0);
      if(!right) expW++;
      sim[q.id] = { n:1, w:right ? 0 : 1, pick:right ? ans : (ans % 4) + 1, at:Date.now() };
    });
    lsSet(LS.ans, sim); lsSet(LS.wrong, {}); lsSet(LS.pass, []);
    var A = analyzeAll();
    ok('푼 문항 집계', A.nAnswered === 40, A.nAnswered);
    ok('오답 집계', A.nWrongRecs === expW, A.nWrongRecs + '/' + expW);
    ok('오답 문항 목록', A.misses.length === expW, A.misses.length);
    ok('전체 정답률', A.acc === Math.round((40-expW)/40*100), A.acc + '%');
    ok('과목 랭킹 정렬', A.subjects.length > 0 && A.subjects[0].w >= A.subjects[A.subjects.length-1].w);
    ok('영역 랭킹 생성', A.areas.length > 0, A.areas.length);
    ok('함정 통계 생성', A.traps.length > 0, A.traps.length);
    ok('함정 TOP 표본 조건', !A.trapTop || A.trapTop.n >= 2);
    ok('정답률 범위', A.subjects.concat(A.areas).every(function(x){ return x.acc >= 0 && x.acc <= 100; }));
    ok('복습 루틴 생성', routineBlocks(A).length > 0, routineBlocks(A).length);
    ok('종합 진단 문장', verdict(A).length > 40);
    ok('문항 카드 정답·내답', missCard(A.misses[0]).indexOf('내 답') >= 0);    var preview = aiHeader(A) + aiSubjectRank(A, 1) + aiMissCards(A, 1) + aiLockCard();
    ok('미리보기 구성', preview.indexOf('취약 과목 랭킹') >= 0 && preview.indexOf('1,900원') >= 0);
    ok('미리보기에서 전체 영역 숨김', preview.indexOf('취약 개념 영역') < 0);
    lsSet(LS.pass, [{ code:'EARLY-1900', at:Date.now() }]);
    ok('코드 등록 후 이용권', isPaid() === true);
    var full = aiSubjectRank(A, 99) + aiAreaRank(A, 8) + aiTrapBlock(A) + aiMissCards(A, 20) + aiRoutine(A);
    ok('전체 분석 구성', full.indexOf('취약 개념 영역') >= 0 && full.indexOf('복습 루틴') >= 0);
    ok('전체 분석에서 상위 20문항', (full.match(/mcard/g) || []).length <= 20);
  } finally {
    [LS.ans, LS.wrong, LS.pass, LS.log].forEach(function(k){
      try{ if(backup[k] == null) localStorage.removeItem(k); else localStorage.setItem(k, backup[k]); }catch(e){}
    });
  }
  out.push(fail ? ('실패 ' + fail + '건') : '전체 통과');
  document.getElementById('title').textContent = 'selftest';
  document.getElementById('back').hidden = true;
  app().innerHTML = '<pre style="white-space:pre-wrap;font-size:12px;line-height:1.7">' + esc(out.join('\n')) + '</pre>';
}

(function boot(){
  track('app_visit', { ref:document.referrer ? String(document.referrer).slice(0,160) : '', path:location.pathname });
  app().innerHTML = '<div class="empty">기출 문항을 불러오는 중입니다…</div>';
  var TEST = String(location.search).indexOf('selftest=1') >= 0;
  loadQB().then(function(){ if(TEST) selftest(); else home(); }).catch(function(){
    app().innerHTML = '<div class="empty">문항을 불러오지 못했습니다.<br>잠시 후 새로고침해 주세요.</div>';
  });
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
