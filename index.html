<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스포츠지도사 기출 | ALPHA 2027</title>
<meta name="description" content="2021·2022·2023·2025년 국민체육진흥공단 공개 기출 1,280문항. 2급·1급 전 과목 1~5번 문항을 결제 없이 풀고 즉시 채점합니다. 연도별 기출·5개년 랜덤 모의고사·오답 자동 복습으로 이어집니다.">

<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--sub:#6b7280;--line:#e5e7eb;--brand:#2563eb;--ok:#059669;--bad:#dc2626;--amber:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;flex:1}
.back{border:0;background:none;font-size:20px;color:var(--ink);padding:0 4px;cursor:pointer}
.wrap{padding:16px;max-width:640px;margin:0 auto}
.note{background:#f3f4f6;border:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.5;padding:10px 12px;border-radius:10px;margin-bottom:14px}
.chips{display:flex;gap:8px;margin-bottom:10px}
.ychips{display:flex;gap:6px;margin:0 0 16px;overflow-x:auto;padding-bottom:2px}
.ychip{flex:0 0 auto;padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:99px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
.ychip span{font-weight:600;color:#9ca3af;font-size:11px}
.ychip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ychip.on span{color:#cbd5e1}
.choices.imgonly{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.choices.imgonly .choice{justify-content:center;padding:14px 0}
.choices.imgonly .choice i{font-size:20px}
.chip{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer}
.chip.on{border-color:var(--brand);color:var(--brand);background:#eff6ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer}
.subj b{display:block;font-size:14px;margin-bottom:4px}
.subj span{font-size:12px;color:var(--sub)}
.row{display:flex;gap:10px;margin:16px 0}
.btn{flex:1;padding:14px;border-radius:14px;border:0;background:var(--brand);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:10px}
.pbar{height:6px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:16px}
.pbar>i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}
.stem{font-size:16px;line-height:1.65;margin:0 0 16px;white-space:pre-wrap}
.choices{display:flex;flex-direction:column;gap:10px}
.qfig{margin:10px 0 14px;padding:8px;border:1px solid var(--line,#e3e6ea);border-radius:10px;background:#fff}
.qfig img{display:block;width:100%;height:auto;border-radius:6px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:13px 14px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:14px;line-height:1.55;cursor:pointer}
.choice i{font-style:normal;font-weight:700;color:var(--sub);flex:0 0 18px}
.choice.ok{border-color:var(--ok);background:#ecfdf5}

.choice.bad{border-color:var(--bad);background:#fef2f2}
.choice.bad i{color:var(--bad)}
.feedback{font-size:13px;line-height:1.6;margin-top:12px;padding:12px;border-radius:12px;display:none}
.feedback.show{display:block}
.feedback.ok{background:#ecfdf5;color:#065f46}
.feedback.bad{background:#fef2f2;color:#991b1b}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:40px 0}
.big{font-size:40px;font-weight:800;margin:8px 0}
.muted{color:var(--sub);font-size:13px}
.lic{font-size:11px;color:var(--sub);line-height:1.6;margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
.lock{background:#111827;color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
.lock h3{margin:0 0 6px;font-size:15px}
.lock p{margin:0 0 12px;font-size:12px;color:#cbd5e1;line-height:1.5}
.lock input{width:100%;padding:12px;border-radius:10px;border:0;font-size:14px;margin-bottom:10px}
.card input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid var(--line);font-size:14px;margin-bottom:8px;background:#fff;color:var(--ink)}
.lock button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:14px}
.okmsg{font-size:12px;color:#a7f3d0;margin-top:8px}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
footer button{flex:1;border:0;background:none;font-size:11px;color:var(--sub);display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer}
footer button.on{color:var(--brand);font-weight:700}
footer i{font-style:normal;font-size:18px}
/* ===== ALPHA 2027 전환 레이어 (2026-11-19) ===== */
.hero{background:linear-gradient(160deg,#111827 0%,#1f2937 70%,#243447 100%);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
.hero .tag{display:inline-block;font-size:11px;font-weight:700;color:#bfdbfe;border:1px solid #3b4a63;border-radius:99px;padding:3px 9px;margin-bottom:8px}
.hero b{display:block;font-size:17px;line-height:1.4;margin:0 0 8px}
.hero p{font-size:12.5px;color:#cbd5e1;line-height:1.55;margin:0 0 12px}
.hero button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.hero .hero-sub{font-size:12px;color:#93c5fd;margin:10px 0 0}
.hero .hero-sub a{color:#bfdbfe}
.sec-title{font-size:13px;font-weight:800;color:var(--sub);margin:18px 0 8px}
.subj.locked{opacity:.6}
.subj.locked b::after{content:" 🔒";font-size:11px}
.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 4px}
.kpi>div{background:#f9fafb;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.kpi b{display:block;font-size:19px;line-height:1.3}
.kpi span{font-size:11px;color:var(--sub)}
.subjrow{margin-top:10px}
.subjrow .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink)}
.subjrow .lab span{color:var(--sub)}
.subjbar{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:6px}
.subjbar>i{display:block;height:100%;background:var(--ok)}
.subjbar>i.warn{background:var(--amber)}
.subjbar>i.bad{background:var(--bad)}
.plan{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff}
.plan.live{border-color:#93c5fd;background:#eff6ff}
.plan .ptop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.plan b{font-size:14px}
.plan .price{font-size:14px;font-weight:800;color:var(--brand);white-space:nowrap}
.plan p{font-size:12px;color:var(--sub);line-height:1.5;margin:6px 0 0}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:#ecfdf5;color:#065f46;margin-left:4px;vertical-align:1px}
.badge.soon{background:#fef3c7;color:#92400e}
.badge.dark{background:#1f2937;color:#e5e7eb}
.copy-line{background:#f9fafb;border-left:3px solid var(--brand);padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.55;margin-bottom:8px;color:#1f2937}
.feat{font-size:13px;line-height:1.6;margin:4px 0 0;padding-left:18px;position:relative;color:var(--ink)}
.feat::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800}
.feat.soon::before{content:"•";color:var(--amber)}
.lockcard{background:#111827;color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.lockcard b{font-size:14px;display:block;margin-bottom:6px}
.lockcard p{font-size:12px;color:#cbd5e1;line-height:1.55;margin:0 0 12px}
.lockcard button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:800;font-size:13.5px;cursor:pointer}
.sharebox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sharebox button{padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
.sharebox button.primary{background:#111827;color:#fff;border-color:#111827}
.sharebox button.wide{grid-column:1 / -1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#fff;font-size:13px;padding:10px 16px;border-radius:99px;z-index:60;opacity:0;transition:opacity .18s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.55);display:flex;align-items:flex-end;z-index:55}
.modal .sheet{background:#fff;width:100%;max-height:84vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.modal .sheet h3{margin:0 0 6px;font-size:16px}
.modal .sheet p{font-size:13px;line-height:1.6;color:#374151;margin:0 0 10px}
.modal .sheet .rowx{display:flex;gap:8px;margin-top:6px}
.modal .sheet .rowx button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.modal .sheet .rowx button.dark{background:var(--brand);color:#fff;border-color:var(--brand)}
.mev{font-size:12.5px;line-height:1.9;color:#374151;border-bottom:1px dashed var(--line);padding:6px 0;display:flex;justify-content:space-between;gap:8px}
.mev b{font-variant-numeric:tabular-nums}
.mini{font-size:11px;color:var(--sub);line-height:1.6}
a.inline{color:var(--brand);text-decoration:none;font-weight:700}
/* 하단 고정 탭이 콘텐츠를 가리지 않도록 여유 확보 */
body{padding-bottom:96px}
.row:last-child{margin-bottom:24px}
/* 풀이 중에는 하단 탭을 숨겨 '다음 문제' 버튼이 가려지지 않게 한다 */
body.quiz-mode{padding-bottom:24px}
body.quiz-mode footer{display:none}
/* ===== 합격 코치 카드 (2026-11-19) ===== */
.buyline{display:flex;align-items:baseline;gap:8px;margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.buyline b{font-size:22px;letter-spacing:-.02em}
.buyline span{font-size:12px;color:var(--sub)}
.codebtn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
.card .feat{margin:2px 0}
</style>
</head>
<body>
<header><button class="back" id="back" hidden>&larr;</button><h1 id="title">스포츠지도사 기출</h1></header>
<div class="wrap" id="app"></div>
<footer>
<button data-tab="home" class="on"><i>&#127968;</i>홈</button>
<button data-tab="wrong"><i>&#128221;</i>오답노트</button>
<button data-tab="stats"><i>&#128200;</i>통계</button>
<button data-tab="pass"><i>&#128273;</i>이용권</button>
</footer>

<script>
/* ================= 스포츠지도사 기출 · ALPHA 2027 합격 코치 레이어 =================
   2026-11-19 개편: 2급·1급 전 과목 1~5번 문항을 결제 없이 오픈하고,
   6번부터·오답 복습·취약 단원·모의고사에서 담백한 이용권 안내로 이어집니다.
   2026-11-20 5개년 확장: 2021·2022·2023·2025 공단 기출 1,280문항(qb.json + img/*.webp),
   연도 선택·연도 무작위 모의고사. 코드(EARLY-1900)·이벤트(sd_ev)·오답(sd_wrong) 유지.
============================================================================== */
let QB = [];
let YEARS = [];
const LS = { wrong:'sd_wrong', fav:'sd_fav', pass:'sd_pass', log:'sd_log', ev:'sd_ev', utm:'sd_utm', level:'sd_level', free:'sd_free_last', year:'sd_year' };
const CODES = ['KLYGYM-2026','EARLY-1900'];
const STORE = {
  home : 'https://www.latpeed.com/stores/U4AOc',
  pass : 'https://www.latpeed.com/products/veLnh',   // 1,900원 평생 이용권
  free : 'https://www.latpeed.com/products/q7pOP',   // 0원 맛보기 PDF
  threads : 'https://www.threads.net/@alpphaflow2027'
};
const SUBJ_ORDER = ['스포츠사회학','스포츠교육학','스포츠심리학','한국체육사','운동생리학','운동역학','스포츠윤리','특수체육론','유아체육론','노인체육론','운동상해','체육측정평가론','트레이닝론','스포츠영양학','건강교육론','장애인스포츠론'];
const CIRC = ['①','②','③','④'];
const FREE_N = 5;                     // 과목별 무료 문항 수 (1~5번)
const FREE_SUBJECT = '스포츠사회학';   // 홈 대표 시작 과목
const FREE_LEVEL = '2급';

function lsGet(k, d){ try{ const v = localStorage.getItem(k); if(v == null) return d; const p = JSON.parse(v); return p == null ? d : p; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

const S = {
  get wrong(){ const v = lsGet(LS.wrong, {}); return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; },
  set wrong(v){ lsSet(LS.wrong, v); },
  get fav(){ const v = lsGet(LS.fav, {}); return (v && typeof v === 'object') ? v : {}; },
  get passes(){ const v = lsGet(LS.pass, []); return Array.isArray(v) ? v : []; },
  get log(){ const v = lsGet(LS.log, []); return Array.isArray(v) ? v : []; },
  get level(){ return lsGet(LS.level, null) === '1급' ? '1급' : '2급'; },
  get year(){ const v = lsGet(LS.year, null); return (v === 'all' || v == null) ? null : (YEARS.includes(Number(v)) ? Number(v) : null); },
  set year(v){ lsSet(LS.year, v == null ? 'all' : Number(v)); },
  set level(v){ lsSet(LS.level, v === '1급' ? '1급' : '2급'); },
  get freeLast(){ const v = lsGet(LS.free, null); return (v && typeof v === 'object' && v.total) ? v : null; }
};

/* ---------- 유입(UTM) ---------- */
const UTM = (function(){
  const keys = ['source','medium','campaign','content','term'];
  let cur = {}, p = null;
  try{ p = new URLSearchParams(location.search); }catch(e){}
  if(p) keys.forEach(k => { const v = p.get('utm_' + k); if(v) cur[k] = String(v).slice(0,40); });
  const prev = lsGet(LS.utm, null) || {};
  if(Object.keys(cur).length){
    const rec = Object.assign({}, prev, cur, { first_at: prev.first_at || Date.now(), last_at: Date.now(), hits: (prev.hits || 0) + 1, landing: String(location.href).split('#')[0].slice(0,300) });
    lsSet(LS.utm, rec);
    return rec;
  }
  return prev;
})();

/* ---------- 전환 이벤트 ---------- */
function track(name, extra){
  try{
    const ev = lsGet(LS.ev, []);
    const list = Array.isArray(ev) ? ev : [];
    const rec = Object.assign({ name: name, at: Date.now(), src: UTM.source || '', level: S.level, view: (state && state.mode) || '' }, extra || {});
    list.push(rec);
    lsSet(LS.ev, list.slice(-500));
  }catch(e){}
}

/* ---------- 기본 도구 ---------- */
const app = () => document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isPaid = () => S.passes.length > 0;
const pctOf = (c, t) => t ? Math.round(c / t * 100) : 0;
const cut = (s, n) => { s = String(s).replace(/\s+/g,' ').trim(); return s.length > n ? s.slice(0, n) + '…' : s; };
function byLevel(lv, y){ return QB.filter(q => q.level === lv && (!y || q.year === y)); }
function bySubject(lv, subj, y){ const yy = (y === undefined) ? S.year : y; return byLevel(lv, yy).filter(q => q.subject === subj).sort((a,b)=> (b.year - a.year) || (a.qno - b.qno)); }
function yearCount(lv, y){ return byLevel(lv, y).length; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const levelSubjects = (lv) => SUBJ_ORDER.filter(s => bySubject(lv, s).length);
let TOTAL_Q = 0;

/* ---------- 무료 범위: 전 과목 1~5번 ---------- */
function freeHead(lv, subj){ return bySubject(lv, subj).filter(q => q.qno <= FREE_N); }
function isFreeQ(q){ return q.qno >= 1 && q.qno <= FREE_N; }
function freeCount(lv){ return levelSubjects(lv).reduce((n, s) => n + freeHead(lv, s).length, 0); }

const state = { items: [], idx: 0, correct: 0, answered: false, view: 'home', tab: 'home', miss: [], mode: 'practice', label: '', subject: '', lv: '', mockStart: 0 };
let mockTick = null;

function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._tm); toast._tm = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ---------- 모의고사 타이머 ---------- */
function stopTimer(){ if(mockTick){ clearInterval(mockTick); mockTick = null; } }
function fmtClock(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
}
function startTimer(){
  stopTimer();
  const up = () => {
    const el = document.getElementById('mtimer');
    if(!el) return;
    el.textContent = fmtClock(Date.now() - (state.mockStart || Date.now()));
  };
  up();
  mockTick = setInterval(up, 1000);
}

/* ---------- 이용권 안내 카드 (담백한 코치 톤) ---------- */
function offerCard(title, desc){
  return `<div class="card">
    <b style="font-size:15px;line-height:1.5">${esc(title)}</b>
    <p class="muted" style="margin:6px 0 4px;line-height:1.65">${desc}</p>
    <p class="feat">전 과목 ${TOTAL_Q}문항 — 2급 ${byLevel('2급').length} · 1급 ${byLevel('1급').length}</p>
    <p class="feat">내 약점 오답 자동 복습 · 오답만 다시 풀기</p>
    <p class="feat">취약 단원 진단 (내 오답 기록 기준)</p>
    <p class="feat">실전 모의고사 · 타이머</p>
    <p class="feat">과목별 정답률 · 학습 기록</p>
    <div class="buyline"><b>1,900원</b><span>평생 이용권 · 래피드 결제</span></div>
    <button class="btn" id="buy" style="width:100%">1,900원으로 전체 열기</button>
    <p class="mini" style="margin:12px 0 6px">이미 코드가 있다면 (예: EARLY-1900)</p>
    <input id="code" placeholder="이용권 코드" autocomplete="off">
    <button class="codebtn" id="redeem">코드 등록</button>
    <p class="mini" id="msg" style="margin:8px 0 0"></p>

/* ---------- 풀이 ---------- */
function start(items, label, mode, opts){
  if(!items.length){ toast('문항을 준비하지 못했습니다.'); return; }
  opts = opts || {};
  if(!isPaid() && opts.gate) return gate(opts.reason || 'locked_start', opts.subject || '');
  stopTimer();
  state.items = items; state.idx = 0; state.correct = 0; state.miss = [];
  state.view = 'quiz'; state.answered = false;
  state.label = label; state.mode = mode || 'practice';
  state.subject = opts.subject || (items.every(q => q.subject === items[0].subject) ? items[0].subject : '');
  state.lv = items[0].level;
  state.mockStart = state.mode === 'mock' ? Date.now() : 0;
  document.getElementById('back').hidden = false;
  renderQ();
}

function renderQ(){
  const q = state.items[state.idx];
  state.answered = false;
  document.body.classList.add('quiz-mode');
  document.getElementById('title').textContent = state.label;
  const pct = Math.round(state.idx / state.items.length * 100);
  const timer = state.mode === 'mock' ? ' · <b id="mtimer" style="font-variant-numeric:tabular-nums">00:00</b>' : '';
  app().innerHTML = `
    <div class="qmeta"><span>${esc(q.subject)} · ${q.year}년 ${esc(q.level)}</span><span>${state.idx+1} / ${state.items.length}${timer}</span></div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="card">
      <p class="stem">${esc(q.stem)}</p>
      ${q.img ? `<figure class="qfig"><img src="${q.img}" alt="문제 자료(그림·표)" loading="lazy"></figure>` : ''}
      ${q.imgonly ? '<p class="mini" style="margin:2px 0 8px">보기 그림·표의 ①~④ 중에서 고르세요.</p>' : ''}
      <div class="choices ${q.imgonly ? 'imgonly' : ''}" id="ch">
        ${q.choices.map((c,i)=>`<button class="choice" data-i="${i+1}"><i>${CIRC[i]}</i>${q.imgonly ? '' : `<span>${esc(c)}</span>`}</button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <div class="row" id="nextRow" style="display:none"><button class="btn" id="next">다음 문제</button></div>
      ${state.mode === 'free5' && state.idx + 1 >= state.items.length ? '<p class="mini" style="text-align:center;margin:0">이 과목은 6번부터 20문항이 남아 있습니다.</p>' : ''}
    </div>`;
  document.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(parseInt(b.dataset.i,10), q));
  if(state.mode === 'mock') startTimer(); else stopTimer();
}

function answer(pick, q){
  if(state.answered) return;
  state.answered = true;
  const ans = q.answer || [];
  const right = ans.includes(pick);
  if(right) state.correct++;
  document.querySelectorAll('.choice').forEach(b => {
    const i = parseInt(b.dataset.i,10);
    if(ans.includes(i)) b.classList.add('ok');
    else if(i === pick) b.classList.add('bad');
    b.onclick = null;
  });
  const fb = document.getElementById('fb');
  fb.className = 'feedback show ' + (right ? 'ok' : 'bad');
  fb.innerHTML = right
    ? `정답입니다. 정답 ${ans.map(a=>CIRC[a-1]).join('·')}`
    : `오답입니다. 정답은 ${ans.map(a=>CIRC[a-1]).join('·')}${ans.length===4?' (전 항목 정답 처리 문항)':''}`;
  if(!right){ const w = S.wrong; w[q.id] = { id:q.id, at:Date.now() }; S.wrong = w; state.miss.push(q); }
  document.getElementById('nextRow').style.display = 'flex';
  document.getElementById('next').onclick = next;
  document.getElementById('next').textContent = state.idx + 1 >= state.items.length ? '결과 보기' : '다음 문제';
  setTimeout(function(){ const nr = document.getElementById('nextRow'); if(nr && nr.scrollIntoView) nr.scrollIntoView({ block: 'center' }); }, 40);
}

function next(){
  state.idx++;
  if(state.idx >= state.items.length) return finish();
  renderQ();
}

function finish(){
  stopTimer();
  document.body.classList.remove('quiz-mode');
  const total = state.items.length, c = state.correct;
  const subjects = Array.from(new Set(state.items.map(q => q.subject)));
  const log = S.log.slice();
  log.push({ level: state.lv || S.level, subject: subjects.length === 1 ? subjects[0] : (state.mode === 'mock' ? '모의고사' : '혼합'), total: total, correct: c, at: Date.now(), mode: state.mode });
  lsSet(LS.log, log.slice(-200));

  if(state.mode === 'free5'){
    const res = buildFreeResult(state.lv || S.level, state.items, c, state.miss.map(q => q.id));
    res.subject = subjects.length === 1 ? subjects[0] : '전 과목';
    lsSet(LS.free, res);
    track('free_complete', { level: res.lv, subject: res.subject, correct: c, total: total, pct: pctOf(c,total), n: total });
    renderFreeResult(res, true);
    return;
  }

  const pct = pctOf(c, total);
  const spent = state.mockStart ? Math.round((Date.now() - state.mockStart) / 1000) : 0;
  const timeLine = state.mode === 'mock' && spent ? ` · 경과 ${Math.floor(spent/60)}분 ${spent%60}초` : '';
  app().innerHTML = `
    <div class="card" style="text-align:center">
      <p class="muted">${esc(state.label)} 결과</p>
      <div class="big">${c} / ${total}</div>
      <p class="muted">정답률 ${pct}%${timeLine} · 오답 ${total-c}문항이 오답노트에 저장됐습니다</p>
      <div class="row">
        <button class="btn" id="again">다시 풀기</button>
        <button class="btn ghost" id="home2">홈으로</button>
      </div>
    </div>
    <div class="card">
      <b style="font-size:14px">틀린 문항 ${state.miss.length}개</b>
      ${state.miss.length ? state.miss.map(q=>`<p class="muted" style="margin:8px 0 0">${esc(q.subject)} ${q.qno}번 · 정답 ${(q.answer||[]).map(a=>CIRC[a-1]).join('·')}</p>`).join('') : '<p class="muted" style="margin:8px 0 0">틀린 문항이 없습니다.</p>'}
    </div>`;
  document.getElementById('again').onclick = () => start(state.items, state.label, state.mode, { subject: state.subject });
  document.getElementById('home2').onclick = () => { state.view='home'; home(); };
}

/* ---------- 무료 5문항 결과 ---------- */
function buildFreeResult(lv, items, correct, missIds){
  const map = {};
  items.forEach(q => { map[q.subject] = map[q.subject] || { subject: q.subject, total: 0, correct: 0, miss: [] }; map[q.subject].total++; });
  items.forEach(q => {
    if(!missIds.includes(q.id)) map[q.subject].correct++;
    else map[q.subject].miss.push(q.id);
  });
  const subs = Object.keys(map).map(k => {
    const s = map[k];
    return { subject: s.subject, total: s.total, correct: s.correct, miss: s.miss, pct: pctOf(s.correct, s.total) };
  }).sort((a,b) => a.pct - b.pct || b.miss.length - a.miss.length || a.subject.localeCompare(b.subject));
  return { at: Date.now(), lv: lv, total: items.length, correct: correct, missIds: missIds.slice(), subs: subs };
}
function weakOf(res){ return res.subs.filter(s => s.pct < 100); }
function missQuestions(res){ return (res.missIds || []).map(id => QB.find(q => q.id === id)).filter(Boolean); }

const APP_URL = 'https://setoo28-hue.github.io/sports-exam-pass/';
function shareUrl(){ return APP_URL + '?utm_source=threads&utm_medium=share&utm_campaign=free5'; }
function shareText(res){
  return '스포츠지도사 기출 ' + res.total + '문항 중 ' + res.correct + '문항 정답 (' + pctOf(res.correct, res.total) + '%).\n전 과목 1~5번 문항은 무료로 풀 수 있습니다.\n\n무료 학습은 ALPHA 2027에서.';
}
function shareBox(){
  return `<div class="sharebox">
    <button class="primary" data-share="threads">스레드로 공유</button>
    <button data-share="copy">문구·링크 복사</button>
    <button class="wide" data-share="native">다른 앱으로 공유 (모바일)</button>
  </div>`;
}
function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(t).then(() => true).catch(() => legacyCopy(t)); } }catch(e){}
  return Promise.resolve(legacyCopy(t));
}
function legacyCopy(t){
  try{
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy'); document.body.removeChild(ta); return !!ok;
  }catch(e){ return false; }
}
function bindShare(res){
  const text = shareText(res), url = shareUrl();
  document.querySelectorAll('[data-share]').forEach(b => b.onclick = async () => {
    const kind = b.dataset.share;
    if(kind === 'threads'){
      track('share_click', { type: 'threads', pct: pctOf(res.correct, res.total) });
      const ok = await copyText(text + '\n\n' + url);
      window.open('https://www.threads.net/intent/post?text=' + encodeURIComponent(text + '\n\n' + url), '_blank');
      toast(ok ? '공유 문구를 복사했습니다. 스레드에 붙여넣으세요.' : '스레드 공유 창을 열었습니다.');
      return;
    }
    if(kind === 'copy'){
      const ok = await copyText(text + '\n\n' + url);
      track('share_copy', { ok: ok, pct: pctOf(res.correct, res.total) });
      toast(ok ? '문구와 링크를 복사했습니다.' : '복사에 실패했습니다. 길게 눌러 직접 복사해 주세요.');
      return;
    }
    track('share_click', { type: 'native' });
    if(navigator.share){
      try{
        await navigator.share({ title: '스포츠지도사 기출 무료 5문항', text: text, url: url });
        track('share_done', { type: 'native' });
      }catch(e){
        const ok = await copyText(text + '\n\n' + url);
        track('share_copy', { ok: ok, fallback: 'native_cancel' });
        toast(ok ? '공유가 취소되어 문구와 링크를 복사했습니다.' : '공유가 취소되었습니다.');
      }
    }else{
      const ok = await copyText(text + '\n\n' + url);
      track('share_copy', { ok: ok, fallback: 'no_native' });
      toast(ok ? '이 브라우저는 앱 공유를 지원하지 않아 문구를 복사했습니다.' : '복사에 실패했습니다.');
    }
  });
}

  <div class="sec-title">과목별 학습 · ${yLabel} ${paid ? '' : '· 과목마다 1~5번 무료'}</div>
  <div class="grid">
    ${subs.map(sb => `<button class="subj" data-subj="${esc(sb)}"><b>${esc(sb)}${paid ? '' : ' <span class="badge" style="vertical-align:2px">5문항 무료</span>'}</b><span>${bySubject(lv,sb).length}문항 · 정답률 ${rateOf(lv,sb)}</span></button>`).join('')}
  </div>
  <div class="row">
    <button class="btn" id="quick">랜덤 20문항 풀기</button>
    <button class="btn ghost" id="wrongBtn">오답 ${wrongN}개</button>
  </div>
  <div class="row">
    <button class="btn ghost" id="mockBtn">실전 모의고사 (5개년 랜덤)</button>
  </div>
  <div class="row">
    <button class="btn ghost" id="weakBtn">취약 과목 집중</button>
    <button class="btn ghost" id="allYearBtn">${yLabel} 전체 랜덤</button>
  </div>
  ${paid ? '<div class="card" style="padding:12px 14px"><p class="muted" style="margin:0">이용권 사용 중 · 전체 문항과 오답노트를 제한 없이 쓸 수 있습니다.</p></div>'
         : `<div class="card" style="padding:12px 14px"><p class="muted" style="margin:0">지금은 2급·1급 전 과목 1~5번 문항을 무료로 풀 수 있습니다. 6번부터·오답 복습·모의고사는 <a href="#" class="inline" id="openPlan">이용권</a>으로 이어집니다.</p></div>`}
  <div class="lic">문항 출처: 국민체육진흥공단 체육지도자 자격검정·연수원 공개 문제지(${YEARS.slice().sort((a,b)=>a-b).join('·')}년). 정답: 공단 최종 정답표. 해설은 공단 자료에 없어 미포함.</div>`;

  document.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { S.level = b.dataset.lv; home(); });
  document.querySelectorAll('[data-year]').forEach(b => b.onclick = () => {
    const v = b.dataset.year;
    S.year = (v === 'all') ? null : Number(v);
    track('year_select', { year: S.year || 'all', level: S.level });
    home();
  });
  document.querySelectorAll('[data-subj]').forEach(b => b.onclick = () => {
    const subj = b.dataset.subj;
    const items = bySubject(lv, subj);
    if(isPaid()) return start(items, `${subj}${y?` ${y}년`:' · 5개년'}`, 'practice', { gate: true, subject: subj });
    const free = freeHead(lv, subj);
    track('free_start', { level: lv, subject: subj, year: y || 'all', n: free.length, free: FREE_N });
    start(free, subj + ' 1~5번 · 무료' + (free.length > 5 ? ` (${free.length}문항)` : ''), 'free5', { subject: subj });
  });
  document.getElementById('freeStart').onclick = () => {
    const subj = levelSubjects(lv)[0];
    const free = freeHead(lv, subj);
    track('free_start', { level: lv, subject: subj, year: y || 'all', n: free.length, free: FREE_N });
    start(free, subj + ' 1~5번 · 무료' + (free.length > 5 ? ` (${free.length}문항)` : ''), 'free5', { subject: subj });
  };
  document.getElementById('quick').onclick = () => { if(!isPaid()) return gate('random'); start(shuffle(byLevel(lv)).slice(0,20), `${yLabel} 랜덤 20문항`, 'practice', { gate: true }); };
  document.getElementById('allYearBtn').onclick = () => { if(!isPaid()) return gate('random'); start(shuffle(byLevel(lv, y)), `${yLabel} 전체 랜덤`, 'practice', { gate: true }); };
  document.getElementById('wrongBtn').onclick = showWrong;
  document.getElementById('mockBtn').onclick = mock;
  document.getElementById('weakBtn').onclick = weakScreen;
  const op = document.getElementById('openPlan'); if(op) op.onclick = (e) => { e.preventDefault(); gate('home'); };
  const oc = document.getElementById('openCode'); if(oc) oc.onclick = (e) => { e.preventDefault(); pass(); };
  const lr = document.getElementById('lastRes'); if(lr) lr.onclick = (e) => { e.preventDefault(); if(last) renderFreeResult(last, false); };
}
function rateOf(lv, subj){
  const log = S.log.filter(x => x.level === lv && x.subject === subj);
  if(!log.length) return '-';
  const t = log.reduce((a,b)=>a+b.total,0), c = log.reduce((a,b)=>a+b.correct,0);
  return pctOf(c, t) + '%';
}

/* ---------- 오답노트 ---------- */
function wrongItems(){
  const w = S.wrong;
  return QB.filter(q => w[q.id]).sort((a,b) => (w[b.id].at||0) - (w[a.id].at||0));
}
function wrongCard(q){
  return `<div class="card"><div style="font-size:13px"><b>${esc(q.subject)} ${q.qno}번</b> <span class="muted">· ${q.year}년 ${esc(q.level)}</span></div>
    <p class="mini" style="margin:6px 0 0">${q.stem ? esc(cut(q.stem, 70)) : '그림·표 문항 — 앱에서 문제 보기'}</p>
    <p class="muted" style="margin:6px 0 0">정답 ${(q.answer||[]).map(a=>CIRC[a-1]).join('·')}</p></div>`;
}

function showWrong(){
  stopTimer();
  document.body.classList.remove('quiz-mode');
  track('wrong_note_open', { paid: isPaid() });
  state.view = 'wrong';
  document.getElementById('title').textContent = '오답노트';
  document.getElementById('back').hidden = false;
  const items = wrongItems();

  if(!isPaid()){
    const free = items.filter(isFreeQ);
    const firstSubj = levelSubjects(S.level)[0];
    app().innerHTML = `
      <p class="muted" style="margin-top:0">5문항에서 틀린 문항 ${free.length}개${items.length > free.length ? ` · 6번 이후 오답 ${items.length - free.length}개는 이용권에 포함` : ''}</p>
      ${free.length ? free.map(wrongCard).join('')
        : `<div class="empty">아직 오답이 없습니다.<br>과목을 골라 1~5번 문항을 풀면 틀린 문항이 여기 쌓입니다.
             <div class="row"><button class="btn" id="goFree">${firstSubj} 1~5번 풀기</button></div></div>`}
      ${free.length ? `<div class="card"><b style="font-size:14px">오답 자동 복습</b><p class="muted" style="margin:6px 0 10px;line-height:1.6">틀린 문항을 모아 다시 풀고, 오답이 많은 과목부터 정리합니다. 전체 오답노트도 함께 열립니다.</p><button class="btn" id="review" style="width:100%">오답 복습 열기</button></div>` : ''}
    `;
    const rv = document.getElementById('review');
    if(rv) rv.onclick = () => gate('wrong');
    const g = document.getElementById('goFree');
    if(g) g.onclick = () => { const it = freeHead(S.level, firstSubj); track('free_start', { level: S.level, subject: firstSubj, n: it.length, free: FREE_N }); start(it, firstSubj + ' 1~5번 · 무료', 'free5', { subject: firstSubj }); };
    bindOffer();
    return;
  }

  if(!items.length){
    app().innerHTML = '<div class="empty">아직 오답이 없습니다.<br>문제를 풀면 틀린 문항이 여기 쌓입니다.</div>';
    return;
  }
  app().innerHTML = `
    <p class="muted">${items.length}문항 · 최근 순</p>
    <div class="row"><button class="btn" id="solve">오답만 다시 풀기</button><button class="btn ghost" id="clear">비우기</button></div>
    ${items.slice(0,30).map(wrongCard).join('')}`;
  document.getElementById('solve').onclick = () => start(items, '오답 다시 풀기', 'practice');
  document.getElementById('clear').onclick = () => { if(confirm('오답노트를 비울까요? 저장된 오답 기록이 삭제됩니다.')){ S.wrong = {}; showWrong(); } };
}

/* ---------- 취약 과목 집중 학습 ---------- */
function weakScreen(){
  stopTimer();
  document.body.classList.remove('quiz-mode');
  if(!isPaid()) return gate('weak');
  document.getElementById('title').textContent = '취약 과목 집중 학습';
  document.getElementById('back').hidden = false;
  state.view = 'weak';
  const lv = S.level, w = S.wrong;
  const rows = {};
  byLevel(lv).forEach(q => { if(w[q.id]) rows[q.subject] = (rows[q.subject] || 0) + 1; });
  const list = Object.keys(rows).map(s => ({ subject: s, n: rows[s], total: bySubject(lv, s).length })).sort((a,b) => b.n - a.n);
  app().innerHTML = `
    <p class="muted">${esc(lv)} · 내 오답 기록에서 과목별로 모았습니다.</p>
    ${list.length ? list.map(r => `<button class="subj" data-ws="${esc(r.subject)}" style="display:block;width:100%;margin-bottom:8px">
        <b>${esc(r.subject)}</b><span>오답 ${r.n}개 · 전체 ${r.total}문항</span></button>`).join('')
    : '<div class="empty">아직 오답 기록이 없습니다.<br>문제를 먼저 풀어 주세요.</div>'}
    <p class="mini">오답이 많은 과목부터 배치했습니다.</p>`;
  document.querySelectorAll('[data-ws]').forEach(b => b.onclick = () => start(bySubject(lv, b.dataset.ws), b.dataset.ws + ' 집중 학습', 'practice'));
}

/* ---------- 실전 모의고사 ---------- */
function mock(){
  if(!isPaid()) return gate('mock');
  const lv = S.level;
  let items = [];
  levelSubjects(lv).forEach(sb => { items = items.concat(shuffle(bySubject(lv, sb, null)).slice(0, 2)); });
  if(!items.length){ toast('문항이 없습니다.'); return; }
  start(shuffle(items), '실전 모의고사 · ' + lv + ' ' + items.length + '문항', 'mock');
}

/* ---------- 통계 ---------- */
function stats(){
  stopTimer();
  document.body.classList.remove('quiz-mode');
  document.getElementById('title').textContent = '학습 통계';
  document.getElementById('back').hidden = true;
  state.view = 'stats';
  const log = S.log;
  const t = log.reduce((a,b) => a + b.total, 0), c = log.reduce((a,b) => a + b.correct, 0);
  if(!isPaid()){
    const recent = log.slice(-2).reverse();
    app().innerHTML = `
      <div class="card"><div class="big">${t ? Math.round(c/t*100) : 0}%</div><p class="muted">누적 ${t}문항 · 오답 ${Object.keys(S.wrong).length}개 저장</p></div>
      ${recent.length ? recent.map(x => `<div class="card" style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(x.subject)}</span><span>${x.correct}/${x.total}</span></div>`).join('') : '<div class="empty">기록이 없습니다.</div>'}
      <div class="card"><b style="font-size:14px">과목별 정답률 · 전체 기록</b><p class="muted" style="margin:6px 0 10px;line-height:1.6">과목별 정답률로 다음에 볼 과목을 정하고, 지난 기록을 이어서 봅니다.</p><button class="btn" id="goPay" style="width:100%">학습 기록 열기</button></div>`;
    document.getElementById('goPay').onclick = () => gate('stats');
    return;
  }
  const recent = log.slice(-20).reverse();
  const bySub = {};
  log.forEach(x => { if(x.subject === '혼합' || x.subject === '모의고사') return; bySub[x.subject] = bySub[x.subject] || { t:0, c:0 }; bySub[x.subject].t += x.total; bySub[x.subject].c += x.correct; });
  app().innerHTML = `
    <div class="card"><div class="big">${t ? Math.round(c/t*100) : 0}%</div><p class="muted">누적 ${t}문항 · 오답 ${Object.keys(S.wrong).length}개 저장</p></div>
    ${Object.keys(bySub).length ? `<div class="card"><b style="font-size:14px">과목별 정답률</b>${Object.keys(bySub).map(s => {
      const p = Math.round(bySub[s].c / bySub[s].t * 100);
      return `<div class="subjrow"><div class="lab"><b style="font-weight:600">${esc(s)}</b><span>${bySub[s].c}/${bySub[s].t} · ${p}%</span></div><div class="subjbar"><i class="${p>=80?'':(p>=50?'warn':'bad')}" style="width:${Math.max(4,p)}%"></i></div></div>`;
    }).join('')}</div>` : ''}
    ${recent.length ? recent.map(x => `<div class="card" style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(x.subject)}</span><span>${x.correct}/${x.total}</span></div>`).join('') : '<div class="empty">기록이 없습니다.</div>'}`;
}

/* ---------- 이용권 ---------- */
function pass(){
  stopTimer();
  document.body.classList.remove('quiz-mode');
  document.getElementById('title').textContent = '이용권';
  document.getElementById('back').hidden = true;
  state.view = 'pass';
  const paid = isPaid();
  app().innerHTML = `
    ${paid ? `<div class="card"><b>이용권 사용 중</b><p class="muted" style="margin:6px 0 0">5개년 ${TOTAL_Q}문항과 오답 복습·모의고사를 제한 없이 씁니다.</p><p class="mini" style="margin:8px 0 0"><a href="#" id="release" style="text-decoration:underline">이 기기에서 이용권 해제</a></p></div>` : ''}
    ${paid ? '' : offerCard('전체 학습 이용권', `1,900원 한 번으로 5개년 ${TOTAL_Q}문항, 오답 복습, 취약 단원, 실전 모의고사까지 엽니다.`)}
    ${paid ? '' : `<div class="card"><b style="font-size:14px">무료로 쓸 수 있는 범위</b><p class="muted" style="margin:6px 0 0;line-height:1.6">2급·1급 전 과목 1~5번 문항 — 즉시 채점과 정답 확인까지 무료입니다. 6번부터 20번, 오답 복습, 모의고사, 학습 기록은 이용권이 필요합니다.</p></div>`}
    <div class="card"><b style="font-size:14px">안내</b><p class="muted" style="margin:6px 0 0;line-height:1.6">문항은 2021·2022·2023·2025년 국민체육진흥공단 공개 문제지 기반이며, 정답은 공단 최종 정답표를 따릅니다. 해설은 공단 자료에 없어 아직 제공하지 않습니다.</p></div>
    <p style="text-align:center;margin:18px 0 8px"><a href="#" id="mt" class="mini" style="text-decoration:underline">전환 지표 보기 (관리자)</a></p>`;
  bindOffer();
  const rl = document.getElementById('release');
  if(rl) rl.onclick = (e) => { e.preventDefault(); if(confirm('이 기기에서 이용권을 해제할까요? 다시 쓰려면 코드를 입력해야 합니다.')){ lsSet(LS.pass, []); track('pass_release', {}); pass(); } };
  document.getElementById('mt').onclick = (e) => { e.preventDefault(); metrics(); };
}

/* ---------- 전환 지표 ---------- */
function metrics(){
  const ev = lsGet(LS.ev, []); const list = Array.isArray(ev) ? ev : [];
  const cnt = n => list.filter(e => e.name === n).length;
  const fs = cnt('free_start'), fc = cnt('free_complete'), pv = cnt('paywall_view'), cc = cnt('checkout_click');
  const sc = cnt('share_click') + cnt('share_copy');
  const rate = (a,b) => b ? Math.min(100, Math.round(a/b*100)) + '%' : '-';
  const row = (label, v) => `<div class="mev"><span>${label}</span><b>${v}</b></div>`;
  const utmSrc = {};
  list.forEach(e => { if(e.src) utmSrc[e.src] = (utmSrc[e.src] || 0) + 1; });
  const sheet = document.createElement('div');
  sheet.className = 'modal';
  sheet.innerHTML = `<div class="sheet">
    <h3>전환 지표 (이 브라우저 기록)</h3>
    <p>이 기기의 localStorage에 쌓인 이벤트입니다. 방문자 전체 통계는 서버 저장소가 필요합니다.</p>
    ${row('앱 방문', cnt('app_visit'))}
    ${row('무료 문제 시작', fs)}
    ${row('무료 문제 완료', fc)}
    ${row('무료 완료율', rate(fc, fs))}
    ${row('오답노트 진입', cnt('wrong_note_open'))}
    ${row('이용권 안내 진입', pv)}
    ${row('이용권 안내율', rate(pv, fc))}
    ${row('결제 시도(클릭)', cc)}
    ${row('결제 클릭률', rate(cc, pv))}
    ${row('공유 클릭/복사', sc)}
    ${row('공유 이용률', rate(sc, fc))}
    ${row('이용권 코드 등록', cnt('pass_redeem'))}
    <p class="mini" style="margin-top:12px">비율은 기기 안 이벤트 횟수 기준(무료 학습 재시작이 많으면 100%로 표시)</p>
    <p class="mini">유입 경로(utm_source): ${Object.keys(utmSrc).length ? Object.keys(utmSrc).map(k => esc(k) + ' ' + utmSrc[k]).join(' · ') : '기록 없음'}</p>
    <p class="mini">최근 이벤트: ${list.slice(-5).reverse().map(e => esc(e.name)).join(' ← ') || '없음'}</p>
    <p class="mini">결제 성공·실패는 래피드(외부 결제)에서 처리되어 앱에서는 확인할 수 없습니다.</p>
    <div class="rowx"><button id="mClose">닫기</button></div>
  </div>`;
  document.body.appendChild(sheet);
  sheet.addEventListener('click', (e) => { if(e.target === sheet) sheet.remove(); });
  sheet.querySelector('#mClose').onclick = () => sheet.remove();
}

/* ---------- 탭 ---------- */
document.querySelectorAll('footer button').forEach(b => b.onclick = () => {
  document.querySelectorAll('footer button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  const t = b.dataset.tab;
  if(t==='home'){ state.view='home'; state.mode='practice'; home(); }
  if(t==='wrong'){ showWrong(); }
  if(t==='stats'){ stats(); }
  if(t==='pass'){ pass(); }
});
document.getElementById('back').onclick = () => { state.view='home'; state.mode='practice'; home(); };

/* ---------- 시작 ---------- */
const QB_VER = '2026-11-21a';
async function loadQB(){
  const res = await fetch('qb.json?v=' + QB_VER, { cache: 'no-cache' });
  if(!res.ok) throw new Error('qb.json ' + res.status);
  QB = await res.json();
  YEARS = Array.from(new Set(QB.map(q => q.year))).sort((a,b) => b - a);
  TOTAL_Q = QB.length;
}
(function boot(){
  track('app_visit', { ref: document.referrer ? String(document.referrer).slice(0,160) : '', path: location.pathname });
  app().innerHTML = '<div class="empty">기출 문항을 불러오는 중입니다…</div>';
  loadQB().then(() => home()).catch(() => {
    app().innerHTML = '<div class="empty">문항을 불러오지 못했습니다.<br>잠시 후 새로고침해 주세요.</div>';
  });
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
